# Glossary — plain-English definitions shown on hover in every lesson.
# term: the display name; aliases: other spellings matched in the text (case-insensitive).
# Keep definitions to 1–3 sentences. Markdown `code` and **bold** are allowed.

- term: Activation function
  aliases: [activation functions, non-linearity, nonlinearity]
  def: A simple non-linear function (such as ReLU, sigmoid or tanh) applied to each neuron's weighted sum. Without it, stacked layers collapse into a single linear model.
- term: Adam
  aliases: [AdamW]
  def: A popular optimizer that gives every parameter its own adaptive step size, using running averages of recent gradients and their squares. AdamW is Adam with weight decay applied correctly.
- term: Architecture
  def: The design of a network — which layers, how many, how wide, and how they connect. It encodes built-in assumptions about the data.
- term: Backpropagation
  aliases: [backprop, backward pass]
  def: The algorithm that computes the gradient of the loss with respect to every parameter, by applying the chain rule backwards through the computational graph. It assigns "credit" or "blame" to each parameter.
- term: Baseline
  aliases: [baselines]
  def: A simple reference result (e.g. always predicting the majority class, or a logistic regression) that any serious model must beat to be worth its cost.
- term: Batch
  aliases: [mini-batch, minibatch, batch size]
  def: A small group of training examples processed together in one forward and backward pass. The batch size is how many examples it contains.
- term: Bias (parameter)
  aliases: [bias term, biases]
  def: A learned number added to a neuron's weighted sum, letting it shift its output independently of the inputs — like the intercept in linear regression.
- term: Broadcasting
  def: The rule that lets tensors of different shapes be combined element-wise by virtually stretching size-1 dimensions. Powerful, and a source of silent bugs when shapes are not what you think.
- term: Checkpoint
  aliases: [checkpoints, checkpointing]
  def: A saved snapshot of training — model weights, optimizer state, epoch and config — from which you can resume or reproduce a run.
- term: Class imbalance
  aliases: [imbalanced, imbalanced classification]
  def: When one class is much rarer than another (e.g. 11.7% positives). Plain accuracy becomes misleading, so metrics like ROC-AUC and average precision are used.
- term: Computational graph
  def: The record of every operation used to compute the loss from the inputs and parameters. Backpropagation walks it backwards to compute gradients.
- term: CrossEntropyLoss
  aliases: [cross-entropy, cross entropy]
  def: The standard loss for classification. It heavily penalises confident wrong predictions and expects integer class labels (`long`) in PyTorch.
- term: DataLoader
  def: A PyTorch utility that takes a Dataset and serves shuffled mini-batches, optionally in parallel worker processes.
- term: Dataset (PyTorch)
  aliases: [torch Dataset, Dataset protocol, Dataset class]
  def: In PyTorch, an object that knows its length (`__len__`) and how to return one example (`__getitem__`).
- term: Decision boundary
  aliases: [decision boundaries]
  def: The border in input space where a classifier's prediction switches from one class to another.
- term: Distribution shift
  aliases: [covariate shift, label shift, data drift]
  def: When the data a model sees in use differs from the data it was trained and validated on. Covariate shift changes the inputs; label shift changes how often each outcome occurs.
- term: dtype
  def: A tensor's data type, such as `float32`, `float16` or `int64` (`long`). Layers and loss functions expect specific dtypes.
- term: Dropout
  def: A regulariser that randomly zeroes a fraction of activations during training (only), forcing the network not to rely on any single unit.
- term: Early stopping
  def: Stopping training (and keeping the best checkpoint) when validation performance stops improving, to avoid overfitting.
- term: Embedding
  aliases: [embeddings]
  def: A learned vector of numbers that represents an item (a word, a user, an image) so that similar items get similar vectors.
- term: Engineered feature
  aliases: [engineered features, hand-engineered features, hand-made features]
  def: A feature whose formula a person invented and wrote in code, using domain knowledge — for example a ratio or a log transform.
- term: Epoch
  aliases: [epochs]
  def: One complete pass over the whole training set.
- term: Feature engineering
  def: The human work of inventing and computing input columns that make a problem easier for a model — the core skill of classical ML.
- term: Forward pass
  aliases: [forward propagation]
  def: Running inputs through the network layer by layer to produce a prediction (and then the loss).
- term: Gradient
  aliases: [gradients]
  def: For each parameter, how much the loss would change if that parameter were nudged slightly. It points in the direction of steepest increase of the loss.
- term: Gradient boosting
  aliases: [gradient-boosted trees, GBDT, HistGradientBoosting, HistGradientBoostingClassifier, XGBoost, LightGBM]
  def: An ensemble of many small decision trees, each trained to correct the errors of the ones before it. A very strong default for tabular data.
- term: Gradient clipping
  aliases: [clipping]
  def: Capping the size of the gradient before the update step, to stop a single huge gradient from wrecking training.
- term: Gradient descent
  def: The core learning rule — repeatedly nudge every parameter a small step in the direction that reduces the loss (opposite the gradient).
- term: Hidden layer
  aliases: [hidden layers, hidden units, hidden unit]
  def: A layer between the input and the output. Its units compute intermediate features that are learned rather than written.
- term: Hyperparameter
  aliases: [hyperparameters]
  def: A setting chosen before training rather than learned — learning rate, batch size, number of layers, dropout rate.
- term: Inductive bias
  aliases: [inductive biases]
  def: Assumptions built into a model's design, e.g. convolution assumes nearby pixels are related; attention lets any token relate to any other.
- term: Learning rate
  def: The step size used when updating parameters. Too small and training crawls; too large and it oscillates or diverges.
- term: Leakage
  aliases: [target leakage, data leakage, target leak]
  def: When information that would not be available at prediction time sneaks into training (e.g. call `duration` known only after the call), making scores look better than reality.
- term: Linear model
  def: A model whose prediction is a weighted sum of its inputs plus a bias. For classification its decision boundary is a straight line (or flat plane).
- term: Logistic regression
  def: A linear classifier that passes a weighted sum of the inputs through a sigmoid to output a probability. Its decision boundary is a straight line.
- term: Logit
  aliases: [logits]
  def: The raw, unbounded output of a classifier before the sigmoid or softmax turns it into a probability.
- term: Loss function
  aliases: [loss functions]
  def: A single number measuring how wrong the model's predictions are. Training tries to make it as small as possible.
- term: Mixed precision
  def: Training with some operations in 16-bit floating point (fp16/bf16) to save memory and time, while keeping sensitive parts in 32-bit.
- term: MLP
  aliases: [multilayer perceptron, multi-layer perceptron, MLPClassifier]
  def: A multilayer perceptron — a feed-forward network of fully connected (Linear) layers with non-linear activations between them.
- term: Momentum
  def: An optimizer trick that keeps a running "velocity" of past gradients, smoothing out zig-zags and speeding progress along consistent directions.
- term: nn.Module
  def: The base class for every PyTorch model and layer. It registers parameters and sub-modules and defines `forward()`.
- term: Normalisation
  aliases: [normalization, BatchNorm, LayerNorm, batch normalisation, layer normalisation]
  def: Layers that rescale activations to a stable range during training, making deep networks easier to optimise.
- term: One-hot encoding
  aliases: [one-hot, get_dummies]
  def: Turning a categorical column into several 0/1 columns, one per category, so a model can use it numerically.
- term: Optimizer
  aliases: [optimiser, optimizers, optimisers]
  def: The rule that turns gradients into parameter updates — SGD, momentum, Adam, AdamW. Called with `optimizer.step()` in PyTorch.
- term: Overfitting
  aliases: [overfit, overfits]
  def: When a model fits the training data (including its noise) so closely that it performs worse on new data. The gap between training and validation scores reveals it.
- term: Parameter
  aliases: [parameters, learned parameter, learned parameters, trainable parameters]
  def: A number inside the model that training is allowed to change — usually a weight or a bias.
- term: Pretraining
  aliases: [pretrained, pre-trained]
  def: Training a model on a large, general dataset first, so that its learned representation can be reused for other tasks.
- term: Regularisation
  aliases: [regularization, regulariser, regularizer]
  def: Any technique that discourages overfitting — smaller models, weight decay, dropout, early stopping, more data.
- term: ReLU
  def: The activation max(0, z) — passes positive values through and turns negatives into zero. Cheap, and the default in most networks.
- term: Representation
  aliases: [representations]
  def: The set of numbers used to describe an example. It can be written by hand (engineered features) or learned by a network.
- term: Representation learning
  def: Learning the useful description of the data (the features) from the data itself, jointly with the task, instead of specifying it by hand.
- term: ROC-AUC
  aliases: [AUC, ROC AUC]
  def: The probability that the model scores a random positive example above a random negative one. 1.0 = perfect ranking, 0.5 = random. Robust to class imbalance.
- term: Seed
  aliases: [random seed, seeds]
  def: The starting number for a random number generator. Fixing it makes random choices (splits, initial weights, shuffling) repeatable.
- term: SGD
  aliases: [stochastic gradient descent]
  def: Stochastic gradient descent — gradient descent using the gradient from one mini-batch at a time instead of the full dataset.
- term: Sigmoid
  def: The S-shaped function σ(z) = 1 / (1 + e^(−z)) that squashes any number into a probability between 0 and 1.
- term: Standardisation
  aliases: [standardization, StandardScaler, standardise, standardised, standardize, feature scaling]
  def: Rescaling each feature to mean 0 and standard deviation 1, using statistics computed on the training set only.
- term: Tensor
  aliases: [tensors]
  def: PyTorch's multi-dimensional array — like a NumPy array, plus a device (CPU/GPU) and the ability to track gradients.
- term: Test set
  def: Data held back until the very end to give one honest, final estimate of performance. Never used for decisions during development.
- term: Tokenisation
  aliases: [tokenization, tokenizer, tokeniser, tokens]
  def: Splitting text into the units (tokens) a language model processes, and mapping each to an integer ID.
- term: Transfer learning
  def: Reusing a representation learned on one task or dataset as the starting point for another — the reason pretrained models are so useful.
- term: Underfitting
  aliases: [underfit]
  def: When a model is too simple or too constrained to capture the pattern, so it performs poorly even on the training data.
- term: Validation set
  aliases: [validation split, validation data]
  def: Data held out from training and used to make decisions — choosing hyperparameters, early stopping, comparing models.
- term: Vanishing gradients
  aliases: [vanishing gradient, exploding gradients, exploding gradient]
  def: When gradients shrink (vanish) or grow (explode) as they pass back through many layers, so early layers learn far too slowly or training blows up.
- term: VRAM
  def: The memory on a GPU. Weights, gradients, optimizer state and activations must all fit in it, or training fails with an out-of-memory error.
- term: Weight decay
  def: A regulariser that shrinks every weight slightly towards zero at each step, discouraging overly large weights.
- term: Weights
  aliases: [weight matrix]
  def: The learned multipliers on a layer's inputs. Together with biases they are the model's parameters.

# Modules 5–6: reviewed standalone notes.
- term: Encoder
  def: A model component that transforms an input into a representation used by another
    component or task.
- term: Task head
  def: A model component that maps a representation to task outputs, such as class
    logits. A new head may need training even when the encoder is pretrained.
  aliases:
  - classification head
- term: Convolutional neural network
  def: A network that applies learned local filters with shared weights across spatial
    locations. It provides a useful inductive bias for many image tasks.
  aliases:
  - CNN
  - CNNs
- term: Feature map
  def: A spatial grid of responses produced by a filter or layer. It records where
    particular learned computations respond, without automatically explaining a prediction.
  aliases:
  - feature maps
- term: Stride
  def: The step between successive filter starting positions. A larger stride usually
    produces fewer output positions and lower spatial resolution.
- term: Pooling
  def: An operation that summarises a set or neighbourhood, for example by taking
    its maximum or mean. The rule determines which information is preserved or discarded.
- term: Cosine similarity
  def: The dot product of two nonzero vectors divided by their lengths. It compares
    direction, lies between −1 and 1, and is not a calibrated probability of semantic
    equivalence.
- term: Recurrent neural network
  def: A sequence model that repeatedly updates a hidden state using the current input
    and previous state. The update weights are shared across positions.
  aliases:
  - RNN
  - RNNs
- term: Hidden state
  def: A vector carrying a learned summary inside a sequence model. It can change
    at every position and need not preserve all past input information.
  aliases:
  - hidden states
- term: LSTM
  def: 'Long short-term memory: a recurrent architecture with a cell-state pathway
    and learned gates controlling retention, input updates and visible output. It
    helps with long dependencies without guaranteeing unlimited memory.'
- term: GRU
  def: 'Gated recurrent unit: a recurrent architecture using reset and update gates
    to control a changing state and candidate information.'
- term: Contrastive learning
  def: Learning representations by favouring matched pairs relative to selected alternatives.
    What counts as a positive or negative pair depends on the training objective and
    data.
- term: CLIP
  def: 'Contrastive Language–Image Pretraining: paired image and text encoders trained
    to produce comparable projected representations. Similarity supports retrieval
    and candidate-based classification rather than directly generating an image.'
- term: Transformer
  def: An architecture that combines attention-based contextual mixing with positionwise
    transformations, residual routes and normalisation. Its input interface, masks,
    training objective and output head determine its task behaviour.
  aliases:
  - Transformers
- term: Context window
  def: The configured amount of sequence context a model can use under its architecture
    and implementation. A permitted length does not guarantee equal prediction quality
    at every position.
  aliases:
  - context windows
- term: Self-attention
  def: An operation in which positions form learned weighted mixtures of value vectors
    from the same sequence, subject to information-access masks. Queries and keys
    determine the mixing weights.
- term: Causal mask
  def: A restriction blocking future keys for a query position, so next-token prediction
    cannot read its answer. Padding restrictions are a separate mask concern.
  aliases:
  - causal masks
- term: Multi-head attention
  def: Several attention computations in learned projected subspaces, whose outputs
    are joined and projected. Heads divide feature coordinates, not disjoint sentence
    segments.
- term: Residual connection
  def: An addition of the form input plus learned update. Compatible shapes preserve
    an identity route through a block and can help gradient flow.
  aliases:
  - residual connections
  - residual paths
- term: Layer normalisation
  def: Normalisation over configured feature dimensions within each example or token,
    using its own mean and variance plus optional learned scale and offset. It does
    not use a training-dataset mean.
  aliases:
  - LayerNorm
  - layer normalization
- term: Cross-attention
  def: Attention with queries from one sequence and keys and values from another,
    such as decoder target vectors reading encoded source memory.
- term: Autoregressive
  def: Predicting each next item conditional on earlier items. Known training positions
    can be scored in parallel with a causal mask, while ordinary generation selects
    new tokens sequentially.
- term: Inference
  def: Using a model’s current parameters to calculate outputs without the task-training
    update loop. Evaluation mode and gradient-recording controls have distinct roles.
- term: Linear probe
  def: A simple linear classifier fitted on fixed representations to test how accessible
    task information is for a declared task and evaluation protocol.
- term: Receptive field
  def: The region of the original input that can influence an output location, given
    the layer kernels, strides and connectivity.
- term: Skip-gram
  def: A word-embedding objective predicting nearby context words from a centre word.
    Training pairs should respect document boundaries.
- term: Byte-pair encoding
  def: Tokenisation by repeatedly merging frequent adjacent pairs. Character-based
    versions require known characters; byte-level coverage can provide a fallback
    for arbitrary text.
- term: Feed-forward network
  def: In a standard Transformer block, a shared nonlinear network applied separately
    to each token vector. Attention supplies cross-token information.
- term: Teacher forcing
  def: Training with the true preceding tokens as history. A causal Transformer can
    compute predictions at all known input positions in parallel.
- term: Permutation equivariance
  def: Permuting inputs permutes outputs correspondingly. Unmasked self-attention
    without positional information has this property.
- term: Top-p sampling
  def: Sampling after retaining a highest-probability set whose cumulative probability
    reaches a threshold, then renormalising.
- term: Exposure bias
  def: The mismatch between training on reference histories and generating from model-produced
    histories, where errors can affect subsequent inputs.

# Replacement Modules 7–8: teaching terms.
- term: Pretrained model
  def: A model whose weights were learned by someone else on a large dataset and published
    for reuse.
- term: Weights (parameters)
  def: The learned numbers inside a model.
- term: Configuration
  def: A file describing a model's architecture (and labels) so a library can rebuild
    it.
- term: Pipeline
  def: A Hugging Face helper that runs tokenising, the model and output decoding in
    one call.
- term: Hugging Face Hub
  def: A public website where models and datasets are shared.
- term: IMDb
  def: A dataset of movie reviews labelled positive or negative, used throughout Modules
    7 and 8.
- term: Fingerprint
  def: A digest of sorted texts identifies membership under this implementation; a separate ordered text/label digest is needed to check paired prediction alignment.
- term: Masked language modelling
  def: 'A pretraining task: predict hidden words from the words on both sides.'
- term: Base model
  def: The model produced by pretraining, before adaptation to any task.
- term: Downstream task
  def: The task you actually want to solve with a pretrained model.
- term: Fine-tuning
  def: Further training of a pretrained model on labelled data for a downstream task.
- term: SST-2
  def: A dataset of short film-review sentences labelled positive or negative.
- term: Body (encoder)
  def: The shared part of a model that builds representations.
- term: Head
  def: A small task-specific layer on top of the body.
- term: Weight tying
  def: Using one weight matrix in two places, such as the input word table and the
    word-prediction layer.
- term: Probing
  def: Testing what a model knows with inputs designed to need specific knowledge.
- term: Contextual representation
  def: A word vector that depends on the surrounding sentence.
- term: Hidden states
  def: The vectors produced after each layer of a Transformer.
- term: Foundation model
  def: A model pretrained on broad data, designed to be adapted to many tasks.
- term: LOAD REPORT
  def: Hugging Face's table of skipped (UNEXPECTED) and newly created (MISSING) weights
    when loading.
- term: TF-IDF
  def: A word-count representation that down-weights words common to most documents.
- term: Training from scratch
  def: Training from random weights using only your own data.
- term: Sign test
  def: A paired test that counts the examples where exactly one of two models is right.
- term: State dict
  def: A dictionary from each weight's name to its tensor.
- term: Safetensors
  def: A safe file format for weights that cannot contain executable code.
- term: Repository
  def: A Hub storage space for one model, with its files and history.
- term: Commit / revision
  def: A recorded change to a repository / the version you ask for when loading.
- term: Repository name
  def: The `owner/name` identifier of a Hub repository.
- term: Model repository
  def: A Hub folder with a model's configuration, weights, tokeniser files and card,
    plus history.
- term: Local cache
  def: The folder where downloaded Hub files are stored for reuse.
- term: Transformers
  def: Hugging Face's library of model architectures and loading code.
- term: Datasets
  def: Hugging Face's library for loading and processing datasets.
- term: Tokenizers
  def: Hugging Face's fast, compiled library for splitting text into tokens.
- term: huggingface_hub
  def: 'The helper library that talks to the Hub: listing, downloading, caching.'
- term: Model card
  def: A repository's `README.md` describing a model, its uses and limitations.
- term: Card metadata
  def: Machine-readable fields at the top of a model card, such as `license` and `model-index`.
- term: ONNX
  def: A file format for running models outside the framework that trained them.
- term: Auto classes
  def: Classes that read a configuration and build the matching architecture.
- term: Dataset / DatasetDict
  def: A table of examples / a dictionary of tables, one per split.
- term: Features
  def: The named, typed columns of a dataset.
- term: Apache Arrow
  def: A column-based file format for fast reading of large tables.
- term: Memory mapping
  def: Reading a file on disk as if it were in memory, fetching parts only when used.
- term: map / filter
  def: Datasets operations that transform every row / keep rows that pass a test.
- term: Padding
  def: Adding filler tokens so sequences in a batch have equal length.
- term: Data collator
  def: A function that combines examples into a batch, for example by padding them.
- term: Fast tokeniser
  def: A tokeniser backed by the compiled Tokenizers library.
- term: WordPiece
  def: A subword algorithm that marks continuation pieces with `##`; used by BERT
    and DistilBERT.
- term: BPE (byte-pair encoding)
  def: A subword algorithm that merges frequent character pairs; used by GPT-2.
- term: Normaliser
  def: The tokeniser step that cleans text before splitting, such as lowercasing.
- term: Offset mapping
  def: The character positions in the original text that each token came from.
- term: Licence
  def: The legal terms for using, changing and sharing a model.
- term: Permissive licence
  def: A licence allowing broad use, including commercial, with few conditions.
- term: Custom licence
  def: Terms written by a model's publisher specifically for that model.
- term: Gated model
  def: A model whose files require signing in and accepting terms before download.
- term: Intended use
  def: What a model's creators designed it to be used for.
- term: Pipeline tag
  def: The Hub's label for the task a model performs, also used as the `pipeline`
    task name.
- term: Text classification
  def: Assigning one label to a whole text.
- term: Question answering
  def: Finding the span of a passage that answers a question.
- term: Summarisation
  def: Producing a shorter version of a long text.
- term: Text generation
  def: Continuing a prompt with new text.
- term: Sentence embedding
  def: One vector for a whole sentence, placing similar meanings close together.
- term: Zero-shot image classification
  def: Classifying an image into labels given as words at run time.
- term: Greedy decoding
  def: Generating by always choosing the most likely next token.
- term: Safetensors header
  def: The start of a safetensors file, listing each tensor's name, shape and number
    type.
- term: bfloat16 (BF16)
  def: A 16-bit number format, 2 bytes per number.
- term: Weight memory
  def: 'Memory needed to hold a model''s parameters: parameters × bytes per parameter.'
- term: Context length
  def: The maximum number of tokens a model accepts at once.
- term: Truncation
  def: Cutting an input down to a maximum number of tokens.
- term: Benchmark
  def: A fixed public dataset and scoring rule for comparing models.
- term: GLUE
  def: A collection of English language-understanding benchmarks, including SST-2.
- term: Dev set
  def: Another name for a validation set.
- term: Domain shift
  def: A difference between the data a model was built on and the data it meets in
    use.
- term: Contamination
  def: Evaluation data appearing in a model's training data, inflating its scores.
- term: Hosted API
  def: A service that runs a model remotely and returns results over the internet.
- term: Access token
  def: A secret key that identifies you to a service.
- term: Rate limit
  def: A cap on how many requests a service accepts in a given time.
- term: '`top_k`'
  def: How many top labels a classification pipeline returns; `None` returns all.
- term: Batch size
  def: How many inputs are processed together in one forward pass.
- term: '`AutoModelForSequenceClassification`'
  def: The Auto class for a model with a whole-text classification head.
- term: '`id2label`'
  def: The configuration's map from output position to label name.
- term: Attention mask
  def: 1s for real tokens and 0s for padding, so attention ignores padding.
- term: '`max_length`'
  def: The maximum number of tokens kept when truncating.
- term: Logits
  def: A model's raw, unnormalised output scores.
- term: Softmax
  def: Exponentiate each logit, then divide by the sum, giving probabilities.
- term: Eval mode / train mode
  def: Model states that disable / enable training-only behaviour such as dropout.
- term: '`torch.inference_mode()`'
  def: A context manager that disables gradient recording for faster inference.
- term: Inference tensor
  def: A tensor created under `inference_mode`, excluded from gradient tracking.
- term: Device placement
  def: Putting model weights and inputs on the same device.
- term: Padding waste
  def: Computation spent on padding positions.
- term: Length bucketing
  def: Grouping inputs of similar length into batches to reduce padding.
- term: '`save_pretrained`'
  def: Saves a model or tokeniser to a folder in Hub format.
- term: Shard
  def: One of several files holding a large model's weights.
- term: Capability
  def: What a model computes from an input.
- term: Application layer
  def: 'The code around a model: input checks, fit checks, decision rules, error handling.'
- term: Out-of-distribution (OOD) input
  def: An input unlike the data a model was trained on.
- term: Confidence
  def: The probability a classifier gives to its chosen class.
- term: Temperature
  def: A divisor applied to logits before softmax, sharpening (below 1) or flattening
    (above 1) the distribution.
- term: Top-k sampling
  def: Sampling from the k most likely tokens.
- term: Top-p (nucleus) sampling
  def: Sampling from the smallest set of tokens with total probability at least p.
- term: Degenerate repetition
  def: A generator getting stuck repeating words or tokens.
- term: Sentence-embedding model
  def: A model mapping a text to one vector so similar meanings are close.
- term: Mean pooling
  def: Averaging token vectors, ignoring padding, to get one vector per text.
- term: Semantic search
  def: Retrieving documents by similarity of meaning.
- term: Zero-shot classification
  def: Classifying into classes described in words, without training on them.
- term: Prompt template
  def: A sentence pattern used to describe each class, such as "a photo of a {}.".
- term: Text-to-image retrieval
  def: Finding images whose embeddings are closest to a text query's.
- term: Inference service
  def: A wrapper that turns a model into a dependable component with structured results.
- term: Abstention
  def: Declining to answer, usually because confidence is low.
- term: Out-of-domain detection
  def: Checking whether an input resembles the data a model was built for.
- term: Threshold
  def: The cut-off value in a decision rule, set on validation data.
- term: Coverage
  def: The share of inputs the system answers.
- term: Selective accuracy
  def: Accuracy on the answered inputs only.
- term: Confusion matrix
  def: A table counting each combination of true and predicted label.
- term: Recall
  def: The share of a class's real examples labelled correctly.
- term: Deployment constraint
  def: A practical limit a deployed model must meet, such as latency, memory or cost.
- term: Latency
  def: The time to serve one request.
- term: Throughput
  def: The number of requests served per second.
- term: Percentile (p95)
  def: The value below which 95% of measurements fall.
- term: Dynamic batching
  def: Grouping requests that arrive close together into one batch.
- term: GPU
  def: A processor with many parallel arithmetic units, well suited to neural networks.
- term: float32 / float16 / bfloat16
  def: 32- and 16-bit floating-point number formats.
- term: Precision
  def: The smallest relative difference a format can represent.
- term: Range
  def: The largest magnitude a format can store before overflowing.
- term: Overflow
  def: A value too large for its format, stored as infinity.
- term: Quantisation
  def: Storing numbers with fewer bits, such as int8 integers plus a scale.
- term: int8
  def: 8-bit integers, 1 byte each.
- term: Scale
  def: The factor converting between original values and quantised integers.
- term: Per-channel quantisation
  def: A separate scale for each row of a weight matrix.
- term: Weight-only quantisation
  def: Quantising stored weights while computing with higher-precision activations.
- term: torchao
  def: PyTorch's library for quantisation and related optimisations.
- term: Kernel
  def: A low-level routine performing an operation for specific hardware and number
    format.
- term: Response cache
  def: Stored answers returned directly when the same request repeats.
- term: Cache key
  def: 'The information identifying a cached answer: input, model version, settings.'
- term: Cache hit rate
  def: The share of requests served from the cache.
- term: KV cache
  def: Stored attention keys and values for past tokens, reused during generation.
- term: Self-hosting
  def: Running a model on machines you control.
- term: Break-even volume
  def: The volume at which self-hosting and a hosted service cost the same.
- term: Manifest
  def: A record of the model version, settings, data and software behind a result.
- term: Deterministic inference
  def: Exactly the same output for the same input every time.
- term: Tolerance
  def: The allowed difference when comparing floating-point results.
- term: Requirement
  def: Concrete, checkable criteria a model must meet, written before measuring.
- term: Decision rule
  def: The procedure, fixed in advance, for choosing among candidates.
- term: Candidate
  def: A model shortlisted for testing.
- term: Label scheme
  def: The set of output classes and what each output position means.
- term: Training records
  def: 'Files documenting how a model was trained: arguments, logs, data splits.'
- term: Evaluation leakage
  def: Evaluation data seen during training or model selection, inflating scores.
- term: Screening
  def: Eliminating candidates on non-negotiable criteria before comparing performance.
- term: Setting (hyperparameter) tuning
  def: Choosing settings such as `max_length` by validation results.
- term: Confirmatory test
  def: A single use of the test set after all choices are made.
- term: Failure analysis
  def: Examining the inputs a model gets wrong to find patterns.
- term: Decision record
  def: A document of what was chosen, why, on what evidence, with which limitations.
- term: Adaptation
  def: Making a general pretrained model better at a specific task.
- term: Adaptation spectrum
  def: The range of adaptation methods, ordered by how much of the model they change.
- term: Prompting
  def: Adapting a model only through its input text; no weights change.
- term: Chat template
  def: The special-marker format an instruction-tuned model expects around messages.
- term: System message
  def: An instruction placed before the conversation that sets the assistant's role.
- term: Feature extraction
  def: Using a frozen model's outputs as features for a separate small model.
- term: Frozen
  def: Not updated during training.
- term: Full fine-tuning
  def: Fine-tuning that updates every weight.
- term: PEFT
  def: 'Parameter-efficient fine-tuning: training only a small set of new or selected
    weights.'
- term: LoRA
  def: A PEFT method that adds small trainable low-rank matrices to some layers.
- term: Classification head
  def: The task-specific layer(s) on top of a pretrained body.
- term: Relative change
  def: The size of a weight change divided by the size of the original weights.
- term: Catastrophic forgetting
  def: Losing earlier abilities when trained on a new task.
- term: Masked-word loss
  def: Cross-entropy of a masked language model's guesses for hidden words.
- term: Expected output (target)
  def: What the model should produce for each input.
- term: Labelling rule
  def: How labels were decided.
- term: Highly polar
  def: Labels derived from extreme ratings; review prose may still contain mixed opinions.
- term: Dataset card
  def: The documentation page of a dataset on the Hub.
- term: Cleaning
  def: Removing content with no signal for the task.
- term: Exact / near-duplicate
  def: Identical examples / examples differing only trivially.
- term: Instruction formatting
  def: Rewriting a labelled example as an instruction and response for a chat model.
- term: Train / validation / test split
  def: Data for fitting / for choosing settings / for one final estimate.
- term: Group split
  def: Splitting so that related examples (same author, same item) stay on one side.
- term: Majority-class baseline
  def: Always predicting the most common label.
- term: F1 score
  def: A combined score of precision and recall for one class.
- term: Token budget
  def: The maximum number of tokens per example.
- term: Head / tail / head+tail truncation
  def: Keeping the start, the end, or both ends of a long text.
- term: '`save_to_disk`'
  def: Saves a Hugging Face dataset in Arrow format.
- term: Baseline ladder
  def: A set of baselines of increasing sophistication, measured identically.
- term: Majority-class floor
  def: A constant-label baseline selected from training data and evaluated under the same protocol; it is not a guaranteed lower bound.
- term: n-gram
  def: A sequence of n consecutive words.
- term: Off-the-shelf model
  def: A pretrained model used exactly as downloaded, with no further training.
- term: Frozen encoder
  def: A pretrained model whose parameters stay fixed during the current training stage.
- term: Linear head (probe)
  def: A single linear layer trained on frozen features.
- term: Evaluation protocol
  def: Fixed rules for how every method is measured and compared.
- term: Paired comparison
  def: Comparing two methods on the same examples, example by example.
- term: Results file
  def: A saved record of a method's settings, costs, metrics and predictions.
- term: '`num_labels` / `id2label` / `label2id`'
  def: Configuration settings for the number of classes and their names.
- term: Cross-entropy loss
  def: Minus the log-probability of the correct class, averaged over a batch.
- term: Gradient norm
  def: The overall size of all gradients, as one number.
- term: AdamW
  def: Adam with decoupled weight decay; the standard fine-tuning optimiser.
- term: Warmup
  def: Raising the learning rate gradually at the start of training.
- term: Linear decay
  def: Lowering the learning rate steadily to zero.
- term: Learning-rate schedule
  def: How the learning rate changes over training.
- term: Step
  def: One update, made from one batch.
- term: Checkpoint selection
  def: Keeping the checkpoint with the best validation score.
- term: '`Trainer` / `TrainingArguments`'
  def: Hugging Face's ready-made training loop and its settings.
- term: Optimiser state
  def: Extra per-weight numbers kept by an optimiser; AdamW keeps two.
- term: Training memory
  def: Weights + gradients + optimiser states + activations.
- term: Freezing
  def: Setting `requires_grad = False` so a parameter is not trained.
- term: Trainable parameters
  def: Parameters that receive gradients and updates.
- term: Rank
  def: The number of independent directions a matrix uses.
- term: Low-rank
  def: Representable with few directions.
- term: Singular value decomposition
  def: Splitting a matrix into ranked rank-1 pieces.
- term: LoRA rank (r)
  def: The inner dimension of B·A.
- term: LoRA alpha (α)
  def: A scaling constant; the update is multiplied by α / r.
- term: Target modules
  def: The weight matrices that receive LoRA updates.
- term: LoRA dropout
  def: Dropout applied to the LoRA input during training.
- term: Bottleneck adapter
  def: A small down/up projection inserted into each layer.
- term: Prefix tuning
  def: Learning extra key/value vectors that tokens can attend to.
- term: Adapter (PEFT)
  def: The saved set of trained PEFT weights for one task.
- term: Merging
  def: 'Folding a LoRA update into the frozen weights: W + (α / r)·B·A.'
- term: Instruction-tuned model
  def: A base model further trained to follow instructions.
- term: SFT
  def: Supervised fine-tuning on (instruction, response) examples.
- term: Preference tuning
  def: Training from judgements of which response is better (e.g. RLHF, DPO).
- term: Special tokens
  def: Tokens with reserved meanings, such as turn markers.
- term: Roles
  def: System, user and assistant parts of a conversation.
- term: Prompt masking
  def: Excluding prompt tokens from the loss.
- term: Label -100
  def: The label value ignored by Hugging Face loss functions.
- term: Causal LM loss
  def: Cross-entropy of predicting each token from those before it.
- term: Blockwise quantisation
  def: Quantising small blocks of numbers, each with its own scale.
- term: NF4
  def: A 4-bit format with levels matched to bell-shaped weight distributions.
- term: Double quantisation
  def: Quantising the quantisation scales themselves.
- term: QLoRA
  def: LoRA on top of a frozen 4-bit (NF4) model.
- term: Dequantisation
  def: Converting quantised values back to higher precision.
- term: Paged optimiser
  def: An optimiser that moves its state out of GPU memory when needed.
- term: Training loss
  def: Loss on the training batches.
- term: Validation loss / accuracy
  def: Loss or accuracy on held-out data, used to monitor generalisation.
- term: Confidence interval
  def: An interval from a method designed to cover the target quantity at a stated rate over repeated samples; this is not a probability assigned to the fixed unknown value.
- term: Wilson interval
  def: A standard confidence interval for a proportion.
- term: Error analysis
  def: Examining which examples a model gets wrong and why.
- term: Error overlap
  def: The number of errors two models share.
- term: Validation–test gap
  def: The drop from validation to test score, partly due to selecting on validation.
- term: Paired sign test
  def: Comparing two models on the same examples by counting where only one is right.
- term: Run-to-run variation
  def: Differences between runs caused by randomness.
- term: Experiment tracking
  def: Recording each run's settings, data, versions and results.
- term: Keep-or-reject rule
  def: A criterion, set in advance, for adopting a model.
