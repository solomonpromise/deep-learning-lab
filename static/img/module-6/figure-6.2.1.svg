    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>An illustrative query for bit assigns weights 0.05, 0.40, 0.10, 0.05 and 0.40 to the five tokens the, dog, bit, the, man. Thicker arrows indicate larger weights. The output is the weighted sum of value vectors, not a mixture of token IDs.</dc:description>
