   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Three panels show adding a token vector to a position vector, adding a learned bias based on signed distance buckets to each attention score, and rotating a query or key dimension pair by position. For each RoPE frequency the angle difference is proportional to relative distance; different dimension pairs have different frequencies.</dc:description>
