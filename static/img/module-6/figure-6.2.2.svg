   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="29.399375" transform="rotate(-0 30.24 29.399375)">DEEP LEARNING LAB  /  FIGURE 6.2.2</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="30.24" y="63.40875" transform="rotate(-0 30.24 63.40875)">One token, three learned projections.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="84.67125" transform="rotate(-0 30.24 84.67125)">Queries and keys determine the weights. Values supply the information being mixed.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #202d28" transform="translate(87.780234 247.324891)">“card”</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #202d28" transform="translate(52.208672 268.600734)">input vector x</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="400.32" y="163.535" transform="rotate(-0 400.32 163.535)">q = xWq + bq</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="573.12" y="151.5225" transform="rotate(-0 573.12 151.5225)">Query</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="573.12" y="175.39125" transform="rotate(-0 573.12 175.39125)">What am I looking for?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="400.32" y="272.255" transform="rotate(-0 400.32 272.255)">k = xWk + bk</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356784" x="573.12" y="260.2425" transform="rotate(-0 573.12 260.2425)">Key</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="573.12" y="284.11125" transform="rotate(-0 573.12 284.11125)">What can match me?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="400.32" y="380.975" transform="rotate(-0 400.32 380.975)">v = xWv + bv</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a04e32" x="573.12" y="369.11875" transform="rotate(-0 573.12 369.11875)">Value</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="573.12" y="392.83125" transform="rotate(-0 573.12 392.83125)">What information do I pass on?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="437.47125" transform="rotate(-0 30.24 437.47125)">The same three projections are applied at every token position. Their weights are learned during training.</text>
   </g>
