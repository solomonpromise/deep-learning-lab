    <dc:description>The sentence my card was stolen becomes six tokens: CLS, my, card, was, stolen, SEP. Token IDs enter six MiniLM encoder layers. Six contextual vectors are pooled with the padding mask and normalised into one 384-number sentence vector.</dc:description>
