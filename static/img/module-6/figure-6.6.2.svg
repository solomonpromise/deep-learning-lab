   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="252" y="570.766406" transform="rotate(-0 252 570.766406)">Causal attention → merge → o_proj</text>
   </g>
   <g id="text_10">
