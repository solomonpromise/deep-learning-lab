   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>Read upward: input, RMSNorm, attention with sixteen query heads and eight shared key/value heads, per-head Q/K normalisation, RoPE, causal attention and output projection, residual addition, RMSNorm, gated SiLU feed-forward, residual addition, output. A side diagram shows MiniLM’s post-norm ordering. Dropout is omitted in both inference diagrams.</dc:description>
