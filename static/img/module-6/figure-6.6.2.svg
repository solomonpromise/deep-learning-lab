   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #234c3c" x="252" y="491.410937" transform="rotate(-0 252 491.410937)">Masked self-attention</text>
   </g>
   <g id="text_7">
