   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:description>A weighted-sum equation feeds a ReLU graph. The graph is flat at zero for negative inputs and rises with slope one for positive inputs. Examples show z=-2 giving a=0 and z=2 giving a=2.</dc:description>
