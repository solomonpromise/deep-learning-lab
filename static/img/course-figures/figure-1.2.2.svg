    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="29.399375" transform="rotate(-0 30.24 29.399375)">DEEP LEARNING LAB  /  FIGURE 1.2.2</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="30.24" y="63.40875" transform="rotate(-0 30.24 63.40875)">ReLU turns a weighted sum into an activation.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="84.67125" transform="rotate(-0 30.24 84.67125)">A negative pre-activation is clipped to zero. A positive one passes through.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="190.8" y="187.9525" transform="rotate(-0 190.8 187.9525)">First: compute the weighted sum</text>
   </g>
   <g id="text_5">
    <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202d28" x="190.8" y="248.098437" transform="rotate(-0 190.8 248.098437)">z = Σ wᵢxᵢ + b</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #234c3c" x="190.8" y="309.526875" transform="rotate(-0 190.8 309.526875)">Then: a = max(0, z)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="30.24" y="409.168437" transform="rotate(-0 30.24 409.168437)">The activation supplies the nonlinearity; the weights and bias remain learnable.</text>
   </g>
  </g>
