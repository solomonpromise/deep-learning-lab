   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="480.24" y="208.343125" transform="rotate(-0 480.24 208.343125)">Model parameters</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="466.56" y="282.9925" transform="rotate(-0 466.56 282.9925)">The file loads successfully.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52645a" transform="translate(466.56 311.605203)">It does not restore optimizer averages,</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #52645a" transform="translate(466.56 332.601047)">random streams or training history.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="30.24" y="539.216406" transform="rotate(-0 30.24 539.216406)">A successful load is not proof that a resumed run follows the uninterrupted trajectory.</text>
