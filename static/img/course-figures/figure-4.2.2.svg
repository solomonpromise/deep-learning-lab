   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234c3c" x="30.24" y="63.5025" transform="rotate(-0 30.24 63.5025)">A resumable checkpoint carries the run state.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52645a" x="30.24" y="84.67125" transform="rotate(-0 30.24 84.67125)">Restoring weights is sufficient for inference; resuming training needs more.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="43.2" y="163.024531" transform="rotate(-0 43.2 163.024531)">Checkpoint for resuming training</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="453.6" y="163.024531" transform="rotate(-0 453.6 163.024531)">Weights for inference</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="64.08" y="208.343125" transform="rotate(-0 64.08 208.343125)">Model parameters</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="64.08" y="255.863125" transform="rotate(-0 64.08 255.863125)">Optimizer state</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="64.08" y="303.328437" transform="rotate(-0 64.08 303.328437)">Row-order generator</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="64.08" y="350.848437" transform="rotate(-0 64.08 350.848437)">Global random generators</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202d28" x="64.08" y="398.368437" transform="rotate(-0 64.08 398.368437)">Epoch, history &amp; best-so-far</text>
