# The concept map (concepts.html): how the glossary's terms connect.
# home:      the lesson that teaches the term. The map puts it in that lesson's module column. Without it, the
#            build guesses from where the term is used, which is often wrong for words used everywhere.
# builds_on: the terms you need first (by glossary term name). Keep them taught no later than the term itself:
#            the build warns when a term builds on one from a later module.
# later:     modules not yet published whose topics (course.yaml) pick the idea up again, with a short why.
# Every other lesson that uses a term comes from the glossary's own tracking at build time.
# Terms not listed here still appear on the map, with no connections.

