# Teaching layer for Lesson 3.4 — The Diagnosis Clinic
# The notebook is the author's current version (not locked). Its two image prompts are hidden by the build and
# replaced here by SVG figures drawn from the notebook's own gallery curves.

summary: |
  Lessons 3.1–3.3 gave you three kinds of evidence; this clinic turns them into a **procedure**: observe, compare with a reference,
  hypothesise, test, intervene, verify. You learn six curve shapes, a config-driven harness that records losses, metrics, prediction
  summaries and gradient profiles for every run, and a **protocol ordered by cost** (free checks first, retraining last). Then six broken
  experiments: learning rate too high and too low, over-regularised, a leaked validation split, a bad initialisation, and the one that
  passes every check and is still unusable, because a feature does not exist yet when the prediction is made. Two mysteries without an
  answer key, and a one-page experiment record, finish Module 3.

