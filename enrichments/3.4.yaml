  - section: 1
    after: "should trigger an investigation into *why* before it triggers celebration"
    type: widget
    name: curve-doctor
    title: "Curve doctor: the clinic's six shapes"
    props: { patterns: [healthy, overfit, lrlow, collapse, lrhigh, leak] }
    intro: "Fresh patients drawn from the same six stories. Name each one from the curves alone, then read what you would check next."

  # ------------------------------------------------------------------ §3
  - section: 3
    after: "The ordering is deliberate"
    type: compare
    title: "What each tier costs, and what it can rule out"
    items:
      - { title: "Tier 0: the run you already have", tone: green, icon: check, md: "Seconds. Rules out NaN, collapse (one prediction), threshold failures (accuracy = majority) and too-good-to-be-true results." }
      - { title: "Tier 1: one forward/backward pass", tone: blue, icon: pulse, md: "A second or two. Rules out exploding or vanishing gradients and mass-dead ReLUs." }
      - { title: "Tier 2: new runs", tone: orange, icon: clock, md: "Minutes to days. Tests hypotheses: can it memorise 20 rows? does another learning rate or less regularisation fix it?" }

  # ------------------------------------------------------------------ §4
  - section: 4
    after: "case1 = run_experiment({**BASELINE, \"name\": \"case1\", \"lr\": 0.5})"
    type: explainer
    style: warning
    title: "Why the gradient ratio is exactly the reference's 1.274"
    md: |
      The harness measures the gradient profile **at initialisation**, before the first optimizer step, and every case starts from the same
      seed and architecture. So Cases 1, 2 and 4 all report 1.274: the profile of the untrained reference network. A profile at initialisation
      can only catch problems that exist before training (a bad initialisation, too much depth, as in Mystery A); it cannot see damage done
      *by* training, such as the dead units this learning rate creates. To catch those, rerun `layer_grad_norms` (and `dead_fraction` from
      Lesson 3.3) on the **trained** model.

  # ------------------------------------------------------------------ §7
  - section: 7
    after: "case4 = run_experiment({**BASELINE, \"name\": \"case4\", \"leak_split\": True})"
    type: explainer
    style: tip
    title: "A third clue hiding in the Tier 0 output"
    md: |
      The majority-class rate printed for Case 4 is **0.7200**, not 0.7000. Every split in this module is stratified, so a real validation set
      has exactly the 70/30 balance. A different class balance says these rows were not produced by the stratified split at all: they are
      the first 250 rows of the training set.

