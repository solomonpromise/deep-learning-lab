summary: How can we measure, rather than just eyeball, what a learned representation
  has gained over raw data?
answers:
  2-1:
  - Variance measures overall spread, which is dominated by the biggest differences
    in the data, such as "footwear vs. trousers vs. tops". PCA keeps those large directions,
    which accounts for most of the variance. But the finer distinctions that decide
    which class a point's *nearest* neighbours belong to, such as shirt vs. pullover,
    live in the many smaller directions that PCA throws away. So the picture keeps
    the big shape while scrambling many local neighbourhoods.
