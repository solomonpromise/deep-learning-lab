summary: How does attention let each token gather information from the others?
answers:
  5-1:
  - 1 × 3 + 2 × (−1) = 3 − 2 = 1.
  7-1:
  - 'The plain average of all four value vectors: each contributes exactly a quarter.'
  8-1:
  - 'One: itself. With only one allowed position, softmax gives it a weight of 1.'
  9-1:
  - 512 / 8 = 64.
  10-1:
  - 'The causal mask itself carries some order information: position 0 can attend
    only to one token, position 1 to two tokens, and so on. A token can partly infer
    where it is from how many tokens it can see. This is weak and indirect, so models
    still add explicit positional information.'
  11-1:
  - 16,384 / 4,096 = 4 times as many tokens, so 4² = 16 times as many entries in each
    score grid.
