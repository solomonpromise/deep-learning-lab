docstrings:
  benchmark_clock: Read elapsed time after synchronising any queued CUDA work.
  ordered_fingerprint: "Hash ordered text/label pairs to verify alignment for paired\
    \ comparisons.\n\nArguments:\n    texts: Text strings in the order expected by\
    \ the caller.\n    labels: Integer targets aligned with the input examples."
  load_imdb_split: "Load the declared IMDb revision, remove exact duplicates and construct\
    \ the seeded course splits.\n\nArguments:\n    seed: Seed controlling the local\
    \ split or sampling generator.\n    n_val: Number of training-half reviews reserved\
    \ for validation.\n    n_eval: Size of the reproducible evaluation subset.\n \
    \   verbose: Whether to print dataset audit counts."
  load_imdb_split.dedup: "Keep the first occurrence of each exact text not already\
    \ in the supplied seen set.\n\nArguments:\n    texts: Text strings in the order\
    \ expected by the caller.\n    labels: Integer targets aligned with the input\
    \ examples.\n    seen: Set of exact texts already retained."
  fingerprint: "Hash sorted texts to identify membership; this does not check row\
    \ order or labels.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller."
  metrics: "Calculate accuracy, both recalls and positive-class F1 under the binary\
    \ label convention.\n\nArguments:\n    y: Targets aligned with the examples.\n\
    \    p: Predicted binary classes."
  tfidf_rung: "Fit the declared TF-IDF representation and logistic regression; return\
    \ fitted objects and elapsed time.\n\nArguments:\n    x: Input features or token\
    \ IDs with the shape traced at the call site.\n    y: Targets aligned with the\
    \ examples.\n    C: Inverse regularisation strength for logistic regression."
  head_tail: "Fit each review into the declared token budget, retaining its first\
    \ quarter and last three quarters.\n\nArguments:\n    texts: Text strings in the\
    \ order expected by the caller.\n    max_length: Token budget including special\
    \ tokens."
  batches: "Group similarly sized examples and yield indices plus device-ready encoded\
    \ batches.\n\nArguments:\n    texts: Text strings in the order expected by the\
    \ caller.\n    size: Requested batch size."
  sst2_predict: "Return SST-2 checkpoint class predictions in the original review\
    \ order.\n\nArguments:\n    texts: Text strings in the order expected by the caller."
  features: "Extract masked mean-pooled features from the frozen encoder without parameter\
    \ updates.\n\nArguments:\n    texts: Text strings in the order expected by the\
    \ caller."
  sign_test: "Test paired correctness disagreements under equal probability of either\
    \ method alone being correct.\n\nArguments:\n    a: First collection of paired\
    \ predictions.\n    b: Second collection of paired predictions.\n    y: Targets\
    \ aligned with the examples."
inserts: []
quiz:
- q: Why establish a baseline before adaptation?
  options:
  - To know whether added training delivers useful improvement.
  - To guarantee fine-tuning wins.
  - To avoid reporting costs.
  answer: 0
  why: To know whether added training delivers useful improvement.
- q: What does zero IMDb labels mean for the off-the-shelf baseline?
  options:
  - No IMDb adaptation labels used here; upstream training still occurred.
  - The checkpoint was never trained.
  - Its labels are inherently correct.
  answer: 0
  why: No IMDb adaptation labels used here; upstream training still occurred.
- q: Why save per-example predictions and ordered IDs?
  options:
  - To support correctly aligned paired comparisons.
  - To replace split checks.
  - To make test tuning acceptable.
  answer: 0
  why: To support correctly aligned paired comparisons.
