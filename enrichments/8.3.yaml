summary: What must an adapted model beat to be worth its cost, and how do we measure
  that fairly?
answers:
  2-1:
  - 'The vectoriser learns which terms exist and how common they are (the IDF weights).
    Fitted on all reviews, it would learn from the test reviews: terms that appear
    only in test reviews would get a place in the vocabulary, and the IDF weights
    would reflect test-set frequencies. The model would then be built partly from
    test data, so its test score would no longer be an honest estimate for unseen
    reviews.'
  4-1:
  - That adapting the encoder's own weights matters for this task. Everything else
    (encoder, inputs, labels) is the same as rung 3, so a clear gain must come from
    letting the encoder change its representations to suit IMDb sentiment, rather
    than reading a fixed representation with a linear head. A sign test on the same
    test reviews would confirm whether the gain is real.
  5-1:
  - The two numbers come from different test reviews, so the difference could be due
    entirely to which reviews landed in each test set, not to the methods. A fair
    comparison needs both methods on the same test reviews (ideally with a paired
    test), with the same training data and the same rules for choosing settings.
