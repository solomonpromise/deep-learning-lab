summary: Can we adapt a model just as well while training only a tiny fraction of
  its parameters?
answers:
  2-1:
  - 'Gradients and optimiser states shrink to cover only the trainable 1%, since frozen
    parameters need neither. The weights themselves don''t shrink: the whole model
    must still be in memory to run the forward and backward passes, and the activations
    for each batch are about the same size as before. For a large model the weights
    then dominate, which is why QLoRA (Note 8.6) also compresses them.'
  4-1:
  - The last layer sits right below the new classification head, so it is where the
    representation most directly has to change for the new task, for example by emphasising
    a few sentiment-related directions for the head to read. Changes concentrated
    on a few task-specific features are naturally low-rank. Earlier layers build general
    features used for many purposes, and fine-tuning nudges them in more varied, less
    focused ways.
  8-1:
  - Because most of the training work isn't in the update itself. Every step still
    runs the forward pass through the whole frozen model, and the backward pass still
    has to send gradients back through all the frozen layers to reach the LoRA matrices
    in every layer. What LoRA saves is computing and storing gradients *for* the frozen
    weights, and the optimiser's work and memory for them. That's a real saving, but
    much less than a factor of 100.
