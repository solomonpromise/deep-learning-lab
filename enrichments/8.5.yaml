quiz:
- q: What does parameter-efficient adaptation aim to reduce?
  options:
  - Trainable updates and their associated costs.
  - All forward computation through frozen weights.
  - The need to evaluate quality.
  answer: 0
  why: Trainable updates and their associated costs.
- q: How does LoRA modify a linear computation?
  options:
  - A scaled low-rank update is added beside the frozen base.
  - The base is deleted.
  - The input mask becomes the weight matrix.
  answer: 0
  why: A scaled low-rank update is added beside the frozen base.
- q: Does p equal one prove LoRA and full fine-tuning equivalent?
  options:
  - No; it does not establish equivalence or identical predictions.
  - Yes, for every future dataset.
  - It proves they share every mistake.
  answer: 0
  why: No; it does not establish equivalence or identical predictions.
