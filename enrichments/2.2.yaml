        ``x`` of shape ``(F,)`` (with fresh noise added if ``noise_std > 0``) and
        ``y`` of shape ``(1,)``. There is no batch axis: the DataLoader adds it.
  export_digits_to_png: |
    Write scikit-learn's 8×8 digits to disk as one PNG per image.

    Creates the folder-per-class layout ``root/{train,val}/{digit}/NNNN.png`` that
    ``torchvision.datasets.ImageFolder`` also expects, with a random 80/20
    train/validation split. Pixel values 0–16 are rescaled to 0–255. If PNGs already
    exist under ``root`` nothing is written.

    Args:
