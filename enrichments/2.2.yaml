    The directory is scanned once at construction; each call to ``__getitem__``
    opens a single PNG, converts it to a tensor and applies an optional transform.
    This is the same pattern used for datasets far too large to fit in RAM.

    Attributes:
        root: The folder that holds one subfolder per class.
        transform: Optional function applied to each image tensor.
