  random_shift: |
    Build a random translation transform (training only).

    Each call moves the image by a random number of pixels (between ``-max_pixels``
    and ``+max_pixels``) vertically and horizontally, so every epoch sees a slightly
    different version of each digit. Uses ``torch.roll``, so pixels pushed off one
    edge wrap round to the opposite edge.

