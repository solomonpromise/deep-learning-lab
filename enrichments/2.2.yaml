    Return the number of examples (the DataLoader uses this to plan its batches).
  BankMarketingDataset.__getitem__: |
    Return example ``idx`` as a ``(features, label)`` pair.

    Args:
        idx: Position of the example, from 0 to ``len(self) - 1``.

