# Teaching layer for Lesson 4.3 — Memory, Batch Size and Precision
# The notebook is the author's current version (not locked). Its two IMAGE placeholders are hidden by the build and
# replaced here by SVG figures; a third figure shows the three number formats bit by bit.
# The claims in the Section 6 and Section 7 notes were checked by rerunning the lesson's own functions, verbatim, on
# synthetic data of the same shape with PyTorch 2.14.

summary: |
  Will this run fit in the memory you have? You count bytes: every number costs 4 bytes in fp32, gradients add one more
  copy of the model, and AdamW adds two, so **training with AdamW needs about four times the model's own memory** before a
  single activation. You estimate a 7-billion-parameter model three ways, read fp32, fp16 and bf16 as a trade between range
  and precision, and see why only fp16 needs a loss scaler. Activations are the one term that grows with the batch; speed
  stops improving past a batch size that belongs to the machine; gradient accumulation gets the big batch back in small
  memory. Autocast belongs around the forward pass. Finally, a recovery ladder for real out-of-memory errors and a playbook
  that tries the free fixes first.

inserts:
  # ------------------------------------------------------------------ §1
  - section: 1
    before: "def build_mlp(n_inputs=50, hidden=(64, 32)):"
    type: predict
    mode: choice
    prompt: "The Day 3 network has 5,377 weights, which take **21,508 bytes** in fp32. After one AdamW step, how many bytes do the weights, their gradients and AdamW's state take **together**?"
    options: ["About 21,500 (just the weights)", "About 43,000", "About 86,000", "About 172,000"]
    answer: 2
    reveal: |
      **86,056 bytes, four times the weights.** Weights 21,508, gradients 21,508 (one per weight), and AdamW's two running
      averages 43,016, plus 24 bytes for a step counter on each of the six parameter tensors. Nothing here depends on the
      batch: that is the next section's job.

  # ------------------------------------------------------------------ §2
  - section: 2
    after: "Same, with fp16 weights: 52 GB"
    type: explainer
    style: warning
    title: "What the 52 GB row assumes, and what mixed precision really costs"
    md: |
      `training_memory(..., precision="fp16")` puts **everything** in 2 bytes: weights, gradients and both AdamW averages. That is
      *pure* 16-bit training. It is not what `torch.autocast` does, and it is not what "mixed precision" usually means, for the
      reason Section 3 shows: a bf16 weight near 1.0 cannot move by less than about 0.004, so a typical AdamW step of 0.001
      rounds away. Real runs keep a full-precision copy of the weights and of the optimizer state.

      | 7B model, AdamW | bytes per weight | total |
      |---|---|---|
      | fp32 (the lesson's row) | 4 weights + 4 gradients + 8 averages = **16** | **104 GB** |
      | mixed precision, standard accounting | 2 weights + 2 gradients + 4 fp32 master copy + 8 averages = **16** | **104 GB** |
      | PyTorch `autocast` | 4 + 4 + 8, plus 2 for 16-bit working copies made during each step | **104 GB**, up to 117 GB during a step |
      | pure 16-bit (the lesson's "fp16 weights" row) | 2 + 2 + 4 = **8** | **52 GB** |

      So mixed precision leaves the model-state memory where it was. What it shrinks is the **activations**, and on hardware
      with 16-bit units it is faster. Getting a full fine-tune below 104 GB takes other tools: 8-bit optimizer state
      (bitsandbytes), sharding the state across several GPUs (ZeRO, FSDP), or not training most of the weights (LoRA). The
      "standard accounting" row is the one in the ZeRO paper (Rajbhandari et al., 2020).

      The LoRA row is fine as an estimate: frozen weights need no master copy, since they never change.

