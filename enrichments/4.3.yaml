 text-anchor="start" style="fill:var(--ink-3);font-size:11.5px;font-weight:700">costs you: time, accuracy or money</text><circle cx="126" cy="454" r="9" style="fill:var(--red)"/><text x="126" y="458" text-anchor="middle" style="fill:var(--surface);font-size:10px;font-weight:800">9</text><text x="144" y="458" text-anchor="start" style="fill:var(--ink);font-size:12.5px;font-weight:600">Gradient checkpointing (about 30% slower)</text><circle cx="126" cy="478" r="9" style="fill:var(--red)"/><text x="126" y="482" text-anchor="middle" style="fill:var(--surface);font-size:10px;font-weight:800">10</text><text x="144" y="482" text-anchor="start" style="fill:var(--ink);font-size:12.5px;font-weight:600">Freeze most of the model: LoRA</text><circle cx="126" cy="502" r="9" style="fill:var(--red)"/><text x="126" y="506" text-anchor="middle" style="fill:var(--surface);font-size:10px;font-weight:800">11</text><text x="144" y="506" text-anchor="start" style="fill:var(--ink);font-size:12.5px;font-weight:600">Quantise the frozen weights: QLoRA</text><rect x="186" y="540" width="380" height="36" rx="10" style="fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:6 5"/><text x="376.0" y="563" text-anchor="middle" style="fill:var(--ink-3);font-size:12.5px;font-weight:700">12  A smaller model, or a bigger GPU: last, not first</text><line x1="52" y1="58" x2="52" y2="556" style="stroke:var(--ink-2);stroke-width:2"/><path d="M 45 554 L 52 566 L 59 554 z" style="fill:var(--ink-2)"/><text x="0" y="0" transform="translate(40 312.0) rotate(-90)" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:700">cost to you rises</text><text x="0" y="0" transform="translate(686 312.0) rotate(90)" text-anchor="middle" style="fill:var(--ink-3);font-size:11.5px;font-weight:700">stop at the first fix that works</text></svg>
