  - section: 1
    after: "Rather than take that on trust, measure it on the Day 3 network"
    type: steps
    title: "Where the bytes of a training run go"
    steps:
      - title: "Parameters: 1× the model"
        md: "The weights you are training. The Module 3 network: 5,377 numbers × 4 bytes = 21,508 bytes."
      - title: "Gradients: another 1×"
        md: "One gradient per parameter, the same shape as the weights: 21,508 bytes more."
      - title: "Optimizer state: 0×, 1× or 2×"
        md: "Plain SGD keeps nothing, momentum one copy, Adam and AdamW two (`exp_avg`, `exp_avg_sq`): 43,040 bytes. Total so far: **4× the model**."
      - title: "Activations: set by the batch"
        md: "Every layer's output, kept for the backward pass. They grow in a straight line with batch size, which is why halving the batch is the first thing to try when a run won't fit."

  - section: 3
    after: "Watch both failures happen"
    type: widget
    name: precision-lab
    title: "Precision lab: what each format keeps, and loss scaling"
    intro: |
      Real IEEE rounding in your browser. Store 70000 and 1e-8 in each format, then switch to **Loss scaling** and find the scale at which no
      fp16 gradient vanishes.

  - section: 4
    after: "Use a wider one, where each row costs more, and the picture changes"
    type: predict
    mode: choice
    prompt: "The wide network's weights take 4.2 MB. At batch **16,384**, its activations are about…"
    options: ["A tenth of the weights", "About the same as the weights", "10 times the weights", "60 times the weights"]
    answer: 3
    reveal: "**61 times the weights** (256 MB). At batch 32 they are a rounding error. Model memory is fixed; activation memory is yours to set."

  - section: 7
    after: "which looks tidier and is the mistake"
    type: predict
    mode: choice
    prompt: "Best validation AUC is 0.7847 in fp32 and with autocast around the forward pass. With autocast around the **whole training loop** it is…"
    options: ["0.7847, the same", "Slightly better", "0.7584, clearly worse", "NaN"]
    answer: 2
    reveal: "**0.7584**, and with `cache_enabled=False` it comes back to 0.7848, so this is a caching problem, not a precision problem."

answers:
  "1-1":
    - |
      **Two times:** one copy of the weights and one of the gradients. Plain SGD keeps no state between steps (the update is just
      `weight -= lr * gradient`). Add momentum and it becomes three times, because momentum keeps one running average per weight.
    - |
      Inference needs the **weights** and the **activations**, and the activations only briefly: under `torch.no_grad()` there is no
      backward pass to feed, so each layer's output can be freed as soon as the next layer has used it. It needs **no gradients and
      no optimizer state**. That is why the "inference only" row in Section 2 is just the weights. (A language model generating text
      adds one more term, the key-value cache, which grows with the length of the context: Day 9.)
  "2-1":
    - |
      110 million weights × (4 + 4 + 8) bytes = 1.76 billion bytes, about **1.64 GB**, the value in the table's BERT-base row. That
      is before activations, and for BERT they dominate: by the standard estimate one 512-token sequence keeps roughly a third of a GB of
      activations in 16-bit, so a batch of 32 long sequences needs far more memory for activations than for the model. The
      memory planner above shows both terms.
    - |
      Because the adapters are not what fills the memory. Of the row's 13.12 GB, **13.04 GB is the frozen model itself**, which
      needs no gradient and no optimizer state but still has to sit in memory. The adapters' gradients and AdamW state are 0.08 GB,
      so halving the adapters saves at most 0.04 GB. The only way down is to store the frozen weights in fewer bits, which is QLoRA
      (4 bits: about 3.3 GB for 7B). One simplification: the function treats the adapters as a share of the existing weights, while
      real LoRA adds new ones, usually kept in fp32. At this size that is still well under 0.3 GB.
  "3-1":
    - |
      Because the scaler fixes a **range** problem, and only fp16 has one. fp16 spends 5 bits on the exponent, so its smallest normal
      number is about 0.00006 (a few coarser "subnormal" values reach 0.00000006), and many gradients are smaller than that: they
      become exactly zero. Multiplying the loss by 65,536 moves them into range. bf16 spends 8 bits on the exponent, like fp32, so it
      reaches down to about 1e-38. Small gradients survive, only less precisely, and there is nothing to scale.
    - |
      Because the weights are not stored in bf16. `autocast` keeps the weights, and AdamW keeps its averages, in fp32; bf16 is only
      used for the matrix multiplications inside the forward pass. There, a rounding error of about 0.4% per number is small next to
      the noise of a mini-batch gradient, and it averages out across thousands of products. It would **not** be harmless if the
      weights themselves were bf16: `1.0 + 0.001` in bf16 is still 1.0, and `0.05 + 0.00002` (a typical fine-tuning step) is still
      0.05. Updates that small would vanish, which is why a full-precision master copy exists.
  "4-1":
    - |
      The **activations** doubled, because they are linear in batch size. The **weights, gradients and optimizer state** did not
      change: they depend on the model and the optimizer, not on how many rows go through. So the fix is on the activation side:
      batch 64 with two accumulation steps, mixed precision, or gradient checkpointing.
    - |
      Because in a Transformer every **token** is processed like a row: a batch of 8 sequences of 1,000 tokens stores activations for
      8,000 positions, so doubling the length doubles that part, just like doubling the batch. On top of that, attention compares
      every token with every other: each head stores a sequence × sequence table of scores, which grows with the **square** of the
      length. By the standard estimate for a 7B-sized model, that quadratic part overtakes everything else at about 870 tokens.
      Memory-efficient attention (FlashAttention) avoids storing those tables, which is a large part of why long contexts became
      trainable.
  "5-1":
    - |
      Each step has two costs: a **fixed** part (the Python loop, launching the work, and an AdamW update over all 1.1 million
      weights, whatever the batch) and a **per-row** part (the matrix multiplications). At batch 16 the fixed part dominates, so
      doubling the batch nearly doubles throughput. Once the per-row work dominates, the arithmetic units are already busy, time per
      step grows in step with the batch, and rows per second level off at what the hardware can compute. This run used a single
      CPU thread, which fills up early; a GPU has thousands of parallel units and keeps improving to much larger batches. (Here the
      last step still gained about 6%: 17,629 to 18,729 rows per second.)
    - |
      A smaller batch gives a noisier gradient, so the same learning rate takes relatively bolder steps. Consider **lowering it**:
      the linear-scaling rule for SGD (Goyal et al., 2017) halves the rate with the batch, and for Adam a gentler square-root rule
      (about 0.7×) is a common starting point. The cleanest option is often to keep the effective batch with **gradient
      accumulation** (Section 6) and leave the learning rate alone. Either way these are heuristics: check the validation curve.
  "6-1":
    - |
      With **SGD**, the gradients are 8 times too large, so it behaves like an 8-times learning rate: a noisier curve, spikes, possibly
      divergence (Note 3.4, Case 1). With **Adam or AdamW**, almost nothing happens, because Adam normalises each gradient by its own
      running size and a constant factor cancels (see the note above). The curve you log also depends on what you log: add up the
      undivided small-batch losses and the reported loss is 8 times too big even though the training is fine.
    - |
      **Time:** the same rows go through, but in smaller pieces, so each row costs more. On the machine that built the notebook, batch
      64 ran at 8,832 rows per second against 16,154 for batch 256, so four accumulated batches of 64 take nearly twice as long as one
      of 256. **Memory:** activations follow the small batch (49,408 bytes instead of 197,632); weights, gradients and optimizer
      state are unchanged, since the gradients accumulate in the same `.grad` tensors. **Result:** the same as the big batch, up to
      rounding (7.45e-09), except for BatchNorm and anything averaged per batch. It is *not* the same as training on small batches
      without accumulating, which takes four times as many, noisier steps.
  "7-1":
    - |
      The **activations**: the tensors kept for the backward pass are bf16, half the bytes. Measured on the wide network, about 4,200
      bytes per row instead of 8,400. Weights, gradients and the optimizer state stay fp32. One addition people forget: autocast
      also keeps **16-bit copies of the weights** for the backward pass (about 2.1 MB for the wide network), so at small batches it
      can use more memory than fp32. Its saving grows with the batch and, for text, with the sequence length.
    - |
      Because the arithmetic is different. bf16 keeps only 2 to 3 significant digits, so every matrix multiplication rounds
      differently, the gradients differ slightly, and the differences compound over thousands of steps into a different path.
      Different kernels also add numbers in a different order. The two runs are not Level 1 repeats of each other (Note 4.2); each is
      repeatable on its own, and the difference is explained by the record, as long as precision is one of the settings. Judge the gap
      against the noise floor: here fp32 and forward-only bf16 agreed to four decimals (0.7847), which is luck at this size, not a
      guarantee.
  "8-1":
    - |
      Because PyTorch did not give the memory back to the driver. When a tensor dies, its block returns to PyTorch's own **cache**,
      ready for the next tensor, and `nvidia-smi` reports what the process has reserved (plus a few hundred MB for the CUDA context),
      not what tensors are using. `torch.cuda.empty_cache()` releases the unused cached blocks. And if anything else still refers to
      the tensor (another variable, a list, a traceback, or a notebook's output history such as `_` or `Out[12]`), `del` removed only
      one name and the tensor has not been freed at all.
    - |
      Any three of these:
      - **another process** is holding GPU memory: a second notebook kernel, an earlier run that never exited, another user (check
        `nvidia-smi`);
      - **your own process** holds more than yesterday: tensors from earlier cells, a caught out-of-memory traceback, losses appended
        with their graphs (restart the kernel);
      - **the inputs got bigger**: a data change, longer sequences or images, padding to the longest item in a batch when one very
        long example arrives;
      - **the hardware changed**: Colab gave you a different GPU, with less memory;
      - **the software changed**: a library update with different kernels or workspace sizes, or `cudnn.benchmark` choosing a
        hungrier algorithm; long runs can also fragment the cache.

explain:
  - cell: "def build_mlp(n_inputs=50, hidden=(64, 32)):"
    title: "Counting the first three kinds of tensor"
    lines:
      - match: "loss_function(model(batch_x), batch_y).backward()    # creates the gradients"
        note: "`.grad` does not exist until the first backward pass; before it, every `p.grad` is `None`."
      - match: "optimizer.step()                                     # creates the optimizer state"
        note: "AdamW creates `exp_avg` and `exp_avg_sq` lazily, on the first step. Before it, `optimizer.state` is empty."
      - match: "return sum(t.numel() * t.element_size() for t in tensors if torch.is_tensor(t))"
        note: "Section 1's multiplication, summed. `torch.is_tensor` skips anything that is not a tensor."
      - match: "state_bytes = total_bytes([v for entry in optimizer.state.values() for v in entry.values()])"
        note: "`step` is a 4-byte tensor too, one per parameter tensor: six of them are the 24 bytes the Section 2 estimate misses."

  - cell: "def training_memory(n_parameters, precision=\"fp32\""
    title: "Estimating before running"
    lines:
      - match: "trainable = 0.0                       # no backward pass, so no gradients at all"
        note: "Inference overrides whatever share was passed: nothing is trained."
      - match: "state = n_parameters * trainable * OPTIMIZER_COPIES[optimizer] * size"
        note: "The optimizer state is counted in the same format as the weights: exact for fp32, an assumption for the fp16 rows."

  - cell: "def activation_bytes(model, batch_size, n_inputs=50):"
    title: "Measuring activations with hooks"
    lines:
      - match: "running_total.append(module_output.numel() * module_output.element_size())"
        note: "Called after each layer's forward pass with its input and output; only the output's size is recorded."
      - match: "handles = [layer.register_forward_hook(record) for layer in model]"
        note: "Iterating an `nn.Sequential` gives its layers in order. Each registration returns a handle for removing it later."
      - match: "with torch.no_grad():"
        note: "Only the sizes are needed, so no graph is built. The count covers every layer output, more than autograd keeps."
      - match: "handle.remove()                 # always remove hooks, or they fire forever"
        note: "A forgotten hook runs on every later forward pass and keeps growing `running_total` through its closure."

  - cell: "def throughput(model, batch_size, n_inputs=50, seconds=1.0):"
    title: "Measuring throughput"
    lines:
      - match: "for _ in range(3):"
        note: "Warm-up: the first steps pay one-off costs (memory allocation, choosing kernels) and would drag the average down."
      - match: "while time.perf_counter() - started < seconds:"
        note: "A fixed time budget rather than a fixed number of steps, so small and large batches are timed equally long."
      - match: "steps += batch_size"
        note: "Despite its name, `steps` counts **rows**: the function returns rows per second."

  - cell: "one_big_batch = build_mlp()"
    title: "Proving accumulation matches the big batch"
    lines:
      - match: "accumulated.load_state_dict(one_big_batch.state_dict())      # identical starting weights"
        note: "Two separate models with the same starting weights, so any gradient difference comes from the batching alone."
      - match: "(loss_function(accumulated(small_x), small_y) / 4).backward()"
        note: "`.backward()` adds into `.grad` and nothing zeroes it between the four calls. Dividing by 4 turns four averages into one."

  - cell: "def timed_steps(use_autocast, seconds=2.0, batch_size=1024):"
    title: "Timing mixed precision"
    lines:
      - match: "with torch.autocast(\"cpu\", dtype=torch.bfloat16, enabled=use_autocast):"
        note: "One code path for both runs: `enabled=False` makes the block do nothing."
      - match: "loss_function(output.float(), targets).backward()"
        note: "Loss and backward pass outside the block, as PyTorch recommends. `.float()` brings the bf16 output back to fp32."
      - match: "steps += 1"
        note: "Here `steps` really counts steps, so the result is steps per second at a fixed batch of 1,024."

  - cell: "def train_bank(mode=\"fp32\", epochs=10, cache_enabled=True, seed=42):"
    title: "Three places to put autocast"
    lines:
      - match: "with torch.autocast(\"cpu\", dtype=torch.bfloat16, enabled=(mode == \"forward\")):"
        note: "In `\"whole\"` mode this is `enabled=False`, which switches autocast **off** here even inside the outer block: training runs in fp32."
      - match: "probabilities = torch.sigmoid(model(val_inputs).float()).numpy().ravel()"
        note: "In `\"whole\"` mode, the only forward pass under autocast: the first call fills the weight cache and every later call reuses it."
      - match: "with torch.autocast(\"cpu\", dtype=torch.bfloat16, cache_enabled=cache_enabled):"
        note: "Everything inside shares one weight cache, emptied only when the block exits after the last epoch."

  - cell: "def largest_batch_that_fits(attempt, start, smallest=1, errors=OUT_OF_MEMORY):"
    title: "The recovery ladder"
    lines:
      - match: "OUT_OF_MEMORY = (torch.OutOfMemoryError, torch.cuda.OutOfMemoryError)"
        note: "In current PyTorch these two names are the same class; listing both does no harm."
      - match: "except errors:"
        note: "Any other exception still propagates: only running out of memory is worth a smaller batch."
      - match: "gc.collect()                                  # let Python release the tensors"
        note: "Runs while the traceback is still alive; see the note above for moving it outside the handler."
      - match: "size //= 2"
        note: "Halve and retry: step 5 of the playbook in Section 10."

  - cell: "free_at_start, _ = torch.cuda.mem_get_info()"
    title: "Running out on purpose"
    lines:
      - match: "blocks.append(torch.empty(int(512 * MB // 4), dtype=torch.float32, device=\"cuda\"))"
        note: "512 MB of float32 is 512 × 2²⁰ / 4 numbers. `torch.empty` reserves memory without writing to it."
      - match: "del blocks                                        # the recovery, in order"
        note: "Outside the `except`, so nothing else still refers to the blocks: `del`, collect, then hand the cache back."

  - cell: "amp_model = build_mlp(hidden=(1024, 1024)).cuda()"
    title: "fp16 with a loss scaler"
    lines:
      - match: "scaler.scale(loss).backward()      # multiply the loss up, then go backward"
        note: "The backward pass runs outside the autocast block, on the scaled loss."
      - match: "scaler.step(amp_optimizer)         # divide the gradients back down, then step"
        note: "Unscales the gradients and skips the step if any is `inf` or `NaN`."
      - match: "scaler.update()                    # adjust the multiplier for next time"
        note: "Halves the scale after an overflow and slowly raises it again after a run of clean steps."

  - cell: "if DEVICE.type != \"mps\":"
    title: "Apple Silicon"
    lines:
      - match: "torch.mps.synchronize()                 # wait for the GPU to actually finish"
        note: "MPS work is queued asynchronously: without waiting, memory figures and timings describe work not yet done."

takeaways:
  - "Training with AdamW needs about four times the model's memory before activations: weights, gradients and two running averages, 16 bytes per weight in fp32."
  - "Estimate before running: parameters × bytes per number × copies. Running a 7B model (13 GB in fp16) and training it (104 GB) sit on opposite sides of a hardware line."
  - "Mixed precision keeps an fp32 master copy, so it does not shrink weights, gradients or optimizer state. It shrinks activations, and on the right hardware it is faster."
  - "Precision trades range against fineness. bf16 keeps fp32's range and needs no loss scaler; fp16's narrow range makes small gradients vanish without one."
  - "Activations are the batch-dependent term, linear in batch size. Halve the batch first, and use gradient accumulation (dividing each loss) to get the effective batch back."
  - "Put autocast around the forward pass only. Around the whole loop, its weight cache froze every validation score at epoch 1 while the model kept training, and nothing warned."
  - "Work an out-of-memory error from the cheap end: restart, stop keeping graphs alive, `no_grad` for scoring, then batch size and accumulation, then checkpointing and freezing. Clean up outside the `except`."

quiz:
  - q: "A model has 1 million weights. Roughly how much memory do weights, gradients and AdamW state take in fp32?"
    options: ["4 MB", "8 MB", "16 MB", "32 MB"]
    answer: 2
    why: "4 bytes × (1 weight + 1 gradient + 2 averages) = 16 bytes per weight."
  - q: "You switch a 7B AdamW fine-tune from fp32 to standard mixed precision. What happens to weights + gradients + optimizer state?"
    options: ["Halves, to 52 GB", "Stays about 104 GB: the fp32 master copy and averages remain", "Quarters", "Doubles"]
    answer: 1
    why: "2 + 2 + 4 + 8 = 16 bytes per weight, the same as fp32. The saving is in the activations."
  - q: "Why does fp16 training need a loss scaler while bf16 does not?"
    options: ["fp16 is less precise", "fp16's range is narrow, so small gradients underflow to zero; bf16 has fp32's range", "bf16 uses more bytes", "fp16 cannot represent negative numbers"]
    answer: 1
    why: "The scaler is a range fix: it lifts small gradients above fp16's floor, then divides them back."
  - q: "A model fits at batch 64 and not at batch 128. Which memory term changed?"
    options: ["Weights", "Gradients", "Optimizer state", "Activations"]
    answer: 3
    why: "The other three depend only on the model and the optimizer."
  - q: "You accumulate over 8 small batches with AdamW and forget to divide each loss by 8. What happens?"
    options: ["Training diverges", "Almost nothing: Adam's normalisation cancels a constant factor, so the bug stays hidden", "The gradients become 8 times smaller", "Memory use grows 8 times"]
    answer: 1
    why: "With SGD it would act like an 8× learning rate. Divide anyway: clipping or a switch of optimizer brings the bug back."
  - q: "In the lesson's \"whole\" mode, every validation score after epoch 1 was identical. Why?"
    options: ["The model stopped training", "Autocast's weight cache kept the bf16 copies made at the first validation, so later validations scored the epoch-1 weights", "bf16 rounded every score to the same value", "The learning rate reached zero"]
    answer: 1
    why: "The model trained in fp32 throughout; only its measurement was frozen. Keep autocast around the forward pass."
  - q: "`del big_tensor` runs, but `nvidia-smi` still shows the memory in use. Most likely?"
    options: ["A memory leak in PyTorch", "PyTorch keeps freed blocks in its own cache for reuse; `empty_cache()` returns them to the driver", "The GPU is broken", "`del` does nothing in Python"]
    answer: 1
    why: "Inside your process the cache is a feature. Also check nothing else still refers to the tensor."

docstrings:
  build_mlp: |
    Build the Day 3 network: inputs, then ``Linear → ReLU`` per hidden layer, then one output.

    Args:
        n_inputs: Number of input features.
        hidden: Width of each hidden layer, in order. ``(1024, 1024)`` gives the lesson's
            "wide network" of 1,102,849 parameters.

    Returns:
        An ``nn.Sequential`` producing one logit per row, with PyTorch's default
        initialisation (seed it first for repeatable weights).
  total_bytes: |
    Add up the memory held by a collection of tensors.

    Args:
        tensors: Any iterable, such as ``model.parameters()``, a list of gradients, or the
            values of an optimizer's state. Items that are not tensors are skipped.

    Returns:
        The total size in bytes: the number of elements times the bytes per element,
        summed over every tensor.
  training_memory: |
    Estimate the bytes for weights, gradients and optimizer state, before running anything.

    Activations are not included (Section 4). Every term uses the same number format, so
    the fp16 rows describe pure 16-bit training; standard mixed precision keeps an fp32
    master copy and fp32 optimizer state instead.

    Args:
        n_parameters: How many weights the model has.
        precision: A key of ``BYTES_PER_NUMBER``: ``"fp32"``, ``"fp16"``, ``"bf16"`` or
            ``"int8"``.
        optimizer: A key of ``OPTIMIZER_COPIES``. ``"none (inference)"`` also forces
            ``trainable`` to 0, since nothing is trained.
        trainable: The share of weights being trained, from 0 to 1. Frozen weights still
            count toward ``"weights"`` but need no gradient or optimizer state.

    Returns:
        A dict of bytes with keys ``"weights"``, ``"gradients"``, ``"optimizer state"`` and
        ``"total"``.
  activation_bytes: |
    Measure the bytes of every layer output in one forward pass.

    Registers a forward hook on each layer, runs one random batch under
    ``torch.no_grad()``, then removes the hooks. The count covers every layer's output,
    which is an upper bound on what autograd keeps for the backward pass.

    Args:
        model: An ``nn.Sequential`` (its layers are hooked one by one).
        batch_size: Rows in the random batch.
        n_inputs: Features per row.

    Returns:
        The total bytes of all layer outputs for that batch.
  activation_bytes.record: |
    Forward hook: add the size of one layer's output to the running total.

    Args:
        module: The layer that just ran (unused).
        module_input: The layer's inputs (unused).
        module_output: The layer's output tensor, whose bytes are recorded.
  throughput: |
    Measure training throughput, in rows per second, for one batch size on this machine.

    Runs three warm-up steps, then as many AdamW steps as fit in ``seconds`` on one fixed
    random batch. Creates a fresh optimizer but trains the model passed in, so its weights
    change.

    Args:
        model: The network to time; its first layer must take ``n_inputs`` features.
        batch_size: Rows per step.
        n_inputs: Features per row.
        seconds: How long to time for.

    Returns:
        Rows processed per second (the variable ``steps`` counts rows).
  throughput.one_step: |
    Take one full training step: zero the gradients, forward, backward, update.
  timed_steps: |
    Measure training steps per second on the wide network, with or without bf16 autocast.

    Builds a fresh seeded ``(1024, 1024)`` network and puts ``torch.autocast`` around the
    forward pass only, which is the recommended placement.

    Args:
        use_autocast: Run the forward pass in bf16 under ``torch.autocast`` on the CPU.
        seconds: How long to time for, after three warm-up steps.
        batch_size: Rows per step.

    Returns:
        Steps per second on this machine.
  timed_steps.one_step: |
    Take one training step, with the forward pass inside the (possibly disabled) autocast block.
  load_bank_marketing: |
    Download Bank Marketing if needed and return its inputs and label.

    ``duration`` is dropped because a call's length is only known after the call.

    Args:
        path: Where the CSV is (or will be) stored.

    Returns:
        A tuple ``(X, y)``: the 15-column input DataFrame and a float32 label array
        (1 = subscribed).

    Raises:
        urllib.error.URLError: If the file is missing and UCI cannot be reached.
  train_bank: |
    Train the Day 3 network on Bank Marketing with autocast in one of three places.

    Uses the global ``train_inputs``, ``train_targets``, ``val_inputs`` and ``val_targets``,
    AdamW at 1e-3 and shuffled batches of 256.

    Args:
        mode: ``"fp32"`` (no autocast), ``"forward"`` (bf16 autocast around each forward
            pass, the recommended placement) or ``"whole"`` (one autocast block around the
            whole loop, the mistake). In ``"whole"`` mode the training forward pass runs in
            fp32 and only the validation scoring runs under autocast.
        epochs: Passes over the training rows.
        cache_enabled: Autocast's weight cache, used by ``"whole"`` mode only.
        seed: Seeds the weights and the shuffling.

    Returns:
        The best validation ROC-AUC seen after any epoch.
  train_bank.one_epoch: |
    Train for one pass over the training rows.
  train_bank.validation_auc: |
    Score the current model on the validation rows.

    Returns:
        Validation ROC-AUC, computed from fp32 probabilities.
  largest_batch_that_fits: |
    Find the largest batch that runs without an out-of-memory error, halving from ``start``.

    After each failure it collects garbage and, on an NVIDIA GPU, empties PyTorch's cache
    before retrying.

    Args:
        attempt: A function taking a batch size; it raises one of ``errors`` when the batch
            does not fit.
        start: The first (largest) batch size to try.
        smallest: Give up below this size.
        errors: The exception types that mean "out of memory". Anything else propagates.

    Returns:
        A tuple ``(size, log)``: the first size that fitted (or ``None``) and a list of
        ``(size, outcome)`` pairs, one per attempt.
  PretendOutOfMemory: |
    Stands in for a real out-of-memory error, so the ladder can be tested without a GPU.
  pretend_gpu: |
    Pretend to run a training step on a GPU that fits ``limit`` rows.

    Args:
        batch_size: The batch size being attempted.
        limit: The largest batch this pretend GPU can hold.

    Raises:
        PretendOutOfMemory: If ``batch_size`` is larger than ``limit``.
  one_gpu_step: |
    Take one AdamW step on the GPU model with a random batch of the given size.

    Args:
        batch_size: Rows in the random batch.

    Raises:
        torch.OutOfMemoryError: If the step does not fit in GPU memory.
