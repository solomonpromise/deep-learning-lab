  # ------------------------------------------------------------------ §4
  - section: 4
    after: "trades this memory for time"
    type: explainer
    style: deep
    title: "What the hook counts, and what autograd actually keeps"
    md: |
      The hook adds up **every layer's output**: for the wide network, 1,024 + 1,024 + 1,024 + 1,024 + 1 numbers per row, which is
      the 16,388 bytes in the table. Autograd keeps less. Each `Linear` saves its **input** and each `ReLU` saves its **output**, and
      those are the same tensor, while the `Linear` outputs before each ReLU are freed as soon as the ReLU has used them. Counting
      what autograd saves, with `torch.autograd.graph.saved_tensors_hooks`, gives:

      | wide network, per row | fp32 | under bf16 `autocast` |
      |---|---|---|
      | the hook's count | 16,388 bytes | |
      | kept for the backward pass | **8,400 bytes** (the 50 inputs, two ReLU outputs, the logit and the label) | about **4,200 bytes** |
      | 16-bit copies of the weights kept for the backward pass | none | about **2.1 MB**, whatever the batch |

      Three consequences. The hook's figure is an upper bound on what is stored, here about twice the truth, though the freed
      tensors still count briefly toward the peak. The rule that matters survives: stored activations are still exactly linear in
      batch size. And autocast's saving is not free: at batch 256 its weight copies (2.1 MB) outweigh the activations it saved
      (1.1 MB), so for this network mixed precision only saves memory above a batch of roughly 500.

  # ------------------------------------------------------------------ §6
  - section: 6
    after: "Forgetting to divide"
    type: explainer
    style: warning
    title: "With AdamW, forgetting to divide hides itself"
    md: |
      "Behaves exactly like a four-times learning rate" is true for **SGD**. It is not true for the optimizer this lesson uses.
      Forty steps, each accumulated over 8 small batches, once dividing by 8 and once forgetting to:

      | optimizer | largest difference between the two runs' weights | final loss, divided vs not |
      |---|---|---|
      | SGD, lr 0.05 | 0.61 | 0.667 vs 0.226: in effect an 8× learning rate |
      | AdamW, lr 1e-3 | 0.005 | 0.4922 vs 0.4922 |

      Adam divides each gradient by the square root of its own running average of squared gradients, so multiplying every
      gradient by 8 multiplies both by 8 and cancels, apart from the tiny `eps` in the denominator. The bug is silent, which is its
      own danger: it comes back the day you switch to SGD, add gradient clipping (`clip_grad_norm_(..., 1.0)` then trips eight
      times too early), or compare logged gradient norms between runs. Divide anyway.

  # ------------------------------------------------------------------ §7
  - section: 7
    after: "So this is not a precision problem at all"
    type: explainer
    style: warning
    title: "What really went stale: the scores, not the training"
    md: |
      Rerunning `train_bank` exactly as written, on synthetic data of the same shape, and printing **every** epoch's validation
      score instead of only the best shows something more specific than "part of the network is training on stale values":

      | mode | validation AUC, epochs 1, 2, 3 … 10 | the model scored after the block |
      |---|---|---|
      | `"fp32"` | 0.8904, 0.9564, 0.9706 … 0.9736 | 0.9736 |
      | `"whole"` | **0.8903, 0.8903, 0.8903 … 0.8903** | **0.9736** |
      | `"whole"`, `cache_enabled=False` | 0.8903, 0.9563, 0.9706 … 0.9736 | 0.9736 |

      1. **The training never ran in bf16.** In `"whole"` mode the inner block is `autocast(enabled=False)`, which switches
         autocast *off* for the forward pass even inside the outer block. The model trained normally.
      2. **The scoring froze.** The first `validation_auc()` call was the first forward pass under autocast, so it filled the cache
         with bf16 copies of the weights as they stood after epoch 1. Every later call reused them and got the same score, so
         `best` never moved. The lesson's **0.7584 is its model's validation AUC after one epoch**, reported ten times.
      3. **The backward passes and the scoring ran inside the block**, where autocast picks bf16 for the scoring's matrix
         multiplications and for some of the backward pass's (PyTorch's documentation advises against backward passes under
         autocast). That is why the cache-off run lands at 0.7848 rather than 0.7847: slightly different arithmetic, same quality.

      When the training forward pass is also inside a long block, training freezes too: every step computes its gradient at the
      weights of the very first step. On the synthetic data that version scored the *untrained* network's 0.5085 at every epoch,
      the same kind of number as the earlier draft's 0.4079.

      The advice stands, and the danger is worse than a lost 0.026: nothing warned that the score used to pick the best epoch,
      stop early or report the result had stopped measuring the model.

  # ------------------------------------------------------------------ §8
  - section: 8
    after: "A caught error can keep your memory alive"
    type: explainer
    style: tip
    title: "Clean up after the `except`, not inside it"
    md: |
      `largest_batch_that_fits` calls `gc.collect()` and `torch.cuda.empty_cache()` **inside** the `except` block, which is exactly
      where the traceback described above is still alive, holding the failed attempt's frame and its tensors. PyTorch's own FAQ
      ("My out of memory exception handler can't allocate memory") gives the fix: leave the handler first, then clean up.

      ```python
      def largest_batch_that_fits(attempt, start, smallest=1, errors=OUT_OF_MEMORY):
          size, log = start, []
          while size >= smallest:
              try:
                  attempt(size)
              except errors:
                  log.append((size, "out of memory"))
              else:
                  log.append((size, "fits"))
                  return size, log
              gc.collect()                          # outside the handler: the traceback is gone
              if torch.cuda.is_available():
                  torch.cuda.empty_cache()
              size //= 2
          return None, log
      ```

      It produces the same log with `pretend_gpu`. The original still works inside one process, because the tensors are freed
      once the handler exits and PyTorch reuses them for the next attempt, but its `empty_cache()` cannot hand them back to the
      driver. The GPU cell below has the same pattern.

