summary: What changes when a network learns its own features instead of being given
  them?
answers:
  1-1:
  - 1,000 × 1,000 × 3 = 3 million numbers. Each number on its own says almost nothing
    about what is in the photo, and a simple model would have to work out from scratch
    how millions of numbers relate to one another. It would need enormous amounts
    of data and would be easily confused by changes such as lighting or position.
    A representation compresses this into a much smaller set of meaningful features.
  2-1:
  - Because the encoder has already done the hard work. If the representation separates
    the classes well, a straight-line decision boundary (a linear layer) is enough
    to read off the answer. If the head needs to be large and complicated, that is
    often a sign the representation is not good enough.
  3-1:
  - 'The validation images are supposed to be unseen, so that the accuracy we measure
    on them tells us how the method performs on new data. If the encoder had trained
    on them, it could have learned features tuned to those specific images, and the
    validation accuracy would be optimistic. This is data leakage: information from
    the evaluation set leaking into training.'
  4-1:
  - The template lines up with particular pixel positions. If the bag is smaller or
    shifted, its outline falls on different pixels, so the weighted sum changes and
    the unit may not switch on. A hierarchical network that detects edges and parts
    wherever they appear is much less sensitive to this.
  5-1:
  - The errors are no longer caused by a lack of labelled examples; they are caused
    by the representation itself. Seven numbers cannot capture the differences between
    some classes (for example, shirt vs. pullover), so no amount of extra labels lets
    the classifier separate them. The representation has become the bottleneck.
