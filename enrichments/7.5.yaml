    \ for validation.\n    n_eval: Size of the reproducible evaluation subset.\n \
    \   verbose: Whether to print dataset audit counts."
  load_imdb_split.dedup: "Keep the first occurrence of each exact text not already\
    \ in the supplied seen set.\n\nArguments:\n    texts: Text strings in the order\
    \ expected by the caller.\n    labels: Integer targets aligned with the input\
    \ examples.\n    seen: Set of exact texts already retained."
  fingerprint: "Hash sorted texts to identify membership; this does not check row\
    \ order or labels.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller."
  positive_prob: "Return the sentiment model probability assigned to positive, restoring\
    \ original input order.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller.\n    batch_size: Maximum examples processed together."
  generate: "Generate continuation tokens under the declared decoding settings and\
    \ return decoded new text.\n\nArguments:\n    prompt: Text context supplied to\
    \ the generator.\n    seed: Seed controlling the local split or sampling generator.\n\
    \    **settings: Explicit settings forwarded to the operation described above."
  repeated_trigram_share: "Measure repeated three-word sequences in this generated\
    \ sample; this is not a general quality metric.\n\nArguments:\n    text: One input\
    \ text string."
  embed: "Mean-pool nonpadding token vectors and return unit-length sentence vectors.\n\
    \nArguments:\n    texts: Text strings in the order expected by the caller.\n \
    \   batch_size: Maximum examples processed together.\n    max_length: Token budget\
    \ including special tokens."
  image_vectors: "Preprocess Fashion-MNIST images, apply the CLIP image encoder and\
    \ normalise projected features.\n\nArguments:\n    idx: Indices selecting examples\
    \ from the declared collection.\n    invert: Whether to reverse grayscale polarity\
    \ before CLIP preprocessing."
  text_vectors: "Encode candidate descriptions with CLIP and normalise the projected\
    \ text features.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller."
  review_likeness: "Return similarity to the nearest reference review; use this as\
    \ a validated heuristic rather than a guarantee.\n\nArguments:\n    texts: Text\
    \ strings in the order expected by the caller."
  SentimentService: Wrap sentiment inference with per-input validation, an out-of-domain
    heuristic and confidence abstention.
  SentimentService.__init__: "Initialise the components and settings used by this\
    \ model or service.\n\nArguments:\n    classify: Callable returning positive-class\
    \ scores.\n    likeness: Callable returning review-likeness scores.\n    ood_threshold:\
    \ Validation-selected cutoff for the review-likeness heuristic.\n    conf_threshold:\
    \ Validation-selected cutoff for answering confidently.\n    max_chars: Maximum\
    \ accepted input length in characters."
  SentimentService.check: "Return a rejection reason for invalid input, or None for\
    \ a permitted text.\n\nArguments:\n    text: One input text string."
  SentimentService.predict: "Run the declared model or service and return predictions\
    \ in the original example order.\n\nArguments:\n    texts: Text strings in the\
    \ order expected by the caller."
