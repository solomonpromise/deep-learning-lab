summary: How do we turn a pretrained model's capability into a feature that behaves
  sensibly on real, messy inputs?
answers:
  2-1:
  - A two-class softmax always splits a probability of 1 between "positive" and "negative";
    there's no third option for "neither". The output only compares the two classes
    with each other, so any input, even gibberish, is pushed towards whichever class
    its features resemble slightly more, and the softmax can make that look very confident.
    Detecting that an input doesn't belong needs a separate signal, such as the review-likeness
    check in Section 6.
  3-1:
  - 'Greedy decoding is deterministic: the same context always gives the same next
    token. Once the text enters a pattern where the pattern itself makes the next
    repeat most likely (as with the blank lines), greedy has no way out. Sampling
    sometimes picks a less likely token, which changes the context and lets the text
    move on.'
  4-1:
  - MiniLM similarity mostly measures topic. Reviews of the same film, or of similar
    films, would score as similar whether they agree or disagree. Section 4.1's opposite-sentiment
    sentence scored 0.737, as high as a true paraphrase. To find reviews that agree,
    you'd need to combine similarity with a sentiment signal, or use a model trained
    to compare stances.
  5-1:
  - When you have no labelled data for your classes, or the classes change often.
    CLIP needs only a sentence per class, so a new category ("a photo of a raincoat")
    can be added instantly, without collecting and labelling images or retraining.
    It's also useful for searching images with free-text queries. If you have plenty
    of labelled images for a fixed set of classes, a trained model will usually be
    more accurate (Module 8 shows ways to adapt pretrained models).
  6-1:
  - 'Because the goal is to keep genuine reviews flowing: the threshold controls how
    many real reviews are wrongly flagged (here about 1%), and we can only measure
    that on genuine reviews. We didn''t have a representative collection of the non-reviews
    users might send, and any such set we invented would bias the threshold towards
    the examples we happened to think of. The cost is that we don''t know exactly
    how many non-reviews would slip through, so that is worth monitoring once the
    service is live.'
  7-1:
  - Answering everything gives 0.875, below the target. On the coverage–accuracy curve,
    accuracy reaches 0.932 at 80% coverage and 0.984 at 50%, so 0.95 requires answering
    somewhere between half and four-fifths of reviews. The manager has to decide whether
    it's acceptable for people to handle the rest, and how many people that needs.
    Alternatively, the model must be improved, for example by fine-tuning it on IMDb
    data (Module 8).
