quiz:
- q: What turns a model capability into a usable feature?
  options:
  - Input validation, decision rules, failure handling and evaluation.
  - A larger confidence score alone.
  - Removing all uncertain inputs from reporting.
  answer: 0
  why: Input validation, decision rules, failure handling and evaluation.
- q: Does high semantic similarity guarantee matching sentiment?
  options:
  - No; validate which distinctions a space preserves.
  - Yes, whenever cosine is positive.
  - Yes, for all sentence models.
  answer: 0
  why: No; validate which distinctions a space preserves.
- q: Why report coverage with answered-case accuracy?
  options:
  - A service can raise conditional accuracy by answering fewer cases.
  - Coverage is the same as recall.
  - Abstention makes every remaining answer correct.
  answer: 0
  why: A service can raise conditional accuracy by answering fewer cases.
