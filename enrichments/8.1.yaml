inserts: []
quiz:
- q: What is the goal of adaptation?
  options:
  - Improve task suitability while measuring costs and retained abilities.
  - Change every parameter automatically.
  - Avoid baselines.
  answer: 0
  why: Improve task suitability while measuring costs and retained abilities.
- q: What is trainable in full fine-tuning?
  options:
  - All selected model parameters, including the task head.
  - Only the tokenizer's vocabulary IDs.
  - Only the final prediction value.
  answer: 0
  why: All selected model parameters, including the task head.
- q: How should an adaptation strategy be chosen?
  options:
  - By quality, data, compute and capability-retention requirements.
  - By trainable parameter count alone.
  - By assuming the newest method wins.
  answer: 0
  why: By quality, data, compute and capability-retention requirements.
