summary: How can we adapt pretrained models to specific tasks without updating every
  parameter, and how do we prepare data for reliable adaptation?
answers:
  2-1:
  - 'For example: cost and speed (the small classifier runs the much smaller DistilBERT
    encoder once per review, while prompting runs a 360-million-parameter model over
    a long prompt); stability (a trained classifier''s behaviour is fixed, while prompt
    behaviour can change with small wording changes or a model update); calibrated
    probabilities and easy thresholds (Note 7.5); and the ability to improve steadily
    by adding labelled data, which prompting can''t use directly.'
  3-1:
  - 'No. Fine-tuning shapes how a model behaves, but it''s a poor and slow way to
    store new facts: the model may recall them wrongly, and this week''s contracts
    would need retraining every week. A better approach is to find the relevant contract
    text and put it into the prompt, so the model answers from the document in front
    of it. (That approach is called retrieval-augmented generation.)'
  4-1:
  - A random head produces arbitrary scores; with a slight bias towards one output,
    every review falls on the same side. Ten small updates in epoch 1 weren't enough
    to fix that. Predicting one class for everything scores the share of that class
    in the data, and 0.525 of these 200 validation reviews happen to be positive.
    That's chance level for this set, not real skill.
  5-1:
  - Validation accuracy measures only the task the model was fine-tuned for. Forgetting
    is about *other* abilities, such as the pretrained word-guessing skill measured
    in Section 5.2, which got worse even while the new task improved. To know whether
    anything was forgotten, you have to test those other abilities directly.
  6-1:
  - The fine-tuning end. With 50,000 labelled examples there's plenty of data to fine-tune
    safely, a GPU makes training practical, and a requirement for a small, fast model
    rules out prompting a large one. You'd still set baselines first (Note 8.3), then
    try PEFT and full fine-tuning of a small model, and keep the one that meets the
    requirement on validation and test.
