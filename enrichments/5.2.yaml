summary: How can a network take advantage of the fact that, in an image, position
  and neighbourhood matter?
answers:
  2-1:
  - '`(16, 3, 224, 224)`: 16 images, 3 colour channels, 224 rows, 224 columns.'
  3-1:
  - 'Using the same permutation keeps the task learnable and fair: a given pixel position
    still means the same thing in every image, just at a different place in the list.
    If each image were shuffled differently, the pixel values would carry no consistent
    positional meaning, and *no* model could learn much. That would not test whether
    the model uses spatial structure; it would just destroy the information.'
  4-1:
  - The maps would stay at 32 channels × 14 × 14, so `Flatten` would produce 32 ×
    14 × 14 = 6,272 numbers per image. The first `nn.Linear` would then need `in_features=6272`,
    otherwise PyTorch raises a shape error.
  5-1:
  - 'All the weights are positive and equal, so it adds up the brightness in each
    3×3 patch. Its feature map is a slightly blurred copy of the image. It is not
    a good edge detector: its weights do not cancel out (its balance is 1), so it
    responds to brightness, not to change.'
  6-1:
  - ⌊(224 + 2 × 3 − 7) / 2⌋ + 1 = ⌊223 / 2⌋ + 1 = 111 + 1 = 112. The output is 112×112.
  7-1:
  - 'The head is fully connected: after flattening, every one of the 1,568 values
    (covering all 7×7 positions of all 32 maps) feeds into the head. Each value describes
    a different 10×10 region, and together those regions cover the whole image, so
    the head can combine evidence from every part of the garment.'
  8-1:
  - Choosing the epoch is a decision based on data. If we made that decision using
    the test set, the test score would no longer be an honest estimate of performance
    on new data, because we would have picked the epoch that happened to suit those
    particular test images. The validation set exists to absorb those decisions; the
    test set is kept for one final, unbiased measurement.
  9-1:
  - Something else. With a balance of 1.00, its weights all share one sign, so on
    a uniform patch they do not cancel. It responds to overall brightness (if the
    weights are positive) or darkness (if they are negative) across each patch, so
    its map looks like a filled-in silhouette or its inverse, rather than a set of
    outlines.
