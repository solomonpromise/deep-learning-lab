# Teaching layer for Lesson 3.2 — Overfitting, and What to Do About It
# The notebook is the author's current version (not locked). Its Section 9 image prompt is hidden by the build and
# replaced here by the noise-floor lab it describes.

summary: |
  A network that is too big for its data memorises it. You make that happen on purpose (German Credit: 500 training rows,
  48,897 parameters, training AUC 1.0 and a validation loss 3.4 times worse than its best), learn why **validation loss and AUC
  tell different stories** (confidence against ranking), and compare the four standard fixes: a **smaller model**, **weight decay**,
  **dropout** (plus the `model.eval()` bug) and **early stopping**. Then the twist: once early stopping is applied, every
  configuration lands within the **noise floor** of a 250-row validation set. Measure the noise before you believe a ranking.

inserts:
  # ------------------------------------------------------------------ §2
  - section: 2
    after: "Roughly a hundred parameters for every training row"
    type: compare
    title: "Two setups, 658 times apart"
    items:
      - { title: "Bank Marketing (Module 2)", tone: blue, icon: database, md: "36,168 training rows, 5,377 parameters: **0.149 parameters per row**. After 40 epochs: train AUC 0.847, validation 0.786." }
      - { title: "German Credit (this lesson)", tone: orange, icon: alert, md: "500 training rows, 48,897 parameters: **97.8 parameters per row**. After 60 epochs: train AUC 1.000, validation 0.742." }

  # ------------------------------------------------------------------ §3
  - section: 3
    before: "base = run()"
    type: predict
    mode: choice
    prompt: "The `(256, 128)` network trains for 60 epochs on 500 rows with no regularisation. Its validation loss is lowest early on. Where does it end up?"
    options: ["About where it was at its best", "About 1.5 times its best", "More than 3 times its best"]
    answer: 2
    reveal: |
      **3.4 times its best:** 0.4733 at epoch 5, 1.5925 at epoch 60, while training loss falls to 0.0006 and training AUC reaches 1.0.
      Validation AUC drops far less, from 0.82 to 0.74. Section 4 explains why the two disagree.

  - section: 3
    after: "increasingly learns details that are specific to the training set"
    type: widget
    name: curve-doctor
    title: "Curve doctor: generalisation cases"
    props: { patterns: [healthy, overfit, underfit, leak] }
    intro: "Four patients, read from their training and validation loss alone. The overfit case is the shape you just produced."

  # ------------------------------------------------------------------ §4
  - section: 4
    after: "Suppose a bug multiplies every output logit by 3 before the sigmoid"
    type: widget
    name: logit-temperature
    title: "Confidence, ranking and the threshold"
    intro: |
      250 simulated validation rows, 30% bad, with well-calibrated scores. **Answer the question above first**, then use the
      *Bug: ×3* preset to check. *Overfitted* mimics the epoch-60 model; *Too cautious* mimics the over-regularised model of Section 9.

  # ------------------------------------------------------------------ §6
  - section: 6
    after: "That distinction is worth remembering because the two methods can produce similar-looking improvements for different reasons"
    type: explainer
    style: why
    title: "Why weight decay barely moved the best checkpoint"
    md: |
      AdamW shrinks every weight by a factor of $1 - \text{lr}\cdot\lambda$ per step. With lr = 0.001 and λ = 1.0 that is 0.1% per step,
      and with 500 rows in batches of 32 there are 16 steps per epoch. By epoch 5, where every run's best checkpoint sits, that is 80 steps:
      $0.999^{80} \approx 0.92$, a gentle 8% pull. By epoch 60 it is 960 steps, $0.999^{960} \approx 0.38$. Decay is slow, so it mostly acts
      **after** the best epoch: the best validation loss barely changes (0.4733 → 0.4723) while the final one improves a lot (1.59 → 0.96).
      A stronger λ, or a larger learning rate, would reach the early epochs sooner.

  # ------------------------------------------------------------------ §7
  - section: 7
    after: "We will deliberately create that bug before fixing it"
    type: widget
    name: dropout-lab
    title: "Dropout, one forward pass at a time"
    intro: |
      One input row, twelve hidden units, one output. Press the button repeatedly in **training** mode, then switch to **evaluation**.
      Watch the survivors grow: PyTorch scales them by 1/(1−p) during training, so evaluation can simply use every unit as it is.

  # ------------------------------------------------------------------ §8
  - section: 8
    after: "es_big = train_early_stopping()"
    type: widget
    name: results-bars
    title: "The same network: stopped early, or trained to the end"
    props:
      metrics:
        - title: "Validation ROC-AUC"
          digits: 4
          min: 0.5
          max: 0.85
          rows:
            - { label: "Fixed 60 epochs", value: 0.7424, series: 1 }
            - { label: "Early stopping (epoch 5 restored)", value: 0.8095, series: 0 }
        - title: "Test ROC-AUC (never used for any decision)"
          digits: 4
          min: 0.5
          max: 0.85
          rows:
            - { label: "Fixed 60 epochs", value: 0.7019, series: 1 }
            - { label: "Early stopping (epoch 5 restored)", value: 0.7528, series: 0 }
      footnote: "Early stopping stopped at epoch 15 and restored epoch 5: 45 fewer epochs, and a better model."

  # ------------------------------------------------------------------ §9
  - section: 9
    after: "A metric can be excellent at measuring one property while being completely blind to another property you care about"
    type: explainer
    style: warning
    title: "The \"best\" AUC here is also a maximum over 60 epochs"
    md: |
      The over-regularised model's 0.8424 is the *best* validation AUC across 60 epochs, the winner of 60 looks at one 250-row set, and
      its training AUC is barely lower (0.8408). With early stopping on validation **loss** (Section 10) the same configuration reports
      0.8288. A single maximum picked from many noisy measurements is an optimistic number, which is exactly the problem the rest of this
      section measures.

  - section: 9
    after: "Day 4 turns these ideas into a more formal experimental protocol"
    type: widget
    name: noise-floor
    title: "The noise floor, drawn"
    intro: |
      The ten validation AUCs from the cell above: one configuration, one seed, ten different splits. The band is mean ± 2 standard
      deviations. Move config A away from config B until the gap clears the band, then draw ten more splits and see the band move.

  - section: 9
    after: "Day 4 turns these ideas into a more formal experimental protocol"
    type: explainer
    style: deep
    title: "How much noise does a 250-row validation set really have?"
    md: |
      The ten splits give a standard deviation of 0.015. Sampling theory suggests the pure sampling noise of a 250-row validation set is
      larger: simulating scores with this lesson's AUC and class balance on fresh, independent 250-row sets gives a spread of about
      **0.03** (about 0.016 for 1,000 rows, and **0.09 for 30 rows**). Ten measurements only estimate a spread roughly, and these ten splits
      share part of their rows. Treat "0.03" as an order of magnitude, not a threshold: a 0.005 gain is noise here, and a 0.05 gain needs
      checking on more splits or seeds before you believe it.

  # ------------------------------------------------------------------ §10
  - section: 10
    after: "is different from “they are mathematically identical.”"
    type: explainer
    style: deep
    title: "Comparing on the same test rows is a paired comparison"
    md: |
      The noise floor was measured by changing the **split**. The final table scores every configuration on the **same** 250 test rows, and
      then much of the noise is shared: every model finds the same rows easy and the same rows hard. The quantity that matters is the noise
      of the *difference* between two models, which is usually well below either score's own spread. Bootstrapping the test rows and
      recomputing both AUCs on each resample gives that directly, and the same resamples give a confidence interval for the gap. So "8 of 8
      within the noise floor" is a cautious reading. It is still the right conclusion for this lesson: no configuration has a margin
      you could defend.

answers:
  "4-1":
    - |
      Multiplying every logit by 3 keeps their **order** and their **sign**.

      - **ROC-AUC: unchanged.** It depends only on how the rows are ordered, and a positive scaling preserves the order exactly.
      - **Accuracy at 0.5: unchanged.** A row is predicted positive when $\sigma(z) > 0.5$, which means $z > 0$, and $3z > 0$ exactly when
        $z > 0$. The threshold sits at the one point scaling cannot move.
      - **Loss: changes.** Every probability is pushed towards 0 or 1: confident correct predictions cost a little less and wrong ones cost
        much more. For a calibrated model the loss rises; for an under-confident model it could even fall.

      In short: ranking and the 0.5 threshold are blind to the bug, confidence is not. (A bug that *added* a constant to the logits would
      also change accuracy, but still not AUC.) The lab above shows all three.
  "5-1":
    - |
      **No.** A training AUC below 1.0 only says the model cannot memorise the training set, which is what regularisation is for.
      Underfitting would show up as training *and* validation performance both low and close together, with validation improving when you
      add capacity. Evidence to inspect: the **validation** trend across sizes (here the `(8,)` model has the *lowest* best validation loss,
      0.4569, and the highest best validation AUC, 0.836); the **gap** between final training and validation AUC (about 0.06 for `(8,)`,
      against 0.26 for the big model); **learning curves** over more epochs and more data (does more data help a small model?); and a simple
      **baseline** such as logistic regression. If a slightly larger model does not beat it on validation by more than the noise floor,
      the small model is small enough.
  "7-1":
    - |
      **Involving `model.eval()`:** the evaluation script never calls `model.eval()`, so dropout is still active. The score is lower and
      changes from run to run (Section 7 measured a mean penalty of 0.018 AUC and a 0.05 spread).

      **Not involving it:** the reloaded model or data is not the one that scored 0.84. Common causes: the checkpoint saved the *last*
      epoch rather than the best; the 0.84 was computed on a different split (or during training, on batches, with a different metric
      routine); or the evaluation script rebuilds the preprocessing, for example refitting the scaler or one-hot encoder on the evaluation
      data, so the features no longer mean what they meant in training.

      **The single check:** evaluate the reloaded model **twice on the same data**. If the two results differ, something stochastic is
      still on (dropout in training mode). If they are identical and still 0.81, the difference lies in the checkpoint, the data or the
      preprocessing.
  "8-1":
    - |
      It costs **data** and **honesty**. Data: the validation rows cannot be used for training, and because the validation set now makes a
      decision, you need yet another untouched test set to report a fair number, so fewer rows are left to learn from. Honesty: the chosen
      checkpoint's validation score is optimistic, because it was picked for being the best on those rows. It also costs an evaluation
      every epoch, a copy of the best weights in memory, and two new settings (patience, `min_delta`).

      **Not with 30 rows.** At a 30% positive rate that is about 9 bad and 21 good rows. The AUC of such a set moves by about **0.09** from
      one sample to the next (a simulation with this lesson's AUC), far more than the real differences between checkpoints. Choosing the
      best of 200 checkpoints would mostly choose the luckiest noise, and its score would be badly inflated. A bigger validation set, or
      cross-validation, is the fix.

explain:
  - cell: "def run(hidden=(256,128), p_drop=0.0, wd=0.0"
    title: "The experiment runner"
    summary: "One function trains every configuration in the lesson, records both splits every epoch, and remembers the best-validation-loss weights."
    lines:
      - match: "opt = torch.optim.AdamW(model.parameters(), lr=lr, weight_decay=wd)"
        note: "AdamW, so `wd` is decoupled weight decay (Lesson 3.1). With `wd=0` it is plain Adam."
      - match: "a, b = model(Xt), model(Xv)"
        note: "Score the **whole** training and validation sets in evaluation mode every epoch: 500 and 250 rows fit in one batch."
      - match: "tracc=accuracy_score(y_tr, pa > 0.5), vacc=accuracy_score(y_va, pb > 0.5))"
        note: "Accuracy needs a threshold; AUC and loss do not. Section 9 shows why that matters."
      - match: "best = dict(vl=rec[\"vl\"], epoch=ep, state=copy.deepcopy(model.state_dict()))"
        note: "Keep a real copy of the best weights, but keep training: this function measures what happens *after* the best epoch."

  - cell: "# THE BUG: evaluating without model.eval()"
    title: "Reproducing the evaluation bug"
    lines:
      - match: "m.train()                                  # WRONG: dropout still active at eval time"
        note: "`torch.no_grad()` below does not help: it switches off gradients, not dropout."
      - match: "torch.manual_seed(0)"
        note: "Seeded so the five buggy scores are reproducible; each pass still draws a different dropout mask."

  - cell: "def train_early_stopping(hidden=(256,128)"
    title: "Early stopping that restores the best weights"
    lines:
      - match: "if vl < best_vl - 1e-5:"
        note: "Only an improvement larger than 1e-5 counts (a `min_delta`), so rounding noise cannot reset patience."
      - match: "if since >= patience:"
        note: "Ten epochs without improvement: stop."
      - match: "model.load_state_dict(best_state)                           # <- the step people forget"
        note: "Without this line you would report the model from the *stopping* epoch, ten epochs past the best."
      - match: "te = roc_auc_score(y_te, torch.sigmoid(model(Xs)).numpy().ravel())"
        note: "The test score is computed once, after every decision, and never used to choose anything."

  - cell: "# Measure the noise floor: same config, same seed, only the data split changes."
    title: "Measuring the noise floor"
    summary: "Ten runs in which only `random_state` of the split changes: the model, seed, epochs and preprocessing recipe are identical."
    lines:
      - match: "Xa, Xb_, ya, yb_ = train_test_split(X_raw, y_raw, train_size=500, random_state=rs, stratify=y_raw)"
        note: "A different 500/250 split each time; stratified, so the 30% bad rate is kept."
      - match: "A1 = p2.fit_transform(Xa).astype(np.float32); A2 = p2.transform(Xv2).astype(np.float32)"
        note: "The preprocessing is refitted on each new training split, exactly as a real rerun would do."
      - match: "torch.manual_seed(SEED); g = torch.Generator().manual_seed(SEED)"
        note: "Same initial weights and batch order every time, so the spread comes from the data split alone."

takeaways:
  - "Overfitting needs freedom relative to the data: 97.8 parameters per training row memorises; 0.149 barely does. First confirm the failure exists before testing a fix."
  - "The signature: training and validation improve together, then validation turns while training keeps improving. Keep the weights from the turn."
  - "Validation **loss** sees confidence; **AUC** sees only ranking; **accuracy** sees only which side of a threshold each row falls. An overfitted model can rank well and be wildly overconfident."
  - "Start with a smaller model (it removes capacity), then weight decay (keeps capacity, penalises large weights), dropout (random units off in training only) and early stopping (keep the best epoch)."
  - "Always `model.eval()` before evaluating. If the same model on the same data gives different scores, something stochastic is still on."
  - "Over-regularising compresses predictions: AUC can look fine while nothing crosses the 0.5 threshold."
  - "Measure the noise floor (same config, different splits or seeds) before ranking configurations. Here every early-stopped configuration fell within it."

quiz:
  - q: "Training loss keeps falling while validation loss has been rising for 20 epochs. What is happening?"
    options: ["Underfitting", "Overfitting: the model is learning details specific to the training rows", "The learning rate is too small", "The validation set is leaked"]
    answer: 1
    why: "The two curves improved together and then separated: the classic overfitting signature."
  - q: "Every logit is multiplied by 3 by mistake. Which metric changes?"
    options: ["ROC-AUC", "Accuracy at a 0.5 threshold", "Log loss", "None of them"]
    answer: 2
    why: "Scaling keeps the order (AUC) and the sign (the 0.5 decision); only the confidence, and so the loss, changes."
  - q: "Which intervention removes capacity rather than constraining how it is used?"
    options: ["Weight decay", "Dropout", "A smaller model", "Early stopping"]
    answer: 2
    why: "Fewer units means fewer functions the model can represent; the other three keep the architecture."
  - q: "You evaluate the same model on the same data twice and get 0.751 and 0.709. The most likely cause is:"
    options: ["A bad learning rate", "Dropout still active because `model.eval()` was not called", "Too few epochs", "The test set is too large"]
    answer: 1
    why: "Evaluation should be deterministic. Different results mean some training-time randomness is still switched on."
  - q: "Early stopping stops at epoch 15 with patience 10. Which weights should you keep?"
    options: ["Epoch 15's", "Epoch 5's, the best validation loss", "An average of epochs 5 to 15", "Epoch 1's"]
    answer: 1
    why: "Stopping is only half of it: restore the best checkpoint, or you ship a model ten epochs past its best."
  - q: "Config A scores 0.824 and config B 0.818 on validation. The same config varies with a standard deviation of 0.015 across splits. What can you conclude?"
    options: ["A is better", "B is better", "The experiment cannot tell them apart", "Both are overfitting"]
    answer: 2
    why: "A 0.006 gap is well inside the ordinary movement of the score (2 sd ≈ 0.03)."

docstrings:
  make_mlp: |
    Build an MLP of any width and depth, with optional dropout, from reproducible weights.

    Each hidden size adds ``Linear → ReLU`` (plus ``Dropout`` when ``p_drop > 0``); a final
    ``Linear`` produces one logit. PyTorch is seeded first, so the same arguments always
    give the same initial weights.

    Args:
        hidden: Width of each hidden layer, in order, e.g. ``(256, 128)``.
        p_drop: Dropout probability after each hidden activation; 0 adds no dropout layers.
        seed: Seed for the weight initialisation.
        d_in: Number of input features; defaults to ``D``, the encoded German Credit width.

    Returns:
        An ``nn.Sequential`` that outputs one raw logit per row.
  n_params: |
    Count the parameters of a model.

    Args:
        m: Any ``nn.Module``.

    Returns:
        The total number of elements across ``m.parameters()``.
  run: |
    Train one configuration for a fixed number of epochs and record both splits every epoch.

    Trains with AdamW on the 500 training rows, then after every epoch scores the whole
    training and validation sets in evaluation mode (loss, ROC-AUC, accuracy at 0.5). The
    weights with the lowest validation loss are copied, but training continues, so the
    history shows what happens after the best epoch.

    Args:
        hidden: Hidden-layer widths for ``make_mlp``.
        p_drop: Dropout probability.
        wd: Decoupled weight-decay coefficient for AdamW.
        lr: Learning rate.
        epochs: Number of epochs to train (no early stopping).
        bs: Mini-batch size.
        seed: Seed for the weights and the batch order.
        track_test: Also record test ROC-AUC every epoch (as ``"tea"``).

    Returns:
        A dict with ``"hist"`` (one record per epoch: ``trl``/``vl`` losses, ``tra``/``va``
        AUCs, ``tracc``/``vacc`` accuracies), ``"best"`` (``vl``, ``epoch`` and ``state`` of
        the best-validation-loss epoch) and ``"model"`` (the model after the last epoch).
  train_early_stopping: |
    Train with early stopping on validation loss, restore the best weights, then score.

    Stops once validation loss has not improved by more than 1e-5 for ``patience``
    epochs, loads the best epoch's weights, and reports validation and test ROC-AUC for
    that restored model.

    Args:
        hidden: Hidden-layer widths for ``make_mlp``.
        p_drop: Dropout probability.
        wd: Decoupled weight-decay coefficient for AdamW.
        lr: Learning rate.
        max_epochs: Upper limit on epochs.
        patience: Epochs without improvement before stopping.
        bs: Mini-batch size.
        seed: Seed for the weights and the batch order.
        verbose: Print a line when training stops early.

    Returns:
        A dict with the restored ``"model"``, ``"best_epoch"``, ``"best_vl"`` (its validation
        loss), ``"val_auc"``, ``"test_auc"`` and ``"ran"`` (epochs actually run).
