docstrings:
  benchmark_clock: Read elapsed time after synchronising any queued CUDA work.
  ordered_fingerprint: "Hash ordered text/label pairs to verify alignment for paired\
    \ comparisons.\n\nArguments:\n    texts: Text strings in the order expected by\
    \ the caller.\n    labels: Integer targets aligned with the input examples."
  load_imdb_split: "Load the declared IMDb revision, remove exact duplicates and construct\
    \ the seeded course splits.\n\nArguments:\n    seed: Seed controlling the local\
    \ split or sampling generator.\n    n_val: Number of training-half reviews reserved\
    \ for validation.\n    n_eval: Size of the reproducible evaluation subset.\n \
    \   verbose: Whether to print dataset audit counts."
  load_imdb_split.dedup: "Keep the first occurrence of each exact text not already\
    \ in the supplied seen set.\n\nArguments:\n    texts: Text strings in the order\
    \ expected by the caller.\n    labels: Integer targets aligned with the input\
    \ examples.\n    seen: Set of exact texts already retained."
  fingerprint: "Hash sorted texts to identify membership; this does not check row\
    \ order or labels.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller."
  p_positive: "Compute the candidate model score for positive under the explicitly\
    \ declared label mapping.\n\nArguments:\n    r: Model repository ID or LoRA rank,\
    \ as used at this call site.\n    texts: Text strings in the order expected by\
    \ the caller.\n    max_length: Token budget including special tokens.\n    batch_size:\
    \ Maximum examples processed together."
  sign_test: "Test paired correctness disagreements under equal probability of either\
    \ method alone being correct.\n\nArguments:\n    p_a: Positive-class scores from\
    \ the first method.\n    p_b: Positive-class scores from the second method.\n\
    \    labels: Integer targets aligned with the input examples."
inserts: []
quiz:
- q: Why write requirements before comparing candidates?
  options:
  - To make acceptance criteria independent of attractive scores.
  - To guarantee one candidate wins.
  - To avoid evaluating representative inputs.
  answer: 0
  why: To make acceptance criteria independent of attractive scores.
- q: Why verify label mappings?
  options:
  - Models can use different label names, orders or neutral classes.
  - Every model uses index one identically.
  - A model's largest logit names its own class.
  answer: 0
  why: Models can use different label names, orders or neutral classes.
- q: Why keep a decision record?
  options:
  - To connect the choice to evidence, assumptions and failure cases.
  - To hide rejected candidates.
  - To guarantee future data never changes.
  answer: 0
  why: To connect the choice to evidence, assumptions and failure cases.
