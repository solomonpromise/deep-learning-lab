summary: How do we choose a pretrained model for a real task, and justify that choice
  with evidence?
answers:
  2-1:
  - Choosing among several checkpoints by their test accuracy means the chosen one
    is partly the *luckiest* on that test set. Its test score includes some of that
    luck, so a fresh test set would probably give a slightly lower number. The effect
    is small with only 5 checkpoints to choose from, but it is the same mistake as
    tuning settings on test, and it means no part of IMDb's official data gives a
    perfectly clean estimate for this model.
  3-1:
  - Because if we chose the treatment of "neutral" after seeing the accuracies, we
    could pick whichever option made the model look best, which is tuning on our evaluation
    data. Deciding in advance, based on what the task needs (a positive-or-negative
    answer), keeps the measurement honest.
  4-1:
  - 'The setting (`max_length` 512) was chosen because it did best on validation,
    and part of that advantage is luck specific to those 300 reviews. On new reviews,
    that luck doesn''t repeat, so a slightly lower score is expected. A *much* lower
    test score would be a warning: it could mean the validation set is unrepresentative,
    that something leaked, or that the setting was overfitted to validation, and you''d
    investigate before deploying.'
  5-1:
  - 'Run it through the same process. Add it as a candidate, read its card and any
    training records (especially: does its training data include IMDb, and which splits?),
    check the licence and label mapping, test it on the same representative inputs,
    measure it on the same validation reviews (same fingerprint) with the same latency
    and memory checks, and only if it passes and wins, confirm once on the test set
    and update the decision record. A claimed 0.95 on IMDb is exactly the kind of
    number that should trigger a contamination check.'
