  # ------------------------------------------------------------------ §7
  - section: 7
    after: "comparison = pd.DataFrame(results).T"
    type: widget
    name: results-bars
    title: "Same rows, two splits, and a floor that moves"
    props:
      metrics:
        - title: "Test ROC-AUC"
          note: "random ranking scores 0.5 on any test set"
          digits: 4
          min: 0.5
          max: 0.82
          rows:
            - { label: "Stratified split", value: 0.7796, series: 0 }
            - { label: "Chronological split", value: 0.6108, series: 1 }
        - title: "Test PR-AUC"
          note: "higher on the chronological split, but its floor is 0.471"
          digits: 4
          max: 0.6
          rows:
            - { label: "Stratified split", value: 0.4331, series: 0 }
            - { label: "Chronological split", value: 0.5531, series: 1 }
        - title: "PR-AUC above its floor (the share of positives)"
          note: "what the model adds over random ranking"
          digits: 3
          max: 0.35
          rows:
            - { label: "Stratified: 0.4331 − 0.117", value: 0.316, series: 0 }
            - { label: "Chronological: 0.5531 − 0.471", value: 0.082, series: 1 }
      footnote: "Subtract the floor and PR-AUC tells the same story as ROC-AUC: the chronological model adds a quarter of what the stratified one does."

