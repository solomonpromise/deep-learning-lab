# Teaching layer for Lesson 4.1 — Data You Can Trust
# The notebook is the author's current version (not locked). Its three IMAGE placeholders (a label plus a description,
# no image) are hidden by the build and replaced here by SVG figures.

summary: |
  How do you know your validation score is telling the truth? This lesson checks the trust you have placed in every split since
  Module 2. You **audit** Bank Marketing for problems `isna()` cannot see (sentinels, placeholders, near-constant columns), write a
  split function with four rules and **checks that stop the run**, fit preprocessing on training rows only, and then find three real
  failures in the same file: a hidden **clock** (the yes rate goes from 5% to 52% down the file, so a chronological split scores
  0.61 where a random one scores 0.78), **group leakage** through the calling day (about 0.08 AUC), and **class imbalance**, where
  re-weighting moves the threshold but not the ranking.

