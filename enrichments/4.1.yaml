  # ------------------------------------------------------------------ §3
  - section: 3
    after: "inputs_only = data.drop(columns=\"y\")"
    type: explainer
    style: warning
    title: "The output says 16, not none"
    md: |
      The cell prints **16** rows that repeat entirely and 16 whose inputs repeat, but the text below it, and the data card in Section 11,
      say there are none. Sixteen of 45,211 rows (0.04%) is far too few to move any score in this lesson, and because the two counts are
      equal, none of the duplicates disagree about the label. They still break the rule this lesson is about: a duplicated row can land on
      both sides of a split, Case 4 of Lesson 3.4 in miniature. Either drop them before splitting (`data = data.drop_duplicates()`) or keep
      them deliberately and say so in the data card.

  # ------------------------------------------------------------------ §6
  - section: 6
    after: "rolling_rate = pd.Series((data[\"y\"] == \"yes\").astype(float)).rolling(1000, center=True).mean()"
    type: figure
    svg: |
      <svg viewBox="0 0 720 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rows in date order: 2008, 2009 and 2010 with rising success rates" style="font-family:Inter,system-ui,sans-serif"><text x="360.0" y="26" text-anchor="middle" style="fill:var(--ink);font-size:18px;font-weight:800">A dataset with a clock in it</text><rect x="30.0" y="92" width="404.8" height="40" style="fill:var(--c1);fill-opacity:0.21"/><rect x="32" y="60" width="400.79396607020414" height="22" rx="5" style="fill:var(--surface-2);stroke:var(--line)"/><text x="232.39698303510207" y="75" text-anchor="middle" style="fill:var(--ink-2);font-size:11px;font-weight:700">May…Dec</text><path d="M 32.0 144 v 8 h 400.8 v -8" style="fill:none;stroke:var(--ink-3);stroke-width:1.3"/><text x="232.39698303510207" y="172" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:800">2008</text><text x="232.39698303510207" y="190" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:600">27,729 rows</text><text x="232.39698303510207" y="207" text-anchor="middle" style="fill:var(--c1);font-size:12.5px;font-weight:800">5% said yes</text><rect x="434.8" y="92" width="217.0" height="40" style="fill:var(--c1);fill-opacity:0.41"/><rect x="436.79396607020414" y="60" width="212.9587047399969" height="22" rx="5" style="fill:var(--surface-2);stroke:var(--line)"/><text x="543.2733184402026" y="75" text-anchor="middle" style="fill:var(--ink-2);font-size:11px;font-weight:700">Jan…Dec</text><path d="M 436.8 144 v 8 h 213.0 v -8" style="fill:none;stroke:var(--ink-3);stroke-width:1.3"/><text x="518.2733184402026" y="172" text-anchor="middle" style="fill:var(--ink);font-size:14px;font-weight:800">2009</text><text x="518.2733184402026" y="190" text-anchor="middle" style="fill:var(--ink-2);font-size:12px;font-weight:600">14,862 rows</text><text x="518.2733184402026" y="207" text-anchor="middle" style="fill:var(--c1);font-size:12.5px;font-weight:800">17% said yes</text><rect x="651.