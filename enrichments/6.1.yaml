summary: What is a Transformer, as a whole, and how does information flow through
  it?
answers:
  3-1:
  - '`(8, 50, 65)`: 8 sequences, 50 positions each, and 65 scores (one per character)
    at every position.'
  4-1:
  - Attention moves information *between* tokens, letting each token gather what is
    relevant from the others. The feed-forward network processes the information *within*
    each token's vector, separately for every token.
  5-1:
  - '(a) Encoder-only: you need to understand a complete email, not generate text.
    (b) Decoder-only: a chatbot generates its reply one token at a time. (c) Encoder–decoder:
    an encoder reads the whole German sentence and a decoder generates the English
    one, using cross-attention to consult the German. (Large decoder-only models can
    also translate, by treating the German text and its translation as one long sequence.)'
  6-1:
  - Before the first block, a token's vector is just its token embedding plus its
    position embedding. Both `d` tokens have the same ID and the same position (8),
    so they get exactly the same two vectors and the same sum. No information from
    other tokens has been mixed in yet.
  8-1:
  - 224 / 16 = 14 patches along each side, so 14 × 14 = 196 patch tokens.
