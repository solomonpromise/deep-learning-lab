    \ Token budget including special tokens."
  weight_bytes: "Count the storage occupied by tensors in this state dictionary under\
    \ their actual dtypes.\n\nArguments:\n    m: Model or module being inspected or\
    \ evaluated."
  quantize_linear_weights: "Simulate per-row int8 rounding of linear weights and estimate\
    \ the corresponding packed storage.\n\nArguments:\n    m: Model or module being\
    \ inspected or evaluated."
  p_positive: "Compute the candidate model score for positive under the explicitly\
    \ declared label mapping.\n\nArguments:\n    m: Model or module being inspected\
    \ or evaluated.\n    texts: Text strings in the order expected by the caller."
