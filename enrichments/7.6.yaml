summary: What does it take to run a pretrained model as a reliable, affordable feature,
  and which levers do we have?
answers:
  2-1:
  - No. With requests arriving a few per minute, a batching window would almost never
    collect more than one request, so there's no throughput to gain, and every request
    would wait for the window to close, adding latency for nothing. Dynamic batching
    pays off when many requests arrive close together.
  3-1:
  - Try larger batch sizes, such as 32 or 64. A single request leaves most of a GPU's
    parallel units idle, and the time to move data to and from the GPU dominates.
    With a full batch, the GPU's advantage usually shows clearly. They should also
    make sure they synchronise before stopping the timer, since GPU work runs in the
    background.
  4-1:
  - 1.5 billion × 4 bytes = 6 GB in float32, and × 2 bytes = 3 GB in bfloat16. In
    bfloat16 the weights alone would take most of a 4 GB GPU, leaving little room
    for activations (and a KV cache, for generation), so it would be very tight. Int8
    quantisation (about 1.5 GB of weights) would make it fit comfortably.
  5-1:
  - Because only the Linear layers were quantised. The embedding tables, 95.3 MB of
    the original 267.8 MB, stayed in float32 at 4 bytes per number. To get closer
    to a quarter, you would also have to quantise the embeddings (and any other large
    float32 tensors); libraries offer this, with the usual need to check accuracy
    afterwards.
  6-1:
  - Users will receive the *old* model's answers for every input that was cached before
    the upgrade, while new inputs get the new model's answers. The service will behave
    as a confusing mix of two models, until each cached entry expires or the cache
    is cleared, which may be never if the cache has no expiry. The fix is to include
    the model version in the key, so a new model starts with a fresh cache.
  7-1:
  - 'At launch, a hosted service: a few hundred requests a day cost little, and you
    avoid running machines. Measure the monthly request volume and its growth, the
    hosted cost per request, and the throughput a local machine achieves for your
    model, as in Section 2. When the projected hosted bill exceeds the cost of machines
    that could serve the traffic (plus the effort of running them), it''s time to
    consider self-hosting. Privacy or version-control needs may also force the switch
    earlier.'
