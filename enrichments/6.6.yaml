quiz:
- q: What differs between the training and generation loops?
  options:
  - Training uses known histories and updates weights; generation chooses tokens from
    its evolving history.
  - Generation updates weights after every output token.
  - Training must sample its own history at every position.
  answer: 0
  why: Training uses known histories and updates weights; generation chooses tokens
    from its evolving history.
- q: What does gradient clipping at norm 1 do?
  options:
  - Rescale gradients only when their combined norm exceeds 1.
  - Force every gradient coordinate to be exactly 1.
  - Guarantee that validation loss decreases at each step.
  answer: 0
  why: Rescale gradients only when their combined norm exceeds 1.
- q: Why use both evaluation mode and no-grad inference?
  options:
  - Evaluation mode controls relevant layers; no-grad disables gradient tracking.
  - They are two names for the same operation.
  - Evaluation mode updates the model from generated text.
  answer: 0
  why: Evaluation mode controls relevant layers; no-grad disables gradient tracking.
