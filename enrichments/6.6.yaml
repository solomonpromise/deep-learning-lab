summary: How does a Transformer learn from text, and how does it turn what it learned
  into new text?
answers:
  4-1:
  - −log(0.25) = log(4) ≈ 1.386.
  9-1:
  - 'Dividing the logits by 0.1 multiplies the differences between them by 10, so
    the distribution becomes extremely sharp: almost all the probability would go
    to `''t''`, and the result would be very close to greedy decoding.'
  10-1:
  - During training, the input at every position is real text that is known in advance,
    so every position's prediction can be computed at once (with the causal mask keeping
    each one honest). During generation, the input at the next position is the character
    the model is about to choose, which does not exist until the current step has
    finished, so each step must wait for the previous one.
