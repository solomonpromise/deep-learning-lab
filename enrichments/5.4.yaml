summary: How can a network use the order of a sequence, and why did that lead to attention?
answers:
  1-1:
  - 'Many answers work. For example: the steps of a recipe (mix then bake is not the
    same as bake then mix), a phone number or PIN, a sequence of moves in a game,
    or a patient''s symptoms appearing in a particular order.'
  2-1:
  - 32 numbers in both cases. The hidden state has a fixed size, whatever the length
    of the sequence. That is the information bottleneck of Section 5.
  3-1:
  - The rule is the same, but the distance the learning signal must travel is not.
    At length 50, the gradient from the final output must pass back through 49 steps
    before reaching the first token, and it shrinks at every step, so almost nothing
    arrives to teach the network what it should have stored. At length 10, enough
    of the gradient survives.
  4-1:
  - Its forget gate started at about 0.5, so it kept only half its memory per step,
    and the memory (and gradient) vanished almost as fast as in a plain RNN, before
    the gates could learn to stay open.
  6-1:
  - First, everything must be compressed into a fixed-size hidden state, so facts
    from early in the document are overwritten by later ones (the information bottleneck).
    Second, the 10,000 steps must be computed one after another, which makes training
    slow and wastes the parallel power of modern hardware.
