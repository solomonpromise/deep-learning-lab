summary: How do we turn raw data into a dataset that adaptation can learn from reliably,
  and that gives honest evaluation numbers?
answers:
  4-1:
  - 'For example: the same review with a few words changed or a sentence added, or
    the same text posted with a different ending. Normalisation only removes trivial
    formatting differences. To catch these you''d compare overlapping word sequences
    (for example with a technique called MinHash), or compare sentence embeddings
    (Note 7.5) and flag pairs with very high similarity for review.'
  5-1:
  - The model learns two answer forms, so at prediction time it may produce either,
    and code that looks for exactly "negative" will miss "Negative.". The examples
    also teach the model that the answer's form varies for no reason, which wastes
    some of what it learns. Choose one format and apply it to every example.
  7-1:
  - 'It''s leakage through model selection: the test set has been used to make a choice.
    Among several epochs, the one with the best test score is partly the luckiest
    on that test set, so its reported score includes that luck and overstates performance
    on new data. Choose the epoch on validation, then report test once.'
  8-1:
  - The recall on fraud (and the precision, or the F1 score for the fraud class).
    A model that labels every transaction "not fraud" already scores 0.995 accuracy,
    so accuracy says nothing about whether the model catches any fraud at all. Compare
    with that majority-class baseline too.
  9-1:
  - 'Head truncation, because the request comes first and the tail is signature and
    quoted history. Confirm it as in Section 9: run the options (head, tail, head+tail)
    on the same validation emails, compare accuracy with a sign test, and choose on
    validation, not on intuition alone.'
