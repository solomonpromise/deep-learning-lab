docstrings:
  benchmark_clock: Read elapsed time after synchronising any queued CUDA work.
  ordered_fingerprint: "Hash ordered text/label pairs to verify alignment for paired\
    \ comparisons.\n\nArguments:\n    texts: Text strings in the order expected by\
    \ the caller.\n    labels: Integer targets aligned with the input examples."
  normalise: "Normalise case, punctuation and spacing for a duplicate audit; this\
    \ is separate from the exact-dedup split policy.\n\nArguments:\n    t: One text\
    \ from the duplicate audit."
  load_imdb_split: "Load the declared IMDb revision, remove exact duplicates and construct\
    \ the seeded course splits.\n\nArguments:\n    seed: Seed controlling the local\
    \ split or sampling generator.\n    n_val: Number of training-half reviews reserved\
    \ for validation.\n    n_eval: Size of the reproducible evaluation subset.\n \
    \   verbose: Whether to print dataset audit counts."
  load_imdb_split.dedup: "Keep the first occurrence of each exact text not already\
    \ in the supplied seen set.\n\nArguments:\n    texts: Text strings in the order\
    \ expected by the caller.\n    labels: Integer targets aligned with the input\
    \ examples.\n    seen: Set of exact texts already retained."
  fingerprint: "Hash sorted texts to identify membership; this does not check row\
    \ order or labels.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller."
  encode: "Keep the requested head, tail or head-and-tail tokens, add special tokens\
    \ and pad the batch.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller.\n    max_length: Token budget including special tokens.\n   \
    \ strategy: Explicit head, tail or head-and-tail truncation policy."
  predict: "Run the declared model or service and return predictions in the original\
    \ example order.\n\nArguments:\n    texts: Text strings in the order expected\
    \ by the caller.\n    **kw: Explicit settings forwarded to the operation described\
    \ above."
  report: "Print accuracy, per-class recall and positive-class F1 for the declared\
    \ predictions.\n\nArguments:\n    name: Display label for the printed metric row.\n\
    \    y: Targets aligned with the examples.\n    p: Predicted binary classes."
  to_dataset: "Construct unpadded token-ID rows and integer labels for later dynamic\
    \ batching.\n\nArguments:\n    x: Input features or token IDs with the shape traced\
    \ at the call site.\n    y: Targets aligned with the examples."
