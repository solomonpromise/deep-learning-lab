quiz:
- q: What makes a dataset training-ready?
  options:
  - An explicit task, checked examples, honest splits and compatible preprocessing.
  - A large row count alone.
  - A public download link alone.
  answer: 0
  why: An explicit task, checked examples, honest splits and compatible preprocessing.
- q: What should remain consistent across model comparisons?
  options:
  - The declared data protocol and ordered evaluation examples.
  - Only total row counts.
  - Different test reviews for every model.
  answer: 0
  why: The declared data protocol and ordered evaluation examples.
- q: What does a padding collator do?
  options:
  - Pads examples into compatible batch shapes and supplies masks.
  - Creates new ground-truth labels.
  - Deduplicates the dataset automatically.
  answer: 0
  why: Pads examples into compatible batch shapes and supplies masks.
