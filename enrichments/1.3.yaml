  # ------------------------------------------------------------------ §3
  - section: 3
    after: "Here is the habit that saves the most debugging time"
    type: widget
    name: tensor-shapes
    title: "Shape playground: reshape, broadcast, multiply"
    props: { tabs: [reshape, broadcast, matmul], start: matmul }
    intro: |
      **Matrix multiply:** set the sizes so the inner dimensions disagree and read the error, then hover a result cell.
      **Broadcasting:** try A `(4,)` with B `(4,1)`, the silent bug behind many wrong losses. **Reshape:** the same numbers in a new shape.

  # ------------------------------------------------------------------ §4
  - section: 4
    after: "unsqueeze(1): (N,) -> (N, 1)"
    type: explainer
    style: plain
    title: "Why the labels get an extra axis"
    md: |
      The network has **one output neuron**, so for 750 examples it returns shape `(750, 1)`: a column. The labels arrive as `(750,)`: a flat vector.
      `unsqueeze(1)` inserts an axis at position 1, turning `(750,)` into `(750, 1)`, so predictions and labels line up element by element.
      (`BCEWithLogitsLoss` refuses mismatched shapes with a `ValueError`; some other losses silently *broadcast* them into a 750×750 matrix instead, which is worse.)

  # ------------------------------------------------------------------ §5
  - section: 5
    after: "Note the pattern: scale FIRST, then request gradients"
    type: explainer
    style: warning
    title: "Leaf tensors: why the order matters"
    md: |
      Autograd only fills `.grad` for **leaf tensors**: tensors you created directly with `requires_grad=True`.
      `torch.randn(2, 16, requires_grad=True) * 0.5` creates a leaf and then multiplies it, so the variable you keep is the *result* of an operation
      (a non-leaf), and its `.grad` stays `None`. Creating the tensor, scaling it, *then* calling `.requires_grad_(True)` makes the scaled tensor the leaf.
      `nn.Module` layers handle all of this for you, which is one more reason to use them.

  - section: 5
    after: "Three things `nn.Module` did without being asked"
    type: compare
    title: "Version A vs Version B"
    items:
      - title: "Raw tensors"
        tone: orange
        icon: alert
        md: "You create, initialise, move, pass to the optimiser and save **every** parameter by hand. Fine for 4 tensors; unmanageable for 400."
      - title: "nn.Module"
        tone: green
        icon: check
        md: "Declare layers as attributes. `model.parameters()`, `.to(device)`, `.state_dict()`, `.train()`/`.eval()` all work on the whole tree automatically."

  # ------------------------------------------------------------------ §6
  - section: 6
    after: "That last line is a real diagnostic"
    type: explainer
    style: tip
    title: "The initial-loss sanity check, in numbers"
    md: |
      An untrained classifier should be about as unsure as random guessing, so its loss should start near $-\log(1/K)$ for $K$ classes:

      | Classes | Expected starting loss |
      |---|---|
      | 2 (binary) | $\ln 2 = 0.693$ |
      | 10 | $\ln 10 = 2.303$ |
      | 1000 | $\ln 1000 = 6.908$ |

      Starting far above this means the model is *confidently wrong* from the first step, which almost always indicates a bug.

  # ------------------------------------------------------------------ §7
  - section: 7
    after: "Proof that this is Note 1.2"
    type: explainer
    style: plain
    title: "What the optimizer holds on to"
    md: |
      `torch.optim.Adam(model.parameters(), lr=0.01)` receives **references** to the model's actual parameter tensors, not copies.
      `optimizer.step()` updates those tensors *in place*, so the model changes. Adam also keeps two extra numbers per parameter (running averages of the gradient and of its square),
      which is why an Adam optimizer has **state** worth saving in a checkpoint (Section 12).

  # ------------------------------------------------------------------ §8
  - section: 8
    after: "8668abc4"
    type: widget
    name: training-loop
    title: "Run the six lines one at a time"
    intro: |
      A tiny model, $\hat y = w x + b$, trained with exactly these six lines. Step through them and watch each one act on the parameters and their `.grad`.
      Then switch to **Bug: delete zero_grad()** and auto-play: gradients pile up in `.grad` and the fit swings back and forth, never settling.

