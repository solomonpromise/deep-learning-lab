# Teaching layer for Lesson 1.3 — Your First PyTorch Network

summary: |
  Everything you did by hand in Lesson 1.2, now in idiomatic PyTorch: **tensors** (shape, dtype, device),
  a model as an **`nn.Module`**, a numerically stable **loss on logits**, an **optimizer**, and the **six-line training loop**.
  You train it on the spirals, read its loss curve, save and reload it, and then break it three quiet ways.
  None of them raises an error; learning to spot them is the real skill.

inserts:
  # ------------------------------------------------------------------ §1
  - section: 1
    after: "6ef75600"
    type: widget
    name: tensor-shapes
    title: "Tensor ranks, reshapes and broadcasting: see them"
    props: { start: rank }
    intro: "Start on **Ranks** to connect each shape to what it means in deep learning. The other tabs are used in Section 3."

  - section: 1
    after: "c = torch.tensor(np.array([1.0, 2.0]))"
    type: explainer
    style: warning
    title: "The float64 trap, and why it matters"
    md: |
      NumPy defaults to **float64**, and `torch.tensor(numpy_array)` keeps that dtype. Your model's weights are **float32**, so the first
      matrix multiply fails with a dtype-mismatch error, or everything silently runs at half speed and double memory.
      **Habit:** convert with `dtype=torch.float32` at the moment data enters PyTorch (as Section 4 does), and use `torch.long` for class labels.

