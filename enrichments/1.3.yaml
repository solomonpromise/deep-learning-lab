  - section: 2
    after: "Write the detection once, at the top of every notebook"
    type: compare
    title: "Three places a tensor can live"
    items:
      - { title: "cuda", tone: green, icon: rocket, md: "NVIDIA GPUs: Colab, Kaggle, most servers. Everything runs here, including CUDA-only libraries (bitsandbytes, vLLM, flash-attn)." }
