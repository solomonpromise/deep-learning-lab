docstrings:
  encode_chars: "Map known characters to integer IDs using the fitted character vocabulary.\n\
    \nArguments:\n    s: Text string to encode or split."
  decode_chars: "Reconstruct text from character-vocabulary IDs.\n\nArguments:\n \
    \   ids: Integer token IDs, usually shaped (batch, tokens)."
  split_words: "Split into words, individual punctuation marks and whitespace, preserving\
    \ reconstructable text.\n\nArguments:\n    s: Text string to encode or split."
  count_pairs: "Count adjacent token pairs, weighting each word by its corpus frequency.\n\
    \nArguments:\n    vocab: Word-piece tuples mapped to corpus frequencies."
  apply_merge: "Merge non-overlapping occurrences of one adjacent pair in a token\
    \ sequence.\n\nArguments:\n    word: Vocabulary word, or tuple of BPE pieces in\
    \ the merge helpers.\n    pair: The adjacent token pair to merge."
  encode_bpe_word: "Apply the learned BPE merges in order to a word and cache its\
    \ pieces.\n\nArguments:\n    word: Vocabulary word, or tuple of BPE pieces in\
    \ the merge helpers.\n    cache: Dictionary memoising a word's pieces for the\
    \ current learned merges."
  encode_bpe: "Split text and concatenate each piece's BPE encoding.\n\nArguments:\n\
    \    s: Text string to encode or split."
  get_batch: "Sample input windows and their one-position-shifted targets; return\
    \ two integer tensors.\n\nArguments:\n    data: One-dimensional integer corpus\
    \ tensor.\n    batch_size: Number of windows sampled per batch.\n    context:\
    \ Maximum input-window length in tokens.\n    generator: Seeded generator for\
    \ sampling."
quiz:
- q: Why split continuous text before sampling training windows?
  options:
  - It prevents overlapping windows from crossing the train-validation boundary.
  - It guarantees validation loss will equal training loss.
  - It removes the need for a causal mask.
  answer: 0
  why: It prevents overlapping windows from crossing the train-validation boundary.
- q: Which model components grow with vocabulary size?
  options:
  - The token embedding table and vocabulary output head.
  - Only the number of Transformer blocks.
  - Only the context window.
  answer: 0
  why: The token embedding table and vocabulary output head.
- q: How should next-token targets align with inputs?
  options:
  - Target at position t is the token following input at t.
  - Targets should equal inputs at the same positions.
  - Targets should be the preceding tokens.
  answer: 0
  why: Target at position t is the token following input at t.
