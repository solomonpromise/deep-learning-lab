summary: How does raw text become the input tensors a Transformer learns from?
answers:
  2-1:
  - A BPE tokeniser starts every word from single characters and only then applies
    merges, so any word made of known characters can be encoded, at worst one character
    at a time. A word-level tokeniser only knows whole words it saw in training, so
    a new word has no entry at all.
  3-1:
  - The token embedding table and the output head. Both have one row (or one output)
    per vocabulary entry, so going from 65 to 12,571 entries would multiply their
    size by almost 200. With `d_model = 64`, the embedding table alone would grow
    from 4,160 to 804,544 parameters.
  4-1:
  - It is invisible. The model only receives the 64 most recent characters, so anything
    earlier cannot influence the prediction at all, however important it was.
  5-1:
  - 32 × 64 = 2,048. Every position in every window is a separate next-token prediction.
