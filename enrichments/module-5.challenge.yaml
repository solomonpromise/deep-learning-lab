title: 'Module 5 challenge: Learning Representations from Images and Text'
pass_mark: 0.75
questions:
- q: What does a representation describe?
  options:
  - An example in features useful for a task.
  - Only the example's class name.
  - The optimizer's learning rate.
  answer: 0
  why: An example in features useful for a task. Reread Lesson 5.1, section 1.
- q: What is shared when a convolution filter moves?
  options:
  - Its weights are reused at different spatial positions.
  - All feature-map values become identical.
  - Each position receives an unrelated filter.
  answer: 0
  why: Its weights are reused at different spatial positions. Reread Lesson 5.2, section
    1.
- q: Which step makes token vectors learn useful task information?
  options:
  - Training the embedding parameters through an objective.
  - Assigning larger IDs to important words.
  - Alphabetically sorting the reviews.
  answer: 0
  why: Training the embedding parameters through an objective. Reread Lesson 5.3,
    section 1.
- q: Why do averaged word embeddings fail on reversed word order?
  options:
  - Averaging the same vectors gives the same result regardless of order.
  - The embedding vocabulary has no integers.
  - Reversing tokens changes every vector's length.
  answer: 0
  why: Averaging the same vectors gives the same result regardless of order. Reread
    Lesson 5.4, section 1.
- q: Do independently trained image and text vectors align merely because their widths
    match?
  options:
  - No; equal width permits arithmetic but does not establish alignment.
  - Yes; matching width guarantees shared semantics.
  - Yes; normalising alone learns image-caption matches.
  answer: 0
  why: No; equal width permits arithmetic but does not establish alignment. Reread
    Lesson 5.5, section 1.
- q: Why use the same downstream probe family across representations?
  options:
  - It helps compare how accessible task information is in each representation.
  - It guarantees every encoder has equal training cost.
  - It proves one representation is best for all tasks.
  answer: 0
  why: It helps compare how accessible task information is in each representation.
    Reread Lesson 5.6, section 1.
- q: Why split a network into an encoder and a head?
  options:
  - The encoder builds features and the head maps them to task outputs.
  - Only the head receives gradients.
  - The encoder always needs fewer layers than the head.
  answer: 0
  why: The encoder builds features and the head maps them to task outputs. Reread
    Lesson 5.1, section 2.
- q: What is the PyTorch shape for 16 RGB images of size 224 by 224?
  options:
  - (16, 3, 224, 224).
  - (16, 224, 224, 3).
  - (3, 224, 224, 16).
  answer: 0
  why: (16, 3, 224, 224). Reread Lesson 5.2, section 2.
