summary: How do we know whether adaptation worked, and how do we decide whether to
  keep an adapted model?
answers:
  3-1:
  - No. Overlapping 95% intervals are consistent with a real difference, because each
    interval reflects the uncertainty of one model on its own, ignoring that both
    were scored on the *same* reviews. A paired test, such as the sign test on the
    reviews where exactly one model is right, uses that pairing and can detect differences
    that overlapping intervals hide.
  5-1:
  - Choosing settings or checkpoints on validation picks whichever option was luckiest
    there, so part of the validation score is that luck, and it doesn't carry over
    to test. A small drop is therefore normal. A gap should worry you when it's much
    larger than the run-to-run variation you'd expect (here about two points), or
    when it's large for one method but not others evaluated the same way. That suggests
    the method was tuned to quirks of the validation set, or that something leaked.
  6-1:
  - It generalises far beyond what was tested. We fine-tuned one small model, on only
    1,000 labels, for one epoch, with 128 tokens of each review and untuned learning
    rates, on a CPU. The comparison showed that, *in this setup*, fine-tuning didn't
    beat a model already fine-tuned on much more sentiment data, or TF-IDF with all
    labels. With more labels, longer inputs or a better-tuned recipe, the result could
    change. The correct conclusion is limited to the conditions tested, which is exactly
    what the decision record's limitations say.
