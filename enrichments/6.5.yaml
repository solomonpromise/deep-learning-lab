summary: How do the components assemble into a complete language model, and how do
  we know it is built correctly?
answers:
  3-1:
  - Yes. A loss of 10.8 is almost exactly ln(50,000) ≈ 10.82, the loss of a uniform
    guess, which is what an untrained model should produce. A value far higher, say
    30, would suggest a problem.
  4-1:
  - 'Possible causes include: the targets are not aligned with the inputs (for example,
    not shifted, or shifted the wrong way); gradients are not reaching the parameters
    (for example, `optimizer.zero_grad()`, `loss.backward()` or `optimizer.step()`
    is missing, or the optimizer was given the wrong parameters); the learning rate
    is far too high or too low; or the model has collapsed to predicting character
    frequencies, which is what a loss of about 3.3 suggests on this dataset.'
  5-1:
  - During translation, the entire source sentence is available from the start, so
    letting every target token see all of it is legitimate. The decoder's self-attention
    looks at the target sequence itself, which is being generated one token at a time;
    during training, a target token must not see the target tokens after it, or it
    could simply read the answer.
