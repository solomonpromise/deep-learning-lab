quiz:
- q: What completes the language model after the stack of pre-norm blocks?
  options:
  - A final norm and a projection to vocabulary logits.
  - A label lookup that bypasses the blocks.
  - A new tokenizer learned during each forward pass.
  answer: 0
  why: A final norm and a projection to vocabulary logits.
- q: Why is log(vocabulary size) a useful initial-loss reference?
  options:
  - It is the cross-entropy of uniform predictions, a diagnostic rather than an exact
    requirement.
  - Every random initialisation must produce exactly that loss.
  - It is the minimum possible training loss.
  answer: 0
  why: It is the cross-entropy of uniform predictions, a diagnostic rather than an
    exact requirement.
- q: Where do cross-attention keys and values come from in an encoder-decoder?
  options:
  - The encoded source sequence; queries come from the decoder.
  - Only future target tokens.
  - The optimizer's state dictionary.
  answer: 0
  why: The encoded source sequence; queries come from the decoder.
