summary: How can AI engineers leverage models that have already learned useful representations?
answers:
  1-1:
  - Because the reviews are balanced. The random model called almost every review
    negative (only 8.4% positive), and about half the reviews really are negative,
    so it is right on those almost by default. A model that knows nothing about sentiment
    lands near the share of the class it guesses, not near zero. That's why chance,
    not zero, is the baseline to beat.
  2-1:
  - No. Identical size only means identical architecture; the numbers inside can differ.
    To check, load both bodies and compare each tensor with the same name, for example
    with `torch.equal` or by measuring the size of their difference. Section 7 did
    this and found that every tensor had changed slightly.
  3-1:
  - 'Layer 0 is the input to the Transformer: each token''s vector is its row from
    the embedding table plus a position vector. No attention has happened yet, so
    no information from the other words has been mixed in. "Bank" therefore looks
    almost the same in every sentence, exactly like a static embedding. Context only
    enters through the attention layers.'
  4-1:
  - Essentially random. The MISSING note means the `classifier` layer was created
    with random weights, so even though the body produces good contextual vectors,
    the head turns them into labels by an untrained rule. The model must be fine-tuned
    on labelled examples of the tagging task before its labels mean anything.
  5-1:
  - The pretrained model, measured against a simple baseline. With a few hundred labels,
    the results here showed TF-IDF and a network trained from scratch to be weak and
    unstable (TF-IDF averaged 0.627 with 100 labels, and the from-scratch network
    managed 0.798 even with 1,000), while the pretrained model scored 0.874 with none.
    Use the 300 labels to *evaluate* the pretrained model (and, as Module 8 shows,
    possibly to adapt it). Emails are not film reviews, so measure before trusting
    it.
  6-1:
  - About 110 million × 4 bytes = 440 MB. At 16 bits (2 bytes) per number it would
    be about 220 MB. Note 7.6 explores what is lost and gained by storing numbers
    with fewer bits.
  7-1:
  - The model could have changed (someone pushed new weights or a new tokeniser to
    the repository), or the software could have changed (a new library version that
    processes text or computes results slightly differently). Pinning the model with
    `revision=` and its commit ID removes the first risk; pinning library versions
    in `requirements.txt` handles the second.
