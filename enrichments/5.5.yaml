summary: How can images and text be represented in a way that lets us compare them
  directly?
answers:
  2-1:
  - Comparing an image with a caption means computing a dot product (or cosine similarity)
    between their vectors, which is only defined for vectors of the same length. The
    projections are what translate both modalities into the same "coordinates".
  3-1:
  - It would go up. With 1,024 items and 10 classes, each batch would contain about
    ten times as many same-class items, so each image would have more indistinguishable
    "correct" captions to spread its probability over. The floor is roughly the logarithm
    of that number, so a larger batch means a higher floor. (Real systems like CLIP
    use very diverse captions, so true duplicates in a batch are rare, and large batches
    mainly help by providing more, and harder, negatives.)
  4-1:
  - 'Its image encoder learned general visual features of footwear, such as a low,
    wide outline with a sole, even without seeing sneakers. Sneaker images landed
    near sandal and ankle-boot images in the shared space. What was missing was the
    text side: the word "sneaker" had no learned meaning to match them to.'
  5-1:
  - Embedding an image requires running the image encoder, which is expensive. If
    we re-embedded millions of images for every query, each search would take far
    too long. By embedding the collection once and storing the vectors, each new query
    costs only one text embedding plus fast dot products, which can be done for millions
    of stored vectors very quickly.
