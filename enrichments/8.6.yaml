quiz:
- q: What is the conceptual change in instruction tuning?
  options:
  - Train on task-oriented conversations and desired responses.
  - Replace next-token loss with accuracy.
  - Stop using causal prediction.
  answer: 0
  why: Train on task-oriented conversations and desired responses.
- q: Why shift logits and targets by one?
  options:
  - Position t predicts the next token.
  - The model predicts the previous token.
  - Padding needs a different class label.
  answer: 0
  why: Position t predicts the next token.
- q: Does a weight subtotal guarantee a GPU training fit?
  options:
  - No; measure the complete workload and runtime allocations.
  - Yes, with a fixed twenty-percent margin.
  - Only parameter count matters.
  answer: 0
  why: No; measure the complete workload and runtime allocations.
