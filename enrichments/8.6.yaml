summary: How are large language models adapted to follow instructions, and what makes
  that practical on real hardware?
answers:
  5-1:
  - About 20 / 420, so under 5% of the loss would come from the answers (assuming
    similar per-token losses), and over 95% from predicting the prompts. The model
    would spend almost all of its learning on text it never needs to write. With masking,
    100% of the loss comes from the answers.
  6-1:
  - It's overcorrecting. Before SFT it always said "negative"; now it says "positive"
    much more often than the data warrants, so many of its errors are negative reviews
    called positive. It has learned the format and part of the task, but not a balanced
    decision. In a real run you'd use more (and balanced) training examples, check
    the answer distribution and accuracy on a validation set during training, tune
    the learning rate and number of steps on validation, and perhaps use a larger
    base model.
  8-1:
  - 'QLoRA is a reasonable candidate to benchmark because quantizing the frozen base
    can reduce storage substantially. The 15.23 GB bfloat16 base leaves insufficient
    room on a nominal 16 GB device for ordinary training allocations. The illustrative
    4.28 GB four-bit subtotal does not guarantee a fit: measure peak memory with the
    intended sequence length, batch size, adapters, optimizer and implementation.
    Try smaller batches, shorter inputs, checkpointing or a smaller model if necessary.
    Compare held-out quality against prompting before deciding that adaptation is
    worthwhile.'
