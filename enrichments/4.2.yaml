  # ------------------------------------------------------------------ §4
  - section: 4
    after: "And the comparison from Section 1 is now concrete"
    type: explainer
    style: warning
    title: "Where the earlier Bank Marketing numbers really come from"
    md: |
      The recipes differ even more than the text says, and two of its figures do not match the current versions of those lessons:

      | Lesson | Split | Optimizer, epochs | Validation ROC-AUC |
      |---|---|---|---|
      | 2.3 / 2.4 | 70 / 15 / 15 | Adam, early stopping (epoch 11) | 0.7982 |
      | 3.1 | 80 / 20 | Adam, 15 epochs (final) | 0.7939 |
      | 3.4, Case 6 without `duration` | 80 / 10 / 10 | AdamW, 15 epochs | 0.7853 |
      | this lesson | 80 / 10 / 10 | AdamW, best of 30 epochs (epoch 18) | 0.7871 |

      The "0.7965" quoted for Module 2 and Lesson 3.1 appears in neither notebook today, and Lesson 3.4's run cannot show 0.7871: it stops
      after 15 epochs, before this run's best epoch. None of this weakens the point; it makes it. Four recipes, four numbers, and only the
      table tells you why.

  # ------------------------------------------------------------------ §5
  - section: 5
    after: "That is the good outcome: it fails immediately and loudly"
    type: explainer
    style: tip
    title: "Why YAML reads `3e-4` as text"
    md: |
      PyYAML follows YAML 1.1, whose rule for floats requires a decimal point (`3.0e-4`) or a plain decimal (`0.0003`). `3e-4` matches no
      number rule, so it falls through to a string. YAML 1.2 parsers (for example `ruamel.yaml`) read it as a float, which is exactly why the
      same file can behave differently in two tools. Converting on load (`float(settings["lr"])`) or validating the settings before a run
      removes the trap for good.

