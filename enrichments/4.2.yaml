# Teaching layer for Lesson 4.2 — Experiments You Can Reproduce
# The notebook is the author's current version (not locked). Its two IMAGE placeholders are hidden by the build and
# replaced here by SVG figures; a third figure plots the lesson's measured seed and split noise.

summary: |
  If you report a number today, can anybody get it again tomorrow? You separate three meanings of **reproducible** (repeatable,
  portable, robust), seed every generator a run touches and give the DataLoader its own, drive every run from one **settings**
  dictionary saved as YAML and fingerprinted with a **hash**, make each result record its own provenance (data fingerprint, commit,
  software versions), and build a **checkpoint** that resumes a run without changing a single weight. Then the number that matters most:
  changing only the seed moves test AUC by 0.001, changing only the split moves it by 0.013. Records answer five fixed questions, and
  MLflow stores them without making them true.

