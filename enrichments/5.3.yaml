summary: How can a network turn words, which are just symbols, into numbers that capture
  meaning?
answers:
  2-1:
  - 'The sum of code points depends only on spelling, and different words can share
    the same sum: "dog" and "god" have identical letters, so identical sums, but very
    different meanings. And words with similar meanings ("good", "great") would get
    unrelated sums. The number would carry no information about meaning.'
  3-1:
  - The vocabulary was chosen using the *training* reviews. Words that are common
    in training are, by construction, in the vocabulary; the validation reviews contain
    some words that were rare or absent in training (new names, rare words, typos),
    so slightly more of their tokens fall outside the vocabulary. This is a small,
    honest example of the gap between training data and new data.
  4-1:
  - Each one-hot vector would grow to about 20,000 entries (plus the special tokens).
    The similarity between "good" and "great" would still be exactly 0, as for any
    two different words. More words make one-hot vectors more wasteful, not more meaningful.
  6-1:
  - 50,000 × 512 = 25,600,000 parameters.
  7-1:
  - Yes. Cosine similarity ignores length and looks only at direction. A cosine of
    0.98 means the vectors point in almost the same direction, so they count as very
    similar, regardless of one being longer.
  8-1:
  - 'The average of the static vectors for "not", "good", "at" and "all" contains
    the strongly positive vector for "good". Averaging cannot express that "not" reverses
    the meaning of "good", so the review may be scored as positive. We measured exactly
    this: "the movie was not good" was still scored 0.569 positive.'
  9-1:
  - Skip-gram places "excellent" and "awful" relatively close together (average opposite-pair
    cosine 0.495, above the random baseline of 0.408), because they appear in similar
    contexts. A sentiment classifier built on these vectors would start from a representation
    in which positive and negative words are hard to tell apart, so it would need
    to learn that distinction from labelled data. Embeddings from one objective are
    not automatically right for a different task.
