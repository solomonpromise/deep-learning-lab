docstrings:
  tokenize: "Lowercase, remove the stated HTML breaks and extract letter/apostrophe\
    \ tokens.\n\nArguments:\n    text: Input text string."
  encode: "Map tokens through the training vocabulary, using the unknown-token policy\
    \ defined above.\n\nArguments:\n    tokens: Ordered token strings to encode."
  one_hot: "Return the vocabulary-length indicator vector for a known word.\n\nArguments:\n\
    \    word: Vocabulary word, or tuple of BPE pieces in the merge helpers."
  cosine: "Return the cosine similarity of two nonzero vectors: their dot product\
    \ divided by their norms.\n\nArguments:\n    a: First vector.\n    b: Second vector."
  vec: "Select a known word's row from an embedding table.\n\nArguments:\n    table:\
    \ Embedding weight matrix indexed by vocabulary ID.\n    w: Weight tensor or selected\
    \ vocabulary word, as defined in this helper."
  to_tensor: "Truncate to MAX_LEN and pad shorter token lists with PAD; return an\
    \ integer batch.\n\nArguments:\n    token_lists: A list of variable-length token\
    \ sequences."
  BagOfEmbeddings: Masked-mean word embeddings followed by a binary sentiment-logit
    head.
  BagOfEmbeddings.__init__: "Create the components of this model; the forward computation\
    \ is traced in the lesson.\n\nArguments:\n    vocab_size: Number of token IDs\
    \ represented by the embedding table.\n    dim: Learned vector width."
  BagOfEmbeddings.forward: "Masked-mean word embeddings followed by a binary sentiment-logit\
    \ head.\n\nArguments:\n    x: Integer token-ID batch shaped (B, T)."
  neighbours: "Rank other vocabulary entries by cosine similarity to a word's embedding.\n\
    \nArguments:\n    table: Embedding weight matrix indexed by vocabulary ID.\n \
    \   word: Vocabulary word, or tuple of BPE pieces in the merge helpers.\n    k:\
    \ Number of neighbours, or unit index in unit_summary."
quiz:
- q: Which step makes token vectors learn useful task information?
  options:
  - Training the embedding parameters through an objective.
  - Assigning larger IDs to important words.
  - Alphabetically sorting the reviews.
  answer: 0
  why: Training the embedding parameters through an objective.
- q: Why does embedding lookup equal one-hot times a table?
  options:
  - The one nonzero entry selects the corresponding table row.
  - Both operations average every vocabulary row.
  - The table is fixed and cannot learn.
  answer: 0
  why: The one nonzero entry selects the corresponding table row.
- q: What does the sentiment versus skip-gram comparison demonstrate?
  options:
  - Different training objectives and setups can produce different useful geometries.
  - The objective is the only differing factor in these experiments.
  - Context-trained vectors must separate positive and negative words.
  answer: 0
  why: Different training objectives and setups can produce different useful geometries.
