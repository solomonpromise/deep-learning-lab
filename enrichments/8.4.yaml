summary: What exactly happens when we fine-tune a pretrained model, and how do we
  do it reliably?
answers:
  6-1:
  - At the start, the head's weights are random, so its outputs are meaningless and
    the gradients flowing back from it can be large and erratic. With a full learning
    rate from step one, those erratic gradients would push the carefully pretrained
    body around before the head has learned anything sensible. Warmup keeps the early
    steps tiny, so the head can settle first, then lets the learning rate rise once
    the gradients carry real information.
  8-1:
  - 'Choosing among checkpoints is a form of tuning: the chosen one is partly the
    luckiest on the data used to choose. If that data were the test set, the test
    score would include that luck and overstate how the model will do on new reviews.
    Choosing on validation keeps the test set untouched, so its single score stays
    an honest estimate.'
  9-1:
  - Because 0.006 on 1,000 reviews is six reviews, easily within the variation you'd
    see from a different test sample or a different training run. The paired sign
    test on the same reviews showed 105 reviews where only fine-tuning was right and
    99 where only TF-IDF was right (p = 0.73), so there's no evidence of a real difference.
    Quote differences together with a test like this, not on their own.
