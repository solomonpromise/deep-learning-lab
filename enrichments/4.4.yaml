# Teaching layer for Lesson 4.4 — The Bake-Off: Gradient Boosting against a Neural Network
# The notebook is the author's current version (not locked). Its two IMAGE placeholders are hidden by the build and
# replaced here by SVG figures drawn from the lesson's own measurements. The statistics in the Section 5 note were
# computed from the ten-split table as printed (four decimals).

summary: |
  Which of two models would you ship, and could you defend the choice to someone who disagrees? You write the rules before the
  first result, then run the Day 3 network, frozen, against gradient boosting on **identical rows** across ten splits. Each
  model on its own looks inconclusive; **paired**, boosting is ahead on all ten splits by a small, consistent 0.008 AUC. A
  twelve-setting search turns out to add nothing but luck. The cost column shows boosting training fourteen times faster while
  the network predicts faster from a far smaller file. Under the chronological split the **ranking reverses** and both models
  lose most of their skill. It all ends in a written decision memo.

inserts:
  # ------------------------------------------------------------------ §2
  - section: 2
    after: "and it is the single most useful trick in this note"
    type: explainer
    style: math
    title: "Why subtraction removes the shared part"
    md: |
      For any two scores measured on the same splits,

      $$\operatorname{sd}(B-A)^2 = \operatorname{sd}(A)^2 + \operatorname{sd}(B)^2 - 2\,\operatorname{cov}(A,B).$$

      The shared difficulty appears in both scores, so it appears in the covariance too, and the subtraction removes it. In the
      simulation above, each score is *difficulty + own wobble*, so the difference keeps only the two wobbles:
      $\sqrt{2}\times0.002\approx0.003$ on average (this draw gave 0.0021), however large the shared part is. On the real splits
      in Section 5 the two models' scores correlate at **0.94**, which is why spreads of 0.0132 and 0.0111 shrink to 0.0047 for
      their difference.

  - section: 2
    after: "and it is the single most useful trick in this note"
    type: widget
    name: paired-lab
    title: "Paired or not: the same numbers, read two ways"
    intro: |
      Each split has a difficulty both models feel, plus a wobble of each model's own; B is truly better by the gap. Read the
      verdicts, then slide **shared split difficulty** to zero: pairing has nothing left to cancel. Set the **true gap** to zero
      and press *New splits* a few times to see how often luck looks like a finding. *The lesson's ten splits* loads the real
      network (A) and boosting (B) scores from Section 5.

