  - section: 5
    after: "as long as you measure it in a way that cancels the noise"
    type: explainer
    style: deep
    title: "How sure, in numbers, and a catch about repeated splits"
    md: |
      The usual tests agree with the reading above:

      | | paired t-test | corrected for overlapping splits | sign test |
      |---|---|---|---|
      | boosting minus network | t = 5.3, p = 0.0005 | t = 3.5, p = 0.006; 95% interval **+0.003 to +0.013** | 10 of 10, p = 0.002 |
      | tuned minus default | t = 1.5, p = 0.17 | t = 1.0, p = 0.35; 95% interval −0.002 to +0.004 | 5 of 10, p = 1.0 |

      The catch: ten random splits of one file are not ten independent experiments. Any two share most of their training rows,
      so their results are correlated, and a plain t-test is too confident. Nadeau and Bengio (2003) proposed a simple fix:
      multiply the variance by $1/k + n_\text{test}/n_\text{train}$ instead of $1/k$ (here $0.1 + 0.125$). After it, boosting's
      advantage is still clearly real and the tuning gain still is not.

      The fix also shows where more splits stop helping: the $n_\text{test}/n_\text{train}$ term does not shrink with $k$, so
      going from 10 splits to 30 narrows this interval by only about 16%, not the 42% that the square-root rule suggests.

  # ------------------------------------------------------------------ §6
  - section: 6
    after: "Before spending it, check whether the space you are searching is wider than your noise"
    type: explainer
    style: warning
    title: "Which noise to hold a search against"
    md: |
      The conclusion is right, and the ten-split paired check above is the evidence for it. The yardstick in the text is not.
      The twelve settings were all scored on the **same** validation rows, so, exactly as in Section 5, the split's difficulty is
      shared and cancels when you compare them. Setting a spread of 0.0068 against the split-to-split noise of a *single score*
      (0.0130) repeats the mistake Section 2 warned about: by that yardstick the real 0.0078 advantage of boosting would have
      been dismissed too.

      The right yardstick is the noise of a *difference* between two settings on one split, and the lesson measured it: tuned
      minus default varies with a standard deviation of about **0.0024** from split to split. Against that, the search spread of
      0.0068 is not small. The trap is subtler: picking the best of twelve noisy differences picks the luckiest one. If the
      settings were all equally good, the best of twelve would beat the default by about one and a half standard deviations of
      pure luck, roughly 0.004 (somewhat less, since neighbouring settings behave alike), and the winner's 0.0050 lead on
      validation is about that size. The only way to tell a real gain
      from that selection effect is the check the lesson ran next: carry the winner to new splits and compare paired.

  # ------------------------------------------------------------------ §8
  - section: 8
    after: "That is a pattern worth carrying forward, not a fact about these two libraries"
    type: explainer
    style: warning
    title: "Before crediting smoothness: which model saw the later rows?"
    md: |
      That explanation may be right, but the experiment has an asymmetry that could produce the same result. Under the
      chronological split the **validation rows** are the 80–90% slice of the file: later than every training row, and right next
      to the test period.

      - The **network** uses them. `run_neural_network` keeps the epoch with the best validation AUC, which is how it ended at
        epoch 2.
      - **Boosting** does not. Its early stopping (`early_stopping="auto"`) holds out a random 10% of its *training* rows, all
        from the earliest period; the validation rows are only scored.

      So one model was tuned, lightly, on rows from the later period and the other was not. A fair version gives both the same
      information, for example by choosing boosting's number of trees on the same validation rows:

      ```python
      check = run_gradient_boosting({"name": "chrono_trees_on_val", "split": "chronological",
                                     "early_stopping": False, "max_iter": 300}, quiet=True, save=False)
      trees_model, chrono = check["artifacts"]["model"], check["artifacts"]["split"]
      val_auc_by_trees = [roc_auc_score(y[chrono["val"]], p[:, 1])
                          for p in trees_model.staged_predict_proba(X_trees.iloc[chrono["val"]])]
      best_trees = int(np.argmax(val_auc_by_trees)) + 1
      test_by_trees = list(trees_model.staged_predict_proba(X_trees.iloc[chrono["test"]]))
      print(f"trees chosen on the chronological validation rows: {best_trees}")
      print(f"chronological test AUC at that size: {roc_auc_score(y[chrono['test']], test_by_trees[best_trees - 1][:, 1]):.4f}")
      ```

      The other direction works too: choose the network's epoch on a random slice of its own training rows. Only if the reversal
      survives is it evidence about flexibility.

  - section: 8
    after: "and it is bigger than the choice of model"
    type: figure
    svg: |
