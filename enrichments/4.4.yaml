yle="fill:var(--ink-3);font-size:10.5px;font-weight:600">a random customer, 2008 to 2010</text><line x1="510" y1="76.0" x2="510" y2="356.0" style="stroke:var(--ink-2);stroke-width:1.5"/><text x="510" y="50" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:800">chronological split</text><text x="510" y="66" text-anchor="middle" style="fill:var(--ink-3);font-size:10.5px;font-weight:600">the last 10% of the file, in time</text><line x1="250" y1="113.3" x2="510" y2="288.7" style="stroke:var(--c1);stroke-width:3"/><circle cx="250" cy="113.3" r="5.5" style="fill:var(--c1)"/><circle cx="510" cy="288.7" r="5.5" style="fill:var(--c1)"/><text x="238" y="106.28" text-anchor="end" style="fill:var(--c1);font-size:12px;font-weight:800">gradient boosting 0.8034</text><text x="522" y="292.72" text-anchor="start" style="fill:var(--c1);font-size:12px;font-weight:800">0.5841 gradient boosting</text><line x1="250" y1="119.5" x2="510" y2="264.7" style="stroke:var(--c0);stroke-width:3"/><circle cx="250" cy="119.5" r="5.5" style="fill:var(--c0)"/><circle cx="510" cy="264.7" r="5.5" style="fill:var(--c0)"/><text x="238" y="134.52" text-anchor="end" style="fill:var(--c0);font-size:12px;font-weight:800">neural network 0.7956</text><text x="522" y="268.72" text-anchor="start" style="fill:var(--c0);font-size:12px;font-weight:800">0.6141 neural network</text><text x="360" y="384" text-anchor="middle" style="fill:var(--ink-2);font-size:11.5px;font-weight:700">chronological: network ahead by 0.030, 95% bootstrap interval +0.017 to +0.044</text></svg>
    caption: "Stratified values are the ten-split averages; chronological values are the single later-period test set. The lines cross, and both end close to guessing."

  # ------------------------------------------------------------------ §9
  - section: 9
    after: "Boosting is ahead on three of the four"
    type: explainer
    style: deep
    title: "How much of a slice table is noise?"
    md: |
      Every number in the slice table comes from one split, and some slices have few positives: 206 in *contacted in an earlier
      campaign*, 323 in *never contacted before*, 475 in *contact type known*, and only **54** in *contact type unknown*. By the
      Hanley–McNeil approximation, a single AUC measured on those rows has a standard error of about 0.017, 0.016, 0.013 and
      **0.041**. That is as large as most of the differences in the last column.

      The difference between two models on the same rows is less noisy than either AUC, because their errors are correlated, but
      only resampling says by how much. Run Section 8's paired bootstrap inside each slice, or repeat the slice table on the ten
      splits of Section 5. The reading that survives either check is the big one: both models are far weaker on *contact type
      unknown* (about 0.62, against 0.75 to 0.86 elsewhere). Which model leads inside a slice is much less certain.

  # ------------------------------------------------------------------ §10
  - section: 10
    before: "And the records, in the five-question format from Note 4.2"
    type: explainer
    style: tip
    title: "The memo points at a file that is never written"
    md: |
      Its last line says the chronological bootstrap interval "is in results/", but no cell saves it: Section 8 only prints it. A
      memo's evidence belongs in the memo. Replacing the bullet's last line with

      ```python
        with a bootstrap interval from {low:+.4f} to {high:+.4f} (network minus boosting,
        {len(differences)} resamples of the test rows). Neither is calibrated for the later period.
      ```

      puts the numbers where the reader is, and the Limitations line can then say what that interval does not cover: training
      randomness, and rows that are not independent (Section 8's questions).

  # ------------------------------------------------------------------ added: predict the bake-off
  - section: 1
    at: end
    type: widget
    name: predict-rounds
    title: "Before any result: predict the bake-off"
    intro: |
      The rules are written. Now commit to what you think will happen, round by round, before the lesson shows you. Each answer reveals the
      real number from the sections below.
    props:
      key: predict-bakeoff
      title_done: "Now read the sections to see how each number was measured."
      rounds:
        - q: "Split 42, test ROC-AUC: gradient boosting with default settings against the frozen Module 3 network. Who wins, and by how much?"
          options: ["The network, by more than 0.01", "A tie: less than 0.005 apart", "Boosting, by 0.01 to 0.02", "Boosting, by more than 0.05"]
          answer: 2
          reveal: "Boosting 0.8160 against 0.8016, untuned, trained in under a second, on the raw columns."
          bars: [["Gradient boosting", 0.8160], ["Neural network", 0.8016]]
          lo: 0.75
          hi: 0.85
          digits: 4
        - q: "Ten splits, both models on identical rows. On how many does boosting win?"
          options: ["3 of 10", "5 of 10", "7 of 10", "10 of 10"]
          answer: 3
          reveal: "All ten. Each model's own spread (0.013) is larger than the gap between their averages (0.0078), but paired split by split the difference is +0.0078 ± 0.0047."
        - q: "The best of twelve boosting settings (chosen on split 42's validation rows) against the defaults, over ten splits. The tuning gains…"
          options: ["About +0.01, clearly better", "About +0.005, better on 8 of 10", "+0.0012 ± 0.0024, better on 5 of 10", "It is worse on every split"]
          answer: 2
          reveal: "A coin toss. The whole search spanned 0.0068 on validation, narrower than the 0.013 split noise, so ranking inside it mostly ranked luck."
        - q: "Bare training time on the same machine: the network's 30 epochs against boosting's fit. Boosting is…"
          options: ["About as fast", "3 times faster", "About 14 times faster", "100 times faster"]
          answer: 2
          reveal: "6.80 s against 0.49 s, about 14×, with no epochs or learning rate to choose."
          bars: [["Neural network (s)", 6.80, "6.80 s"], ["Gradient boosting (s)", 0.49, "0.49 s"]]
          lo: 0
          hi: 7.5
        - q: "Predicting 1,000 raw rows, preprocessing included. Which is faster?"
          options: ["Boosting, about 2× faster", "The network, about 2× faster", "Exactly the same", "Boosting, 10× faster"]
          answer: 1
          reveal: "The network: 6.1 ms against 13.4 ms, and 28 KB against 344 KB to ship. A few small matrix multiplications beat walking dozens of trees."
          bars: [["Neural network (ms)", 6.1, "6.1 ms"], ["Gradient boosting (ms)", 13.4, "13.4 ms"]]
          lo: 0
          hi: 15
        - q: "Now the deployment question: train on the earliest 80% of the file, test on the last 10%. Which model wins?"
          options: ["Boosting again, by about 0.01", "The network, by about 0.03", "Both stay near 0.80", "Both fall below 0.5"]
          answer: 1
          reveal: "The ranking reverses: network 0.6141, boosting 0.5841, and a bootstrap puts the gap between +0.017 and +0.044. Both lose most of their skill: the shift matters more than the model."
          bars: [["Neural network", 0.6141], ["Gradient boosting", 0.5841]]
          lo: 0.5
          hi: 0.85
          digits: 4
        - q: "Averaging the two models' predictions on split 42 gives a test AUC of…"
          options: ["About 0.83: a clear gain", "0.8163: about the same as boosting alone", "About 0.80: worse than boosting", "About 0.78"]
          answer: 1
          reveal: "0.8163 against 0.8160. They rank customers similarly (Spearman 0.87), so the ensemble buys nothing worth shipping two models for."

  # ------------------------------------------------------------------ added: code exercise
  - section: 5
    at: end
    type: exercise
    title: "Summarise a paired comparison"
    prompt: |
      The lists hold test AUC for ten splits, both models on identical rows. Return the mean and standard deviation (with `ddof=1`) of the
      **split-by-split** difference `b − a`, and the number of splits where `b` wins.
    starter: |
      import numpy as np

      network  = np.array([0.7776, 0.8098, 0.7902, 0.7811, 0.8040, 0.7964, 0.7757, 0.8120, 0.8055, 0.8037])
      boosting = network + np.array([0.0127, 0.0076, 0.0073, 0.0141, 0.0076, 0.0017, 0.0020, 0.0135, 0.0026, 0.0089])

      def paired_summary(a, b):
          d = ___
          return d.mean(), ___, int(___)

      print(paired_summary(network, boosting))
    check: |
      mean, sd, wins = paired_summary(network, boosting)
      assert np.isclose(mean, 0.0078, atol=5e-5), f"Mean paired difference should be ≈ +0.0078, got {mean:.4f}"
      assert np.isclose(sd, 0.0047, atol=5e-5), f"Its standard deviation (ddof=1) should be ≈ 0.0047, got {sd:.4f}: did you use ddof=1?"
      assert wins == 10, f"Boosting wins all ten splits; got {wins}"
      assert np.std(network, ddof=1) > 2 * sd, "Sanity: each model's own spread is far larger than the spread of the difference"
    solution: |
      import numpy as np

      network  = np.array([0.7776, 0.8098, 0.7902, 0.7811, 0.8040, 0.7964, 0.7757, 0.8120, 0.8055, 0.8037])
      boosting = network + np.array([0.0127, 0.0076, 0.0073, 0.0141, 0.0076, 0.0017, 0.0020, 0.0135, 0.0026, 0.0089])

      def paired_summary(a, b):
          d = b - a
          return d.mean(), d.std(ddof=1), int((d > 0).sum())

      print(paired_summary(network, boosting))
    hints:
      - "Subtract split by split: `b - a`."
      - "`d.std(ddof=1)` is the sample standard deviation; `(d > 0).sum()` counts the wins."
    success: "+0.0078 ± 0.0047 and 10 of 10: small, consistent and real, although each model alone wobbles by 0.013."

answers:
  "1-1":
    - |
      Because the danger is not a small budget but a flexible one. If the budget is settled after seeing results, every extra
      adjustment is chosen by looking at the scores, so the comparison ends up measuring how much attention each side got, and
      any win partly reflects how many tries it took (the more you try, the more luck you collect). A budget written down in
      advance, even a small one, can be checked by a reader; a large one decided afterwards cannot. It also forces you either to
      give both sides the same budget or to state the imbalance, as Section 1 does.
    - |
      **Pairing.** When both models are scored on the same test rows, the part of each score that comes from how hard those rows
      were is shared, and subtracting cancels it. Here that shared part is most of the variation: across the ten splits the two
      models' scores correlate at 0.94, so their difference varies about three times less than either score (0.0047 against
      0.0132).
  "5-1":
    - |
      Because most of each model's variation is not about the model; it is about the split. A test set full of easy customers
      lifts both scores, a hard one lowers both. That shared movement is identical for the two models on the same rows, so it
      vanishes when you subtract, and only each model's own wobble is left. In symbols, the variance of the difference is the sum
      of the two variances **minus twice their covariance**, and here the covariance is large.
    - |
      That the average is not the whole story. With 6 wins in 10, the difference changes sign on four splits, so it is noisy
      compared with its mean, and a sign test on 6 of 10 gives p = 0.75: no evidence of a consistent advantage. Check whether one
      or two large splits are carrying the average. Under the rules of Section 1 the verdict is "within the noise", and the
      decision passes to the cost and robustness columns.
    - |
      No. The average difference estimates a fixed quantity (about 0.008 here), so more splits would not move it in any particular
      direction; they would pin it down more precisely, and give a better estimate of its spread. By the square-root rule, 30
      splits instead of 10 would narrow the interval by about 42%. Because random splits of one file overlap, the real gain is
      smaller: about 16% by the correction in the note above. Twenty more splits would buy a little precision and no change of
      verdict.
  "6-1":
    - |
      The search picked the setting with the highest validation score on split 42, part of that score was luck specific to those
      4,521 rows, and the test rows of the same split do not share that luck, so the advantage vanished (here it even reversed).
    - |
      Candidates that really differ by more than the paired noise, and a way of scoring them that averages out luck. Concretely:
      settings that change the model substantially (much larger or smaller trees, very different numbers of trees, class weights,
      a different treatment of the categorical columns) rather than twelve close neighbours of the defaults; each candidate scored
      paired across several splits (as in Section 5) instead of on one validation set; or much more data, where validation noise
      is smaller. It also helps to decide beforehand how large a gain would be worth shipping, and ask whether the search could
      plausibly deliver it.
  "7-1":
    - |
      Any of these:
      - **Threads.** scikit-learn's histogram boosting uses every CPU core through OpenMP by default, while PyTorch uses its own
        thread setting (Note 4.3's machine reported one thread). Record the thread counts, and equalise them if you can.
      - **Stopping rules.** Boosting stopped when its held-out loss stopped improving (75 trees). The network always ran all 30
        epochs, although its best epoch across the ten splits was between 8 and 22; with early stopping its time would fall by a
        third or more.
      - **Warm-up.** The first call pays one-off costs (memory allocation, lazy initialisation). Time several repeats after a
        warm-up and take the median, as the latency cell does.
      - **Different hardware** for the two sides, or data preparation inside one timer and outside the other.
    - |
      Perhaps never, on a CPU and for data like this: both training costs grow roughly in proportion to the number of rows, so the
      ratio stays similar as the data grows. What changes it lies elsewhere. A network on a GPU against boosting on a CPU (though
      XGBoost, LightGBM and CatBoost can also train on GPUs; the table's "no" is true of scikit-learn's implementation). Very large
      datasets, where a network may need only one or two passes. And, above all, inputs such as text, images or audio, where
      boosting first needs features built by hand. The crossover point is something to measure on your data, not to assume.
  "8-1":
    - |
      Because there is only one chronological split to run. "Train on the past, test on the future" fixes the cut-off, so the test
      rows are the same every time; the only randomness left in the evaluation is which rows happened to land in that test
      period, and the bootstrap measures exactly that. (A related tool, rolling-origin evaluation, trains and tests at several
      cut-off dates. It answers a different question: whether the ranking holds across periods.)
    - |
      Anything that would change the **models** rather than the test rows: the training randomness (both fitted models are held
      fixed in every resample), which rows ended up in training and validation, and the choice of cut-off date. It also does
      not cover the next period being different again. And one limitation affects the interval itself: the bootstrap treats rows
      as independent, but calls made on the same day or in the same campaign are alike (Note 4.1 found day-level success rates
      varying enormously). Resampling whole days rather than rows would give a wider, more honest interval.
    - |
      Recalibrate on recent labelled data: fit a small calibration step (Platt scaling or isotonic regression) on the most recent
      period, or retrain with recent rows included. The share who said yes moved from about 12% across the file to 47% in the test
      period, so even shifting the model's intercept by the change in log-odds would remove much of the error. Calibration leaves
      the ranking, and so the AUC, unchanged; it fixes the probabilities, which matter as soon as anyone reads them as chances or
      puts a threshold on them. If the threshold comes from calling capacity (Note 4.1 Section 10), the ranking is what counts.
      Then keep checking calibration as each new month of outcomes arrives.

explain:
  - cell: "def run_neural_network(settings, quiet=False, results_dir=\"results\"):"
    title: "Side one, frozen"
    lines:
      - match: "settings = {**NN_SETTINGS, **settings}"
        note: "A run is described by what it changes; everything else is the frozen Day 3 recipe."
      - match: "pre = build_preprocessor(X).fit(X.iloc[split[\"train\"]])"
        note: "Scaling and one-hot categories are learned from the training rows only (Note 4.1)."
      - match: "best = {\"auc\": val_auc, \"epoch\": epoch, \"weights\": copy.deepcopy(model.state_dict())}"
        note: "A deep copy, or the stored weights would keep changing with training (Note 4.2)."
      - match: "result[\"artifacts\"] = {\"model\": model, \"preprocessor\": pre, \"split\": split,"
        note: "Added after the JSON is written, so the file holds only numbers and the objects stay in memory."

  - cell: "def run_gradient_boosting(settings, quiet=False, save=True, results_dir=\"results\"):"
    title: "Side two, the same shape"
    lines:
      - match: "early_stopping=settings[\"early_stopping\"], categorical_features=\"from_dtype\","
        note: "`from_dtype` treats every pandas `category` column as categorical, so no one-hot step is needed."
      - match: "random_state=settings[\"seed\"])"
        note: "Here the seed only chooses which 10% of the training rows early stopping holds out."
      - match: "joblib.dump(model, buffer)"
        note: "Serialised into memory, only to measure the size of the file you would ship."
      - match: "\"trees_used\": int(model.n_iter_),"
        note: "Counts every tree fitted, including the last ten that stopped improving: scikit-learn keeps them."

  - cell: "for learning_rate, leaves, l2 in itertools.product([0.05, 0.1], [15, 31, 63], [0.0, 1.0]):"
    title: "The declared search"
    lines:
      - match: "for learning_rate, leaves, l2 in itertools.product([0.05, 0.1], [15, 31, 63], [0.0, 1.0]):"
        note: "2 × 3 × 2 = 12 settings, fixed before any of them ran."
      - match: "\"test_auc\": trial[\"test\"][\"auc\"]})"
        note: "Recorded for the post-mortem in Section 6, never used to choose."
      - match: "winner = grid.iloc[0]"
        note: "The top row after sorting by validation AUC: the rule decides, not the person."

  - cell: "network = run_neural_network({\"name\": f\"bake_nn_s{seed}\", \"split_seed\": seed}, quiet=True)"
    title: "Ten splits, identical rows"
    lines:
      - match: "network = run_neural_network({\"name\": f\"bake_nn_s{seed}\", \"split_seed\": seed}, quiet=True)"
        note: "The same `split_seed` for all three models, so each split's rows are identical across them: that is the pairing."

  - cell: "def latency_ms_per_1000_rows(predict, raw_rows, repeats=5):"
    title: "Timing predictions fairly"
    lines:
      - match: "return 1000 * float(np.median(times))"
        note: "The median ignores one slow attempt, such as a first call paying for memory allocation."
      - match: "torch.tensor(network_preprocessor.transform(raw_rows).astype(np.float32)))).numpy()"
        note: "Preprocessing is inside the timed call, because production has to do it too."
      - match: "return gbdt_default[\"artifacts\"][\"model\"].predict_proba(as_categorical(raw_rows))[:, 1]"
        note: "Safe even though the 1,000 rows may lack some categories: the model maps values by name to what it saw in training."

  - cell: "network_probabilities = chronological[\"network\"][\"artifacts\"][\"test_probabilities\"]"
    title: "A paired bootstrap"
    lines:
      - match: "picked = generator.integers(0, n_rows, n_rows)          # draw n rows, with replacement"
        note: "Some rows are drawn twice and about 37% not at all; each resample is a plausible other test set."
      - match: "if chronological_labels[picked].sum() in (0, len(picked)):"
        note: "AUC needs both classes; with 4,521 rows this never actually triggers."
      - match: "differences.append(roc_auc_score(chronological_labels[picked], network_probabilities[picked])"
        note: "Both models are scored on the same resample, so the bootstrap is paired too."
      - match: "low, high = np.percentile(differences, [2.5, 97.5])"
        note: "The percentile interval: the middle 95% of the resampled differences."

  - cell: "def experiment_record(result, why, learned, next_change, results_dir=\"results\"):"
    title: "The record"
    lines:
      - match: "raise ValueError(\"a record needs both a reason and a lesson\")"
        note: "Refuses to write a record with the two answers only a person can supply (Note 4.2)."

takeaways:
  - "Write the rules before the first result: the question, the splits, the measure, the tuning budget, the decision rule and what would change your mind."
  - "Compare on identical rows and read the paired difference. Each model alone spread by 0.013; their difference by 0.005, with boosting ahead on 10 of 10 splits."
  - "Random splits of one file overlap, so a plain paired test is too confident. Corrected, boosting's +0.008 still holds (95% interval +0.003 to +0.013)."
  - "Judge tuning the same way: paired, across splits. The best of twelve settings on one validation set won by luck and added +0.001, winning 5 of 10."
  - "Accuracy is one column. Boosting trained 14 times faster and ships as one file; the network predicted twice as fast from a file twelve times smaller."
  - "Test the deployment condition. Chronologically the ranking reversed (network +0.030, interval +0.017 to +0.044) and both models fell towards guessing. Before explaining a reversal, check that both models saw the same information."
  - "On tabular data of this size, gradient boosting is the baseline to beat. Networks earn their place when they learn representations from raw text, images, audio and sequences."

quiz:
  - q: "Two models are scored on the same ten splits. Why is the spread of their difference much smaller than either model's spread?"
    options: ["The difference is averaged more", "The split's difficulty is shared by both scores and cancels in the subtraction", "Boosting is more stable", "Ten splits is enough to remove noise"]
    answer: 1
    why: "Here the two models' scores correlate at 0.94 across splits."
  - q: "Each model's test AUC varies by 0.013 across splits; the gap between their averages is 0.008, and one wins on all ten paired splits. The verdict?"
    options: ["Inconclusive: the gap is smaller than the noise", "A small, real difference", "A large difference", "Cannot tell without more models"]
    answer: 1
    why: "A gap smaller than the spread of single scores can still be real when the paired difference is consistent."
  - q: "The best of twelve settings beat the default on validation, then lost on the test rows of the same split. Most likely?"
    options: ["The test set is broken", "Picking the best of twelve noisy scores picks up luck that does not transfer", "The setting overfits the training rows", "Boosting cannot be tuned"]
    answer: 1
    why: "Across ten splits the tuned setting added +0.0012 and won 5 of 10: a coin toss."
  - q: "In Section 8's bootstrap, what is resampled?"
    options: ["The training rows, refitting both models each time", "The test rows, with both fitted models held fixed", "The random seeds", "The cut-off date"]
    answer: 1
    why: "So the interval covers which test rows you happened to have, not training randomness."
  - q: "Why is ten random splits of one file weaker evidence than ten independent datasets?"
    options: ["It is not weaker", "The splits share most of their rows, so their results are correlated", "Random splits are biased", "Ten is too few to compute a mean"]
    answer: 1
    why: "Hence the corrected test, and why more splits stop narrowing the interval."
  - q: "The two models rank customers with a Spearman correlation of 0.87, and averaging them gives 0.8163 against 0.8160. What follows?"
    options: ["Always ship both", "They make different errors, but combining them bought almost nothing here", "They are identical models", "Averaging is always worse"]
    answer: 1
    why: "Not worth maintaining a second model on this evidence; check it paired across splits before deciding."
  - q: "Under the chronological split the network picked its epoch on the later-period validation rows, while boosting stopped using a slice of its training rows. Why does that matter?"
    options: ["It does not", "One model was tuned on rows closer to the test period, which could explain part of the reversal", "Boosting cannot use validation rows", "It makes the network slower"]
    answer: 1
    why: "Give both models the same information before crediting the reversal to smoothness."

docstrings:
  load_bank_marketing: |
    Download Bank Marketing if needed and return its inputs and label.

    ``duration`` is dropped because a call's length is only known after the call.

    Args:
        path: Where the CSV is (or will be) stored.

    Returns:
        A tuple ``(X, y)``: the 15-column input DataFrame and a float32 label array
        (1 = subscribed).

    Raises:
        urllib.error.URLError: If the file is missing and UCI cannot be reached.
  make_split: |
    Split row numbers into training, validation and test sets (Note 4.1's rules).

    Args:
        y: Labels, one per row; used to stratify the random rule.
        policy: ``"stratified"`` (random rows, class balance kept) or
            ``"chronological"`` (file order: earliest rows for training, latest for test).
        fractions: Shares for training, validation and test.
        seed: Seed for the stratified rule; ignored by the chronological one.

    Returns:
        A dict ``{"train", "val", "test"}`` of NumPy arrays of row numbers.
  build_preprocessor: |
    Build an unfitted preprocessor that scales numeric columns and one-hot encodes the rest.

    Args:
        X: The input table; used only to find which columns are numeric.

    Returns:
        An unfitted ``ColumnTransformer`` (unseen categories become all zeros). Fit it on
        training rows only.
  seed_everything: |
    Seed Python's, NumPy's and PyTorch's random number generators.

    Args:
        seed: The seed for all three.
  run_neural_network: |
    Train the frozen Day 3 network once on one split and report its scores.

    Seeds everything, splits, fits the preprocessing on the training rows, trains with
    AdamW for ``epochs`` epochs, keeps the epoch with the best validation ROC-AUC, then
    scores the test rows once. Writes ``<results_dir>/<name>.json``.

    Args:
        settings: Overrides for ``NN_SETTINGS`` (for example ``name``, ``split``,
            ``split_seed``).
        quiet: Skip the one-line summary.
        results_dir: Folder for the JSON result.

    Returns:
        A dict with the settings, best epoch, validation AUC, test metrics (ROC-AUC, PR-AUC,
        accuracy, share of positives, average prediction) and ``seconds``, which includes
        the per-epoch validation scoring. ``artifacts`` holds the model, preprocessor, split
        and test probabilities.
  run_neural_network.probabilities_for: |
    Score preprocessed rows with the current model, in evaluation mode and without a graph.

    Args:
        inputs: A float32 tensor of preprocessed rows.

    Returns:
        A 1-D NumPy array of probabilities, one per row.
  as_categorical: |
    Mark the non-numeric columns as pandas categories, for native categorical splits.

    Args:
        frame: A DataFrame of raw columns.

    Returns:
        A copy with every non-numeric column converted to the ``category`` dtype.
  run_gradient_boosting: |
    Fit ``HistGradientBoostingClassifier`` once on one split and report its scores.

    Takes the raw columns from ``X_trees`` (categories marked, no scaling), with the same
    split rules and result shape as ``run_neural_network``.

    Args:
        settings: Overrides for ``GBDT_SETTINGS`` (learning rate, leaves, L2 penalty,
            ``max_iter``, ``early_stopping``, split and seed).
        quiet: Skip the one-line summary.
        save: Write ``<results_dir>/<name>.json``.
        results_dir: Folder for the JSON result.

    Returns:
        A dict with the settings, ``trees_used``, validation AUC, test metrics, fit
        ``seconds`` and ``artifact_bytes`` (the pickled model's size). ``artifacts`` holds
        the model, split and test probabilities.
  bare_training_seconds: |
    Time the network's training loop alone, with no validation scoring between epochs.

    Uses the preprocessed rows of split 42 and the frozen Day 3 settings.

    Args:
        epochs: Passes over the training rows.

    Returns:
        Seconds spent in the training loop.
  latency_ms_per_1000_rows: |
    Median time to score 1,000 raw rows, preprocessing included.

    Args:
        predict: A function from raw rows (a DataFrame) to probabilities.
        raw_rows: At least 1,000 raw rows; the first 1,000 are used.
        repeats: How many timed attempts to take the median of.

    Returns:
        Milliseconds per 1,000 rows.
  network_predict: |
    Score raw rows with the reference network: preprocess, forward pass, sigmoid.

    Args:
        raw_rows: A DataFrame of raw input columns.

    Returns:
        A NumPy array of probabilities, one row per input row.
  boosting_predict: |
    Score raw rows with the default gradient-boosting model.

    Args:
        raw_rows: A DataFrame of raw input columns.

    Returns:
        A NumPy array with the probability of "yes" for each row.
  experiment_record: |
    Write ``<results_dir>/<name>.md``: the five questions every experiment should answer.

    Args:
        result: A result dict from ``run_neural_network`` or ``run_gradient_boosting``.
        why: Why the experiment was run; only a person can supply this.
        learned: What it taught; only a person can supply this.
        next_change: What to change next.
        results_dir: Folder for the record.

    Returns:
        The path of the Markdown file written.

    Raises:
        ValueError: If ``why`` or ``learned`` is empty.
