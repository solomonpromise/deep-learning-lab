quiz:
- q: What connects raw text to a readable prediction?
  options:
  - Preprocessing, tokenization, model computation and output decoding.
  - The optimizer at inference.
  - A model card's prose alone.
  answer: 0
  why: Preprocessing, tokenization, model computation and output decoding.
- q: What does a padding mask prevent?
  options:
  - Reading padded positions as usable keys in attention.
  - All future access automatically in every model.
  - Truncation of every input.
  answer: 0
  why: Reading padded positions as usable keys in attention.
- q: What should be saved with the model?
  options:
  - Its tokenizer, configuration and relevant inference settings.
  - Only a screenshot of predictions.
  - Only the repository name with no revision.
  answer: 0
