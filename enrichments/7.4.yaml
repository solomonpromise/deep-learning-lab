summary: What happens between loading a model by name and getting a trustworthy prediction,
  and how do we control each step?
answers:
  3-1:
  - 'For example: a different `max_length` (the model would see different amounts
    of each long review), leaving out the attention mask in one of them (padded reviews
    would change), running one in train mode (dropout would add noise), or pairing
    the model with a different tokeniser. Any of these changes the model''s input
    or behaviour, not just the arithmetic.'
  4-1:
  - 'The longer review is cut to 256 tokens, so the batch is padded to 256: `input_ids`
    has shape `(2, 256)`. The first review has 40 real tokens (including `[CLS]` and
    `[SEP]`), so its mask row has 40 ones and 256 − 40 = 216 zeros.'
  4-2:
  - 'The same, `[0.994, 0.006]`. Both logits were increased by 10, and softmax depends
    only on the differences between logits: adding 10 multiplies every exponential
    by the same factor, which cancels when dividing by the sum. The difference is
    5.11 in both cases.'
  5-1:
  - The model is probably in train mode, so dropout makes every run slightly different.
    Check with `model.training` (it should be `False`), or run the same input twice
    and compare the outputs. If they differ, call `model.eval()` before evaluating.
  6-1:
  - Batch the reviews (for example 32 at a time) instead of processing them one by
    one, and sort them by length so each batch has little padding. Truncating to a
    sensible `max_length` also helps. If you sort, you must keep track of each review's
    original position and put the predictions back in the original order; otherwise
    predictions get attached to the wrong reviews.
  7-1:
  - 'You saved the model but not the tokeniser: also run `tokenizer.save_pretrained("my-model")`.
    It matters because the model only understands token IDs from its own tokeniser.
    If your colleague loads a tokeniser from somewhere else, the IDs may mean different
    tokens (or come from a different vocabulary), and the model''s predictions would
    be wrong, possibly without any error.'
