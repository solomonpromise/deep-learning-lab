summary: What is inside a Transformer block, and why does each part matter?
answers:
  3-1:
  - Because the attention sub-layer, which comes first in every block, has already
    mixed information from other tokens into each token's vector. The FFN then processes
    that context-rich vector. Attention gathers; the FFN processes what was gathered.
  4-1:
  - 'It passes the input through unchanged: `x + 0 = x`. This is one reason residual
    blocks are easy to train: a block that has not learned anything useful yet does
    no harm.'
  5-1:
  - All 64 numbers equal the mean, so the variance is 0, and dividing by √0 would
    mean dividing by zero. Adding 1e-5 inside the square root keeps the division safe;
    the result is simply a vector of zeros (before the learnable shift).
  6-1:
  - Either switch to pre-norm blocks, which trained well with the same learning rate,
    or add a learning-rate warmup, which rescued post-norm on both seeds. Lowering
    the learning rate is a third reasonable option.
  7-1:
  - With one block, the gradient has only one sub-layer pair to pass through, so enough
    of it reaches the embeddings. With six blocks and no residual path, the gradient
    must pass through twelve sub-layers in turn and arrives much weaker, so the early
    layers barely learn, and the input information is replaced rather than refined
    at every step.
