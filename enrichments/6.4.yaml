quiz:
- q: Why keep a block's input and output shapes equal?
  options:
  - The residual additions and stacking need compatible vector shapes.
  - It forces every token vector to remain unchanged.
  - It makes attention weights independent of the input.
  answer: 0
  why: The residual additions and stacking need compatible vector shapes.
- q: Why do residual additions help optimisation?
  options:
  - They provide a direct identity path in addition to the transformed branch.
  - They force gradients to equal one everywhere.
  - They eliminate every possible training instability.
  answer: 0
  why: They provide a direct identity path in addition to the transformed branch.
- q: Why can depth add useful computation?
  options:
  - Later blocks process representations already contextualised by earlier blocks.
  - Each layer simply repeats the exact same token vector.
  - Every extra block guarantees better validation loss.
  answer: 0
  why: Later blocks process representations already contextualised by earlier blocks.
