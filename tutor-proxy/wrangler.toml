# Cloudflare Worker that relays tutor requests to Groq without exposing the API key.
# Deploy:   npx wrangler login
#           npx wrangler deploy
#           npx wrangler secret put GROQ_API_KEY      (paste the key when asked)
name = "deep-learning-lab-tutor"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Sites allowed to call the tutor (comma-separated, no trailing slashes).
ALLOWED_ORIGINS = "https://solomonpromise.github.io,http://localhost:8000,http://localhost:8765"
MODEL = "qwen/qwen3.8-27b"
REASONING_EFFORT = "low"
MAX_TOKENS = "1400"

# Per-visitor rate limit: 20 questions per minute per IP address (counted per Cloudflare location).
# worker.js reads it as env.RATE_LIMITER and answers 429 when a visitor goes over. `period` must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
